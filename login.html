<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>AURA ARMAN TOUR - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #172554 0%,
                    #050816 38%,
                    #020617 100%
                );
            color: white;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .glass {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(96, 165, 250, 0.16);
            box-shadow:
                0 25px 80px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.03);
            backdrop-filter: blur(20px);
        }

        .input {
            width: 100%;
            background: #050811;
            border: 1px solid #1e293b;
            color: white;
            border-radius: 14px;
            padding: 13px 14px;
            outline: none;
            transition: .2s;
        }

        .input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.12);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 13px 18px;
            border-radius: 14px;
            background: #0f172a;
            border: 1px solid #334155;
            box-shadow: 0 15px 50px rgba(0,0,0,.45);
            font-size: 13px;
            font-weight: 700;
            max-width: 90%;
            text-align: center;
        }

        .debug-box {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 12px;
            font-size: 10px;
            line-height: 1.7;
            color: #94a3b8;
        }

        .debug-value {
            color: #e2e8f0;
            word-break: break-all;
        }

    </style>

</head>


<body>

    <main
        class="min-h-screen flex items-center justify-center px-4 py-8"
    >

        <div class="w-full max-w-md">

            <!-- LOGO -->

            <div class="text-center mb-7">

                <div
                    class="w-24 h-24 mx-auto rounded-3xl overflow-hidden
                           border border-blue-400/20
                           shadow-2xl shadow-blue-900/30 mb-4"
                >

                    <img
                        src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
                        class="w-full h-full object-cover"
                        alt="AURA"
                    >

                </div>


                <h1
                    class="text-2xl font-black tracking-wide"
                >
                    AURA ARMAN TOUR
                </h1>

                <p
                    class="text-xs text-slate-500 mt-1"
                >
                    Welcome back
                </p>

            </div>


            <!-- LOGIN CARD -->

            <section
                class="glass rounded-3xl p-6"
            >

                <div class="mb-5">

                    <h2
                        class="text-xl font-black"
                    >
                        Login
                    </h2>

                    <p
                        class="text-xs text-slate-500 mt-1"
                    >
                        Sign in to continue
                    </p>

                </div>


                <form
                    id="loginForm"
                    class="space-y-4"
                >

                    <!-- USERNAME / EMAIL -->

                    <div>

                        <label
                            class="block text-xs font-bold text-slate-400 mb-2"
                        >
                            Username / Gmail
                        </label>

                        <input
                            id="loginIdentity"
                            type="text"
                            autocomplete="username"
                            class="input"
                            placeholder="Username or Gmail"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div>

                        <label
                            class="block text-xs font-bold text-slate-400 mb-2"
                        >
                            Password
                        </label>

                        <div class="relative">

                            <input
                                id="loginPassword"
                                type="password"
                                autocomplete="current-password"
                                class="input pr-12"
                                placeholder="Password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500"
                            >

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- REMEMBER -->

                    <label
                        class="flex items-center gap-2 text-xs text-slate-400"
                    >

                        <input
                            id="rememberMe"
                            type="checkbox"
                            class="accent-blue-600"
                        >

                        Remember me

                    </label>


                    <!-- LOGIN -->

                    <button
                        id="loginButton"
                        type="submit"
                        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600
                               hover:from-blue-500 hover:to-indigo-500
                               py-3.5 rounded-2xl font-black text-sm
                               shadow-lg shadow-blue-900/20
                               transition"
                    >

                        <i class="fa-solid fa-right-to-bracket mr-2"></i>

                        Login

                    </button>

                </form>


                <!-- REGISTER -->

                <div
                    class="text-center mt-5 text-xs text-slate-500"
                >

                    Don't have an account?

                    <a
                        href="./register.html"
                        class="text-blue-400 font-bold"
                    >
                        Register
                    </a>

                </div>


                <!-- NOTIFICATION -->

                <button
                    id="notificationButton"
                    type="button"
                    class="w-full mt-5 bg-slate-800 hover:bg-slate-700
                           border border-slate-700
                           py-3 rounded-2xl text-xs font-bold"
                >

                    <i
                        class="fa-solid fa-bell text-blue-400 mr-2"
                    ></i>

                    Enable Notifications

                </button>


                <!-- DEBUG -->

                <details class="mt-5">

                    <summary
                        class="cursor-pointer text-[10px] text-slate-600"
                    >
                        OneSignal Debug
                    </summary>

                    <div
                        id="debugBox"
                        class="debug-box mt-3"
                    >

                        Loading...

                    </div>

                </details>

            </section>

        </div>

    </main>


    <script type="module">

        import {

            auth,
            db,
            linkOneSignalUser,
            getOneSignalDebugInfo

        } from "./firebase.js";


        import {

            signInWithEmailAndPassword,
            onAuthStateChanged

        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


        import {

            collection,
            query,
            where,
            getDocs

        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        // ====================================================
        // ELEMENTS
        // ====================================================

        const form =
            document.getElementById("loginForm");

        const identityInput =
            document.getElementById("loginIdentity");

        const passwordInput =
            document.getElementById("loginPassword");

        const loginButton =
            document.getElementById("loginButton");

        const notificationButton =
            document.getElementById("notificationButton");

        const debugBox =
            document.getElementById("debugBox");

        const rememberMe =
            document.getElementById("rememberMe");


        // ====================================================
        // TOAST
        // ====================================================

        function toast(message) {

            const old =
                document.querySelector(".toast");

            if (old) old.remove();


            const el =
                document.createElement("div");

            el.className =
                "toast";

            el.textContent =
                message;

            document.body.appendChild(el);


            setTimeout(() => {

                el.remove();

            }, 3200);
        }


        // ====================================================
        // PASSWORD SHOW/HIDE
        // ====================================================

        document
            .getElementById("togglePassword")
            .addEventListener("click", () => {

                const icon =
                    document
                        .querySelector("#togglePassword i");


                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    icon.className =
                        "fa-solid fa-eye-slash";

                } else {

                    passwordInput.type =
                        "password";

                    icon.className =
                        "fa-solid fa-eye";
                }

            });


        // ====================================================
        // REMEMBER LOGIN
        // ====================================================

        const savedIdentity =
            localStorage.getItem(
                "aura_login_identity"
            );

        if (savedIdentity) {

            identityInput.value =
                savedIdentity;

            rememberMe.checked =
                true;
        }


        // ====================================================
        // FIND EMAIL FROM USERNAME
        // ====================================================

        async function resolveEmail(identity) {

            const value =
                identity.trim();


            if (
                value.includes("@")
            ) {

                return value;
            }


            const collections =
                ["users"];


            for (
                const collectionName
                of collections
            ) {

                const usernameQueries = [

                    query(
                        collection(
                            db,
                            collectionName
                        ),
                        where(
                            "username",
                            "==",
                            value
                        )
                    ),

                    query(
                        collection(
                            db,
                            collectionName
                        ),
                        where(
                            "userName",
                            "==",
                            value
                        )
                    )

                ];


                for (
                    const q
                    of usernameQueries
                ) {

                    try {

                        const snap =
                            await getDocs(q);


                        if (
                            !snap.empty
                        ) {

                            const data =
                                snap.docs[0].data();


                            if (
                                data.email
                            ) {

                                return String(
                                    data.email
                                ).trim();
                            }
                        }

                    } catch (error) {

                        console.warn(
                            "Username lookup error:",
                            error
                        );
                    }
                }
            }


            return null;
        }


        // ====================================================
        // LOGIN
        // ====================================================

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const identity =
                    identityInput.value.trim();

                const password =
                    passwordInput.value;


                if (
                    !identity ||
                    !password
                ) {

                    toast(
                        "Username/Gmail এবং password দিন।"
                    );

                    return;
                }


                loginButton.disabled =
                    true;

                loginButton.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Logging in...';


                try {

                    const email =
                        await resolveEmail(
                            identity
                        );


                    if (!email) {

                        throw new Error(
                            "Username/Gmail পাওয়া যায়নি।"
                        );
                    }


                    // ----------------------------------------
                    // FIREBASE LOGIN
                    // ----------------------------------------

                    const credential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const firebaseUser =
                        credential.user;


                    // ----------------------------------------
                    // REMEMBER
                    // ----------------------------------------

                    if (
                        rememberMe.checked
                    ) {

                        localStorage.setItem(
                            "aura_login_identity",
                            identity
                        );

                    } else {

                        localStorage.removeItem(
                            "aura_login_identity"
                        );
                    }


                    toast(
                        "Login successful. OneSignal linking হচ্ছে..."
                    );


                    // ----------------------------------------
                    // MEDIAN ONESIGNAL
                    // ----------------------------------------

                    const osResult =
                        await linkOneSignalUser(
                            firebaseUser
                        );


                    console.log(
                        "Final OneSignal result:",
                        osResult
                    );


                    if (
                        osResult.success
                    ) {

                        toast(
                            "Login + OneSignal linking successful!"
                        );

                    } else {

                        console.warn(
                            "OneSignal link failed:",
                            osResult
                        );

                        toast(
                            "Login successful. Push linking এখনো হয়নি।"
                        );
                    }


                    // ----------------------------------------
                    // DEBUG
                    // ----------------------------------------

                    await updateDebug();


                    // ----------------------------------------
                    // REDIRECT
                    // ----------------------------------------

                    setTimeout(() => {

                        window.location.href =
                            "./index.html";

                    }, 700);


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    let message =
                        error?.message ||
                        "Login failed.";


                    if (
                        error?.code ===
                        "auth/invalid-credential"
                    ) {

                        message =
                            "Gmail/Username অথবা password ভুল।";
                    }


                    toast(message);


                    loginButton.disabled =
                        false;

                    loginButton.innerHTML =
                        '<i class="fa-solid fa-right-to-bracket mr-2"></i> Login';
                }

            }
        );


        // ====================================================
        // NOTIFICATION BUTTON
        // ====================================================

        notificationButton.addEventListener(
            "click",
            async () => {

                try {

                    if (
                        !window.median?.onesignal
                    ) {

                        toast(
                            "এই buttonটি Median APK-এর ভিতরে ব্যবহার করুন।"
                        );

                        return;
                    }


                    // Median's native OneSignal permission
                    // registration is controlled by Median.
                    // We refresh the OneSignal info.

                    const user =
                        auth.currentUser;


                    if (user) {

                        await linkOneSignalUser(
                            user
                        );
                    }


                    await updateDebug();


                    toast(
                        "OneSignal information updated."
                    );


                } catch (error) {

                    console.error(
                        error
                    );

                    toast(
                        "Notification setup failed."
                    );
                }

            }
        );


        // ====================================================
        // DEBUG
        // ====================================================

        async function updateDebug() {

            try {

                const info =
                    await getOneSignalDebugInfo();


                debugBox.innerHTML = `

                    <div>
                        Firebase UID:
                        <span class="debug-value">
                            ${escapeHtml(info.firebaseUid || "Not available")}
                        </span>
                    </div>

                    <div>
                        External ID:
                        <span class="debug-value">
                            ${escapeHtml(info.externalId || "Not available")}
                        </span>
                    </div>

                    <div>
                        OneSignal User ID:
                        <span class="debug-value">
                            ${escapeHtml(info.oneSignalId || "Not available")}
                        </span>
                    </div>

                    <div>
                        Subscription ID:
                        <span class="debug-value">
                            ${escapeHtml(info.subscriptionId || "Not available")}
                        </span>
                    </div>

                    <div>
                        Subscribed:
                        <span class="debug-value">
                            ${String(
                                info.optedIn ??
                                "Not available"
                            )}
                        </span>
                    </div>

                    <div>
                        Privacy Consent:
                        <span class="debug-value">
                            ${String(
                                info.requiresUserPrivacyConsent ??
                                "Not available"
                            )}
                        </span>
                    </div>

                    <div>
                        SDK:
                        <span class="debug-value">
                            ${escapeHtml(info.sdk || "Unknown")}
                        </span>
                    </div>

                    <div>
                        Native Bridge:
                        <span class="debug-value">
                            ${String(
                                info.nativeBridge
                            )}
                        </span>
                    </div>

                `;

            } catch (error) {

                debugBox.textContent =
                    "Debug error: " +
                    (
                        error?.message ||
                        error
                    );
            }
        }


        // ====================================================
        // HTML ESCAPE
        // ====================================================

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        // ====================================================
        // AUTH STATE
        // ====================================================

        onAuthStateChanged(
            auth,
            async (user) => {

                if (user) {

                    console.log(
                        "Firebase user already logged in:",
                        user.uid
                    );


                    // Important:
                    // Median recommends calling login
                    // as soon as authentication exists.

                    try {

                        await linkOneSignalUser(
                            user
                        );

                    } catch (error) {

                        console.warn(
                            "Automatic OneSignal linking failed:",
                            error
                        );
                    }


                    await updateDebug();
                }
            }
        );


        // Initial debug

        updateDebug();


        // Refresh debug

        setTimeout(
            updateDebug,
            3000
        );

        setTimeout(
            updateDebug,
            8000
        );

    </script>

</body>

</html>
