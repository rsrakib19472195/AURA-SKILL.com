<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AURA ARMAN TOUR - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, sans-serif;
        }

        body {
            background: #050816;
            color: #fff;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =====================================================
           BACKGROUND
        ===================================================== */

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: -1;
        }

        .orb-one {
            width: 260px;
            height: 260px;
            background: rgba(124, 58, 237, .20);
            top: -80px;
            left: -80px;
        }

        .orb-two {
            width: 240px;
            height: 240px;
            background: rgba(6, 182, 212, .12);
            right: -70px;
            top: 20%;
        }

        .orb-three {
            width: 260px;
            height: 260px;
            background: rgba(236, 72, 153, .10);
            bottom: -100px;
            left: 20%;
        }

        /* =====================================================
           STARTUP LOADER
        ===================================================== */

        #startupLoader {
            position: fixed;
            inset: 0;
            z-index: 30000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050816;
            transition: opacity .45s ease, visibility .45s ease;
        }

        #startupLoader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            text-align: center;
        }

        .loader-logo {
            width: 92px;
            height: 92px;
            border-radius: 26px;
            object-fit: cover;
            animation: loaderPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 45px rgba(124, 58, 237, .35);
        }

        @keyframes loaderPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        .loader-title {
            margin-top: 18px;
            font-size: 23px;
            font-weight: 800;
        }

        .loader-subtitle {
            margin-top: 5px;
            color: #94a3b8;
            font-size: 13px;
        }

        .loader-dots {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .loader-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8b5cf6;
            animation: loaderDot 1s infinite;
        }

        .loader-dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .loader-dots span:nth-child(3) {
            animation-delay: .30s;
        }

        @keyframes loaderDot {
            0%, 70%, 100% {
                opacity: .25;
                transform: translateY(0);
            }

            35% {
                opacity: 1;
                transform: translateY(-5px);
            }
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 16px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 28px 22px 24px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 28px;
            background: rgba(9, 14, 32, .82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 30px 80px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.04);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 82px;
            height: 82px;
            border-radius: 23px;
            object-fit: cover;
            box-shadow: 0 0 35px rgba(124,58,237,.25);
        }

        .brand-title {
            margin-top: 14px;
            font-size: 23px;
            font-weight: 800;
        }

        .brand-subtitle {
            margin-top: 5px;
            color: #94a3b8;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            height: 50px;
            padding: 0 45px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,.08);
            outline: none;
            color: #fff;
            background: rgba(255,255,255,.045);
            transition: .2s;
        }

        .input-wrap input:focus {
            border-color: rgba(139,92,246,.65);
            box-shadow: 0 0 0 3px rgba(139,92,246,.10);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: none;
            color: #64748b;
            cursor: pointer;
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0 18px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #94a3b8;
        }

        .remember input {
            accent-color: #8b5cf6;
        }

        .forgot-btn {
            border: 0;
            background: transparent;
            color: #a78bfa;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            height: 51px;
            border: 0;
            border-radius: 15px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(
                135deg,
                #7c3aed,
                #6366f1,
                #8b5cf6
            );
            box-shadow: 0 12px 30px rgba(124,58,237,.22);
            transition: .2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        .register-text {
            text-align: center;
            margin-top: 19px;
            color: #94a3b8;
            font-size: 13px;
        }

        .register-text a {
            color: #a78bfa;
            font-weight: 700;
            text-decoration: none;
        }

        .support-box {
            margin-top: 18px;
            padding: 13px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,.06);
            background: rgba(255,255,255,.025);
            text-align: center;
        }

        .support-box p {
            margin: 0 0 9px;
            color: #94a3b8;
            font-size: 11px;
        }

        .support-box a {
            color: #22c55e;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            color: #475569;
            font-size: 10px;
        }

        /* =====================================================
           OVERLAYS
        ===================================================== */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 18000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            overflow-y: auto;
        }

        .overlay.show {
            display: flex;
        }

        /* =====================================================
           BAN SCREEN
        ===================================================== */

        #banScreen {
            z-index: 19000;

            background:
                radial-gradient(
                    circle at 50% 8%,
                    rgba(239, 68, 68, .18),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(124, 58, 237, .10),
                    transparent 35%
                ),
                #050816;
        }

        .ban-card {
            width: 100%;
            max-width: 430px;
            padding: 30px 22px 24px;
            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(15,23,42,.97),
                    rgba(7,12,28,.97)
                );

            border: 1px solid rgba(239,68,68,.14);
            border-radius: 28px;

            box-shadow:
                0 30px 90px rgba(0,0,0,.55),
                0 0 55px rgba(239,68,68,.08);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            animation: banCardIn .55s ease;
        }

        @keyframes banCardIn {

            from {
                opacity: 0;
                transform: translateY(22px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Animated Logo */

        .ban-logo-wrap {
            position: relative;
            width: 104px;
            height: 104px;
            margin: 0 auto 22px;
            padding: 4px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #f97316,
                    #ec4899,
                    #7c3aed
                );

            box-shadow:
                0 0 30px rgba(239,68,68,.28),
                0 0 60px rgba(236,72,153,.12);

            animation:
                banLogoFloat 3s ease-in-out infinite,
                banLogoGlow 2s ease-in-out infinite;
        }

        .ban-logo-wrap::before {
            content: "";
            position: absolute;
            inset: -7px;

            border-radius: 34px;
            border: 1px solid rgba(239,68,68,.18);

            animation: banLogoRing 2.2s linear infinite;
        }

        .ban-logo-wrap::after {
            content: "";
            position: absolute;
            inset: -14px;

            border-radius: 39px;
            border: 1px solid rgba(236,72,153,.10);

            animation: banLogoRing 3.2s linear infinite reverse;
        }

        .ban-logo {
            width: 100%;
            height: 100%;
            display: block;

            object-fit: cover;
            border-radius: 26px;

            background: #050816;

            position: relative;
            z-index: 2;
        }

        @keyframes banLogoFloat {

            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-7px) rotate(1deg);
            }
        }

        @keyframes banLogoGlow {

            0%, 100% {
                box-shadow:
                    0 0 30px rgba(239,68,68,.25);
            }

            50% {
                box-shadow:
                    0 0 48px rgba(239,68,68,.42);
            }
        }

        @keyframes banLogoRing {

            0% {
                transform: rotate(0deg) scale(.95);
                opacity: .25;
            }

            50% {
                opacity: .8;
            }

            100% {
                transform: rotate(360deg) scale(1.05);
                opacity: .25;
            }
        }

        .ban-title {
            margin: 0;
            font-size: 26px;
            line-height: 1.2;
            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #fff,
                    #fecaca,
                    #fff
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .ban-subtitle {
            margin: 9px 0 0;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
        }

        .ban-status {
            margin: 22px 0 15px;
            padding: 12px 14px;

            border-radius: 15px;

            border: 1px solid rgba(239,68,68,.13);
            background: rgba(239,68,68,.055);

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            color: #fca5a5;
            font-size: 12px;
            font-weight: 700;
        }

        .ban-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;

            box-shadow:
                0 0 0 5px rgba(239,68,68,.08),
                0 0 14px rgba(239,68,68,.7);

            animation: banDotPulse 1.5s infinite;
        }

        @keyframes banDotPulse {

            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(.75);
                opacity: .55;
            }
        }

        .ban-message {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.75;
            margin: 0;
        }

        .reason-box {
            margin-top: 17px;
            padding: 15px;
            border-radius: 17px;

            text-align: left;

            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
        }

        .reason-label {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #fca5a5;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .reason-text {
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        /* =====================================================
           LIVE COUNTDOWN
        ===================================================== */

        .countdown-box {
            margin-top: 17px;
            padding: 16px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(124,58,237,.08),
                    rgba(239,68,68,.055)
                );

            border: 1px solid rgba(124,58,237,.14);
        }

        .countdown-label {
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 12px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }

        .time-box {
            min-width: 0;
            padding: 10px 4px;

            border-radius: 12px;

            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.06);
        }

        .time-value {
            display: block;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            line-height: 1.2;
        }

        .time-label {
            display: block;
            margin-top: 4px;
            color: #64748b;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .permanent-box {
            margin-top: 17px;
            padding: 15px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    rgba(239,68,68,.08),
                    rgba(127,29,29,.08)
                );

            border: 1px solid rgba(239,68,68,.13);

            color: #fecaca;
            font-size: 13px;
            line-height: 1.7;
        }

        .ban-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-top: 19px;
        }

        .ban-btn {
            height: 46px;
            border-radius: 13px;
            border: 1px solid rgba(255,255,255,.07);
            cursor: pointer;

            color: #fff;
            font-size: 12px;
            font-weight: 700;

            background: rgba(255,255,255,.045);
            transition: .2s;
        }

        .ban-btn:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,.07);
        }

        .ban-support {
            background:
                linear-gradient(
                    135deg,
                    rgba(124,58,237,.85),
                    rgba(99,102,241,.85)
                );

            border-color: transparent;
        }

        .ban-footer {
            margin-top: 17px;
            color: #475569;
            font-size: 9px;
        }

        /* =====================================================
           MAINTENANCE
        ===================================================== */

        #maintenanceScreen {
            background: #050816;
        }

        .simple-overlay-card {
            width: 100%;
            max-width: 400px;
            padding: 28px 22px;
            text-align: center;
            border-radius: 25px;
            background: rgba(9,14,32,.95);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 30px 80px rgba(0,0,0,.5);
        }

        .simple-overlay-icon {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: rgba(124,58,237,.12);
            color: #a78bfa;
            font-size: 28px;
        }

        .simple-overlay-card h2 {
            margin: 0;
            font-size: 21px;
            font-weight: 800;
        }

        .simple-overlay-card p {
            margin: 10px 0 0;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.7;
        }

        /* =====================================================
           UPDATE
        ===================================================== */

        #updateScreen {
            background: #050816;
        }

        /* =====================================================
           NOTIFICATION
        ===================================================== */

        #customNotifBanner {
            position: fixed;
            left: 14px;
            right: 14px;
            bottom: 14px;
            z-index: 17000;
            display: none;

            max-width: 430px;
            margin: auto;

            padding: 14px;

            border-radius: 17px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(15,23,42,.96);

            box-shadow: 0 20px 60px rgba(0,0,0,.4);
            backdrop-filter: blur(15px);
        }

        #customNotifBanner.show {
            display: block;
        }

        .notif-title {
            font-weight: 700;
            font-size: 13px;
        }

        .notif-text {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.5;
        }

        .notif-actions {
            display: flex;
            gap: 8px;
            margin-top: 11px;
        }

        .notif-actions button {
            flex: 1;
            height: 38px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .notif-allow {
            color: #fff;
            background: #7c3aed;
        }

        .notif-close {
            color: #cbd5e1;
            background: rgba(255,255,255,.05);
        }

        /* =====================================================
           TOAST
        ===================================================== */

        #toastContainer {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 25000;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;

            pointer-events: none;
        }

        .toast {
            width: max-content;
            max-width: 92%;
            padding: 11px 15px;

            border-radius: 13px;

            color: #fff;
            background: rgba(15,23,42,.95);

            border: 1px solid rgba(255,255,255,.08);

            box-shadow: 0 15px 40px rgba(0,0,0,.35);

            font-size: 12px;
            animation: toastIn .25s ease;
        }

        .toast.error {
            border-color: rgba(239,68,68,.2);
        }

        .toast.success {
            border-color: rgba(34,197,94,.2);
        }

        @keyframes toastIn {

            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width: 380px) {

            .ban-card {
                padding: 26px 17px 20px;
            }

            .ban-logo-wrap {
                width: 92px;
                height: 92px;
            }

            .ban-title {
                font-size: 23px;
            }

            .time-value {
                font-size: 16px;
            }
        }

    </style>
</head>

<body>

    <!-- Background -->
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>
    <div class="bg-orb orb-three"></div>


    <!-- =====================================================
         STARTUP LOADER
    ====================================================== -->

    <div id="startupLoader">

        <div class="loader-content">

            <img
                class="loader-logo"
                src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
                alt="AURA ARMAN TOUR"
            >

            <div class="loader-title">
                AURA SKILL
            </div>

            <div class="loader-subtitle">
                Play & Earn
            </div>

            <div class="loader-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </div>


    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <main class="page">

        <section class="login-card">

            <div class="brand">

                <img
                    class="brand-logo"
                    src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
                    alt="AURA ARMAN TOUR"
                >

                <div class="brand-title">
                    AURA ARMAN TOUR
                </div>

                <div class="brand-subtitle">
                    Login to continue your tournament journey
                </div>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label class="input-label">
                        Username অথবা Gmail
                    </label>

                    <div class="input-wrap">

                        <i class="fa-solid fa-user input-icon"></i>

                        <input
                            id="loginIdentifier"
                            type="text"
                            autocomplete="username"
                            placeholder="Username / Gmail"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label class="input-label">
                        Password
                    </label>

                    <div class="input-wrap">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            id="loginPassword"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <button
                        type="button"
                        class="forgot-btn"
                        id="forgotPasswordBtn"
                    >
                        Forgot password?
                    </button>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login
                </button>

            </form>


            <div class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <div class="support-box">

                <p>
                    Need help with your account?
