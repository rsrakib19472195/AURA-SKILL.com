/* =========================================================

   ========================================================= */

#pageLoader{

}

#pageLoader.hide{

.loader-content{

    align-items:center;

.loader-logo-wrap{

    height:82px;

    display:flex;
    align-items:center;

}

.loader-logo-ring{
    position:absolute;
    inset:-8px;

    border-radius:50%;

    border:2px solid transparent;

    border-top-color:#22c55e;
    border-right-color:#84cc16;

    animation:logoSpin .8s linear infinite;

    filter:
        drop-shadow(0 0 7px rgba(34,197,94,.55))

}

.loader-logo-ring::after{
    content:"";

    position:absolute;
    inset:5px;

    border-radius:50%;

    border:1px solid rgba(234,179,8,.5);

    border-left-color:transparent;
    border-bottom-color:transparent;

    animation:logoSpinReverse .55s linear infinite;
}

.loader-logo{
    width:68px;
    height:68px;

    object-fit:cover;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.12);

    box-shadow:
        0 0 18px rgba(34,197,94,.30),
        0 0 35px rgba(34,197,94,.10);

    animation:logoFloat 1.4s ease-in-out infinite;
}

.loader-title{
    margin-top:25px;

    font-size:17px;
    font-weight:700;

    letter-spacing:.5px;

    color:#fff;
}

.loader-subtitle{
    margin-top:3px;

    font-size:12px;

}

.loader-dots{

    gap:5px;

    margin-top:13px;
}

.loader-dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#22c55e;

    animation:dotPulse 1s ease-in-out infinite;
}

.loader-dot:nth-child(2){
    animation-delay:.15s;
}

.loader-dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes logoSpin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes logoSpinReverse{
    to{
        transform:rotate(-360deg);
    }
}

@keyframes logoFloat{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.035);
    }
}

@keyframes dotPulse{

    0%,
    100%{
        opacity:.25;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.15);
    }
}

}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



/* =========================================================

   ========================================================= */

const pageLoader =

let loaderHidden = false;


function hideLoader(){

    if(loaderHidden) return;

    loaderHidden = true;

    pageLoader.classList.add("hide");

}


setTimeout(() => {

},1200);



/* =========================================================
   TASK DEFINITIONS
   ========================================================= */

const TASKS = [

    {
        id:"play_1",
        type:"match",
        icon:"fa-gamepad",
        title:"Play Your First Match",
        description:"প্রথম tournament/match join করুন",

    },


    {

        title:"Play 3 Matches",
        description:"মোট ৩টি tournament/match join করুন",
        target:3,
        reward:6,
        progressKey:"matches",
        button:"Play Match",
        link:"index.html"
    },


    {
        id:"win_1",
        type:"match",
        icon:"fa-trophy",
        title:"Win 1 Match",
        description:"কমপক্ষে ১টি match win করুন",
        target:1,
        reward:3,
        progressKey:"wins",
        button:"Play Match",
        link:"index.html"
    },


    {

        title:"Refer 1 Friend",
        description:"Referral code দিয়ে ১ জন নতুন user invite করুন",
        target:1,
        reward:5,
        progressKey:"referrals",
        button:"Invite Now",
        link:"profile.html"
    },


    {
        id:"refer_5",
        type:"referral",
        icon:"fa-users",
        title:"Refer 5 Friends",
        description:"Referral code দিয়ে ৫ জন নতুন user invite করুন",
        target:5,
        reward:30,
        progressKey:"referrals",
        button:"Invite Now",
        link:"profile.html"
    }

];



/* =========================================================
   STATE
   ========================================================= */

let currentUser = null;

let userStats = {

    matches:0,

    wins:0,

    referrals:0

};


let claimedTasks = {};

let currentFilter = "all";



/* =========================================================
   ELEMENTS
   ========================================================= */

const taskList =
    document.getElementById("taskList");

/* =========================================================
   INITIAL RENDER

renderTasks();



/* =========================================================
   SAFE NUMBER
   ========================================================= */

function safeNumber(value){

    const number = Number(value);

    if(!Number.isFinite(number)){
        return 0;
    }

    return Math.max(0,number);

}



/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;


function showToast(message,type="success"){

    const toast =
        document.getElementById("toast");


    toast.textContent =
        message;


    toast.className =
        "toast " + type;


    requestAnimationFrame(() => {

        toast.classList.add("show");

    });


    clearTimeout(toastTimer);


    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },2600);

}



/* =========================================================
   NORMALIZE STATUS
   ========================================================= */

function normalizeText(value){

    return String(
        value ?? ""
    )
    .trim()
    .toLowerCase();

}



/* =========================================================
   CANCELLED / REFUNDED MATCH
   ========================================================= */

function isCancelledMatch(data){

    if(!data) return false;


    if(
        data.cancelled === true ||
        data.canceled === true
    ){
        return true;
    }


    const status =
        normalizeText(
            data.status
        );


    return [
        "cancelled",
        "canceled",
        "cancel",
        "refunded",
        "refund"
    ].includes(status);

}



/* =========================================================
   COMPLETED MATCH
   ========================================================= */

function isCompletedMatch(data){

    if(!data) return false;


    if(
        data.completed === true ||
        data.isCompleted === true
    ){
        return true;
    }


    const status =
        normalizeText(
            data.status
        );


    return [
        "complete",
        "completed",
        "finished",
        "finish",
        "result"
    ].includes(status);

}



/* =========================================================
   FIND USER PARTICIPANT
   ========================================================= */

function findUserParticipant(data,uid){

    if(!data || !uid){
        return null;
    }


    const participants =
        Array.isArray(data.participants)
        ? data.participants
        : [];


    return participants.find(
        participant => {

            if(!participant){
                return false;
            }


            return (
                participant.uid === uid ||
                participant.userId === uid ||
                participant.userUID === uid ||
                participant.id === uid
            );

        }
    ) || null;

}



/* =========================================================
   WIN DETECTION
   ========================================================= */

function isWinnerRecord(data,uid){

    if(!data || !uid){
        return false;
    }


    const userResult =
        data.userResult ||
        data.resultData ||
        data.resultInfo ||
        {};


    const userEntry =
        data.userEntry ||
        findUserParticipant(data,uid) ||
        {};


    const outcome =
        normalizeText(
            userResult.result ??
            userResult.outcome ??
            userResult.matchResult ??
            userEntry.result ??
            userEntry.outcome ??
            data.result ??
            data.outcome ??
            data.matchResult
        );


    const winnerUid =
        data.winnerUid ??
        data.winnerUserId ??
        data.winnerId ??
        "";


    const winnerUids =
        Array.isArray(data.winnerUids)
        ? data.winnerUids
        : [];


    const wonAmount =
        safeNumber(
            userResult.amount ??
            userResult.prize ??
            userEntry.wonAmount ??
            userEntry.winnings ??
            userEntry.prizeWon ??
            userEntry.winAmount ??
            data.wonAmount ??
            data.winnings ??
            data.prizeWon
        );


    if(
        userResult.winner === true ||
        userResult.isWinner === true ||
        userEntry.isWinner === true ||
        userEntry.winner === true
    ){
        return true;
    }


    if(
        winnerUid &&
        String(winnerUid) === String(uid)
    ){
        return true;
    }


    if(
        winnerUids.includes(uid)
    ){
        return true;
    }


    if([
        "win",
        "won",
        "winner",
        "victory"
    ].includes(outcome)){
        return true;
    }


    if(wonAmount > 0){
        return true;
    }


    return false;

}



/* =========================================================
   MATCH DATA LOAD
   ========================================================= */

async function loadActualMatchStats(){

    if(!currentUser){
        return;
    }


    const uid =
        currentUser.uid;


    let matchIds =
        new Set();


    let winIds =
        new Set();



    try{

        /* =====================================================
           1. MATCH HISTORY
           ===================================================== */

        let historyDocs = [];


        try{

            const historyQuery =
                query(
                    collection(
                        db,
                        "matchHistory"
                    ),
                    where(
                        "userId",
                        "==",
                        uid
                    )
                );


            const historySnapshot =
                await getDocs(
                    historyQuery
                );


            historyDocs =
                historySnapshot.docs;

        }

        catch(error){

            console.warn(
                "matchHistory query error:",
                error
            );

        }



        historyDocs.forEach(
            historyDoc => {

                const data =
                    historyDoc.data() || {};


                if(
                    isCancelledMatch(data)
                ){
                    return;
                }


                const historyId =
                    String(
                        data.tournamentId ??
                        data.matchId ??
                        historyDoc.id
                    );


                if(
                    historyId
                ){
                    matchIds.add(
                        historyId
                    );
                }


                if(
                    isWinnerRecord(
                        data,
                        uid
                    )
                ){

                    winIds.add(
                        historyId
                    );

                }

            }
        );



        /* =====================================================
           2. TOURNAMENTS
           ===================================================== */

        const tournamentSnapshot =
            await getDocs(
                collection(
                    db,
                    "tournaments"
                )
            );


        tournamentSnapshot.forEach(
            tournamentDoc => {

                const data =
                    tournamentDoc.data() || {};


                if(
                    isCancelledMatch(data)
                ){
                    return;
                }


                const participant =
                    findUserParticipant(
                        data,
                        uid
                    );


                if(!participant){
                    return;
                }


                const tournamentId =
                    String(
                        data.tournamentId ??
                        data.matchId ??
                        tournamentDoc.id
                    );


                if(
                    tournamentId
                ){
                    matchIds.add(
                        tournamentId
                    );
                }



                /* =================================================
                   WIN DETECTION FROM TOURNAMENT
                   ================================================= */

                const combinedData = {

                    ...data,

                    userEntry:
                        participant

                };


                if(
                    isWinnerRecord(
                        combinedData,
                        uid
                    )
                ){

                    winIds.add(
                        tournamentId
                    );

                }

            }
        );



        userStats.matches =
            matchIds.size;


        userStats.wins =
            winIds.size;



        renderTasks();

    }

    catch(error){

        console.error(
            "Actual match stats error:",
            error
        );

    }

}



/* =========================================================
   TASK PROGRESS
   ========================================================= */

function getTaskProgress(task){

    return Math.min(

        safeNumber(
            userStats[
                task.progressKey
            ]
        ),

        task.target

    );

}



/* =========================================================
   TASK COMPLETED
   ========================================================= */

function isTaskCompleted(task){

    return claimedTasks[
        task.id
    ] === true;

}



/* =========================================================
   CAN CLAIM
   ========================================================= */

function canClaim(task){

    return (

        getTaskProgress(task) >=
        task.target

        &&

        !isTaskCompleted(task)

    );

}



/* =========================================================
   RENDER TASKS
   ========================================================= */

function renderTasks(){

    let visibleTasks =
        TASKS;


    if(
        currentFilter !== "all"
    ){

        visibleTasks =
            TASKS.filter(
                task =>
                    task.type ===
                    currentFilter
            );

    }


    if(!visibleTasks.length){

        taskList.innerHTML = `

            <div class="glass-card rounded-2xl p-8 text-center">

                <div
                    class="w-16 h-16 mx-auto mb-4
                           rounded-2xl
                           bg-slate-800
                           flex items-center justify-center
                           text-slate-500 text-2xl">

                    <i class="fa-solid fa-list"></i>

                </div>


                <h3 class="font-semibold text-white">
                    No missions found
                </h3>

            </div>

        `;


        updateOverallProgress();

        return;

    }



    taskList.innerHTML =
        visibleTasks.map(task => {


        const progress =
            getTaskProgress(
                task
            );


        const completed =
            isTaskCompleted(
                task
            );


        const ready =
            canClaim(
                task
            );


        const percent =
            Math.min(

                100,

                Math.round(
                    (
                        progress /
                        task.target
                    ) * 100
                )

            );


        let actionButton = "";



        if(completed){

            actionButton = `

                <button
                    class="action-btn claimed
                           px-3 py-2 rounded-xl
                           border text-xs font-semibold
                           disabled-btn"
                    disabled>

                    <i class="fa-solid fa-check mr-1"></i>

                    Completed

                </button>

            `;

        }

        else if(ready){

            actionButton = `

                <button
                    onclick="claimTask('${task.id}')"
                    class="action-btn
                           px-3 py-2 rounded-xl
                           bg-green-500
                           hover:bg-green-400
                           text-black
                           text-xs
                           font-bold">

                    <i class="fa-solid fa-gift mr-1"></i>

                    Claim

                </button>

            `;

        }

        else{

            actionButton = `

                <button
                    onclick="startTask('${task.id}')"
                    class="action-btn
                           px-3 py-2 rounded-xl
                           bg-slate-800
                           hover:bg-slate-700
                           border border-slate-700
                           text-slate-200
                           text-xs
                           font-semibold">

                    ${task.button}

                </button>

            `;

        }



        return `

            <article
                class="task-card glass-card rounded-2xl p-4">

                <div class="flex items-start gap-3">


                    <div class="task-icon">

                        <i class="fa-solid ${task.icon}"></i>

                    </div>



                    <div class="flex-1 min-w-0">


                        <div
                            class="flex items-start
                                   justify-between
                                   gap-2">


                            <div class="min-w-0">

                                <h3
                                    class="font-semibold
                                           text-white
                                           text-[15px]">

                                    ${task.title}

                                </h3>


                                <p
                                    class="text-xs
                                           text-slate-400
                                           mt-1
                                           leading-relaxed">

                                    ${task.description}

                                </p>

                            </div>



                            <span
                                class="reward
                                       text-[11px]
                                       font-semibold
                                       px-2
                                       py-1
                                       rounded-lg">

                                +৳${task.reward}

                            </span>


                        </div>



                        <!-- PROGRESS -->

                        <div class="mt-4">


                            <div
                                class="flex
                                       items-center
                                       justify-between
                                       mb-2">


                                <span
                                    class="text-xs
                                           text-slate-500">

                                    Progress

                                </span>


                                <span
                                    class="text-xs
                                           font-semibold
                                           text-slate-300">

                                    ${progress}/${task.target}

                                </span>

                            </div>



                            <div class="progress-bar">

                                <div
                                    class="progress-fill"
                                    style="width:${percent}%">

                                </div>

                            </div>


                        </div>



                        <!-- ACTION -->

                        <div
                            class="flex
                                   justify-end
                                   mt-3">

                            ${actionButton}

                        </div>


                    </div>

                </div>

            </article>

        `;

    }).join("");


    updateOverallProgress();

}



/* =========================================================
   OVERALL PROGRESS
   ========================================================= */

function updateOverallProgress(){

    totalCount.textContent =
        TASKS.length;


    const completed =
        TASKS.filter(
            task =>
                isTaskCompleted(task)
        ).length;


    completedCount.textContent =
        completed;


    const percentage =
        TASKS.length

        ?

        Math.round(
            (
                completed /
                TASKS.length
            ) * 100
        )

        :

        0;


    overallProgress.style.width =
        percentage + "%";


    if(
        completed ===
        TASKS.length
    ){

        progressText.textContent =
            "সব mission completed! 🎉";

    }

    else{

        progressText.textContent =
            `${completed}টি completed • আরও ${TASKS.length - completed}টি বাকি`;

    }

}



/* =========================================================
   START TASK
   ========================================================= */

window.startTask =
function(taskId){

    const task =
        TASKS.find(
            item =>
                item.id ===
                taskId
        );


    if(!task) return;


    window.location.href =
        task.link;

};



/* =========================================================
   CLAIM TASK
   ========================================================= */

window.claimTask =
async function(taskId){

    if(!currentUser){

        showToast(
            "প্রথমে login করুন",
            "error"
        );

        return;

    }



    const task =
        TASKS.find(
            item =>
                item.id ===
                taskId
        );


    if(!task) return;



    if(
        isTaskCompleted(task)
    ){

        showToast(
            "এই mission ইতিমধ্যে claim করা হয়েছে",
            "error"
        );

        return;

    }



    if(
        !canClaim(task)
    ){

        showToast(
            "Mission এখনো complete হয়নি",
            "error"
        );

        return;

    }



    try{

        const taskRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "claimedTasks",
                task.id
            );


        const existing =
            await getDoc(
                taskRef
            );


        if(
            existing.exists()
        ){

            claimedTasks[
                task.id
            ] = true;


            renderTasks();


            showToast(
                "এই mission ইতিমধ্যে claim করা হয়েছে",
                "error"
            );


            return;

        }



        await setDoc(
            taskRef,
            {

                taskId:
                    task.id,

                title:
                    task.title,

                reward:
                    task.reward,

                claimed:
                    true,

                claimedAt:
                    serverTimestamp()

            }
        );



        claimedTasks[
            task.id
        ] = true;


        renderTasks();


        showToast(
            `Mission complete! +৳${task.reward}`,
            "success"
        );

    }

    catch(error){

        console.error(
            "Claim error:",
            error
        );


        showToast(
            "Claim করতে সমস্যা হয়েছে",
            "error"
        );

    }

};



/* =========================================================
   LOAD CLAIMED TASKS
   ========================================================= */

async function loadClaimedTasks(){

    if(!currentUser) return;


    claimedTasks = {};



    await Promise.all(

        TASKS.map(
            async task => {

                try{

                    const taskRef =
                        doc(
                            db,
                            "users",
                            currentUser.uid,
                            "claimedTasks",
                            task.id
                        );


                    const snapshot =
                        await getDoc(
                            taskRef
                        );


                    if(
                        snapshot.exists()
                    ){

                        claimedTasks[
                            task.id
                        ] = true;

                    }

                }

                catch(error){

                    console.warn(
                        "Claim read error:",
                        task.id,
                        error
                    );

                }

            }
        )

    );



    renderTasks();

}



/* =========================================================
   LOAD REFERRAL DATA
   ========================================================= */

async function loadReferralStats(){

    if(!currentUser){
        return;
    }


    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const snapshot =
            await getDoc(
                userRef
            );


        if(
            snapshot.exists()
        ){

            const data =
                snapshot.data();


            userStats.referrals =
                safeNumber(
                    data.referrals ??
                    data.totalReferrals ??
                    data.referralCount ??
                    0
                );

        }

    }

    catch(error){

        console.error(
            "Referral stats error:",
            error
        );

    }

}



/* =========================================================
   TABS
   ========================================================= */

document
.querySelectorAll(".tab")
.forEach(tab => {

    tab.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".tab")
            .forEach(item => {

                item.classList.remove(
                    "active"
                );

            });


            tab.classList.add(
                "active"
            );


            currentFilter =
                tab.dataset.filter;


            renderTasks();

        }
    );

});



/* =========================================================
   AUTH
   ========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            hideLoader();

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        /*
         * Loader দ্রুত hide হবে।
         */

        hideLoader();


        /*
         * Claim + referral + actual match
         * data parallel-এ load হবে।
         */

        await Promise.all([

            loadClaimedTasks(),

            loadReferralStats(),

            loadActualMatchStats()

        ]);


        renderTasks();

    }
);

</script>
