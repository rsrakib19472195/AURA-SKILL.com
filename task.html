<script type="module">

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================
   DATA
========================= */

const TASKS = [

    {
        id: "play_1",
        type: "match",
        icon: "fa-gamepad",
        title: "Play 1 Match",
        desc: "Join and complete 1 match",
        target: 1,
        reward: 2,
        progressKey: "matches",
        button: "Play Match",
        link: "index.html"
    },

    {
        id: "play_3",
        type: "match",
        icon: "fa-fire",
        title: "Play 3 Matches",
        desc: "Join and complete 3 matches",
        target: 3,
        reward: 6,
        progressKey: "matches",
        button: "Play Match",
        link: "index.html"
    },

    {
        id: "win_1",
        type: "match",
        icon: "fa-trophy",
        title: "Win 1 Match",
        desc: "Win any completed match",
        target: 1,
        reward: 3,
        progressKey: "wins",
        button: "Play Match",
        link: "index.html"
    },

    {
        id: "refer_1",
        type: "referral",
        icon: "fa-user-plus",
        title: "Refer 1 Friend",
        desc: "Invite 1 friend to Aura Skill",
        target: 1,
        reward: 5,
        progressKey: "referrals",
        button: "Refer",
        link: "referral.html"
    },

    {
        id: "refer_5",
        type: "referral",
        icon: "fa-users",
        title: "Refer 5 Friends",
        desc: "Invite 5 friends to Aura Skill",
        target: 5,
        reward: 30,
        progressKey: "referrals",
        button: "Refer",
        link: "referral.html"
    },

    {
        id: "first_deposit",
        type: "deposit",
        icon: "fa-wallet",
        title: "First Deposit",
        desc: "Complete your first successful deposit",
        target: 1,
        reward: 5,
        progressKey: "deposits",
        button: "Deposit",
        link: "wallet.html"
    }

];


/* =========================
   STATE
========================= */

let currentUser = null;

let activeTab = "all";

let claimedTasks = new Set();

let userStats = {
    matches: 0,
    wins: 0,
    referrals: 0,
    deposits: 0
};


/* =========================
   HELPERS
========================= */

function safeNumber(value){

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


function normalizeText(value){

    return String(value ?? "")
        .trim()
        .toLowerCase();

}


function isCancelledMatch(data){

    const status =
        normalizeText(data?.status);

    const result =
        normalizeText(data?.result);

    const matchResult =
        normalizeText(data?.matchResult);

    const values = [
        status,
        result,
        matchResult
    ];

    return values.some(v =>
        [
            "cancelled",
            "canceled",
            "cancel",
            "refunded",
            "refund"
        ].includes(v)
    );

}


function isCompletedMatch(data){

    if(isCancelledMatch(data)){
        return false;
    }

    const status =
        normalizeText(data?.status);

    const result =
        normalizeText(data?.result);

    const matchResult =
        normalizeText(data?.matchResult);

    if(
        status === "completed" ||
        status === "complete" ||
        status === "finished" ||
        status === "finish"
    ){

        return true;

    }

    if(
        result === "completed" ||
        result === "complete" ||
        result === "finished" ||
        result === "finish"
    ){

        return true;

    }

    if(
        matchResult === "completed" ||
        matchResult === "complete" ||
        matchResult === "finished" ||
        matchResult === "finish"
    ){

        return true;

    }

    /*
       Some tournament records do not have
       a status but have completedAt.
    */

    if(data?.completedAt){
        return true;
    }

    return false;

}


function findUserParticipant(data, uid){

    const participants =
        Array.isArray(data?.participants)
        ? data.participants
        : [];

    return participants.find(p =>
        p &&
        (
            p.uid === uid ||
            p.userId === uid ||
            p.firebaseUid === uid
        )
    ) || null;

}


function isWinnerRecord(data, userEntry = null, uid = ""){

    const objects = [];

    if(data){
        objects.push(data);
    }

    if(userEntry){
        objects.push(userEntry);
    }


    for(const obj of objects){

        if(!obj){
            continue;
        }


        if(
            obj.isWinner === true ||
            obj.winner === true
        ){

            return true;

        }


        if(
            typeof obj.isWinner === "string" &&
            [
                "true",
                "yes",
                "winner",
                "won",
                "1"
            ].includes(
                normalizeText(obj.isWinner)
            )
        ){

            return true;

        }


        if(
            typeof obj.winner === "string" &&
            [
                "true",
                "yes",
                "winner",
                "won",
                "1"
            ].includes(
                normalizeText(obj.winner)
            )
        ){

            return true;

        }


        const winnerUid =
            obj.winnerUid;

        if(
            winnerUid &&
            String(winnerUid) === String(uid)
        ){

            return true;

        }


        const winnerUids =
            Array.isArray(obj.winnerUids)
            ? obj.winnerUids
            : [];

        if(
            winnerUids.some(
                x => String(x) === String(uid)
            )
        ){

            return true;

        }


        const wonAmount =
            safeNumber(
                obj.wonAmount ??
                obj.winnings ??
                obj.prizeWon
            );

        if(wonAmount > 0){

            return true;

        }


        const result =
            normalizeText(
                obj.result ??
                obj.matchResult
            );

        if(
            [
                "winner",
                "won",
                "win",
                "1st",
                "first"
            ].includes(result)
        ){

            return true;

        }

    }

    return false;

}


/* =========================
   MATCH STATS
========================= */

async function loadActualMatchStats(){

    if(!currentUser){
        return;
    }

    const uid =
        currentUser.uid;

    const matchIds =
        new Set();

    const winIds =
        new Set();


    try{

        /*
           1. Match History
        */

        try{

            const historyQuery =
                query(
                    collection(
                        db,
                        "matchHistory"
                    ),
                    where(
                        "userId",
                        "==",
                        uid
                    )
                );


            const historySnap =
                await getDocs(
                    historyQuery
                );


            historySnap.forEach(
                snap => {

                    const data =
                        snap.data() || {};


                    if(
                        isCancelledMatch(data)
                    ){

                        return;

                    }


                    if(
                        !isCompletedMatch(data)
                    ){

                        return;

                    }


                    const matchId =
                        data.tournamentId ??
                        data.matchId ??
                        data.tournamentID ??
                        snap.id;


                    matchIds.add(
                        String(matchId)
                    );


                    if(
                        isWinnerRecord(
                            data,
                            null,
                            uid
                        )
                    ){

                        winIds.add(
                            String(matchId)
                        );

                    }

                }
            );

        }catch(e){

            console.warn(
                "matchHistory load error:",
                e
            );

        }


        /*
           2. Tournaments
        */

        try{

            const tournamentsSnap =
                await getDocs(
                    collection(
                        db,
                        "tournaments"
                    )
                );


            tournamentsSnap.forEach(
                snap => {

                    const data =
                        snap.data() || {};


                    const participant =
                        findUserParticipant(
                            data,
                            uid
                        );


                    if(!participant){
                        return;
                    }


                    if(
                        isCancelledMatch(data) ||
                        isCancelledMatch(participant)
                    ){

                        return;

                    }


                    if(
                        !isCompletedMatch(data)
                    ){

                        return;

                    }


                    const matchId =
                        data.tournamentId ??
                        data.matchId ??
                        snap.id;


                    matchIds.add(
                        String(matchId)
                    );


                    if(
                        isWinnerRecord(
                            data,
                            participant,
                            uid
                        )
                    ){

                        winIds.add(
                            String(matchId)
                        );

                    }

                }
            );

        }catch(e){

            console.warn(
                "tournaments load error:",
                e
            );

        }


        userStats.matches =
            matchIds.size;

        userStats.wins =
            winIds.size;


        renderTasks();

    }catch(e){

        console.error(
            "Match stats error:",
            e
        );

    }

}


/* =========================
   REFERRAL STATS
========================= */

async function loadReferralStats(){

    if(!currentUser){
        return;
    }

    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                )
            );


        if(!snap.exists()){
            return;
        }


        const data =
            snap.data() || {};


        userStats.referrals =
            safeNumber(
                data.referrals ??
                data.totalReferrals ??
                data.referralCount ??
                0
            );


        renderTasks();

    }catch(e){

        console.warn(
            "Referral stats error:",
            e
        );

    }

}


/* =========================
   SUCCESSFUL DEPOSIT STATS
========================= */

async function loadDepositStats(){

    if(!currentUser){
        return;
    }

    const uid =
        currentUser.uid;


    userStats.deposits = 0;


    try{

        /*
           Deposit requests are stored in:

           transactions

           Fields:
           userId
           amount
           gateway
           trxId
           status

           Only APPROVED deposits count.
        */

        const q =
            query(
                collection(
                    db,
                    "transactions"
                ),
                where(
                    "userId",
                    "==",
                    uid
                )
            );


        const snap =
            await getDocs(q);


        let approvedCount = 0;


        snap.forEach(
            item => {

                const data =
                    item.data() || {};


                const status =
                    normalizeText(
                        data.status
                    );


                /*
                   Only successful/approved
                   deposits are counted.
                */

                if(
                    status !== "approved" &&
                    status !== "success" &&
                    status !== "successful" &&
                    status !== "completed"
                ){

                    return;

                }


                const amount =
                    safeNumber(
                        data.amount
                    );


                /*
                   Invalid/zero amount is not
                   considered a successful deposit.
                */

                if(amount <= 0){
                    return;
                }


                approvedCount++;

            }
        );


        /*
           First successful deposit mission
           only needs 1.
        */

        userStats.deposits =
            approvedCount > 0
            ? 1
            : 0;


        renderTasks();

    }catch(e){

        console.error(
            "Deposit stats error:",
            e
        );

        userStats.deposits = 0;

        renderTasks();

    }

}


/* =========================
   CLAIMED TASKS
========================= */

async function loadClaimedTasks(){

    if(!currentUser){
        return;
    }

    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "users",
                    currentUser.uid,
                    "claimedTasks"
                )
            );


        claimedTasks =
            new Set(
                snap.docs.map(
                    d => d.id
                )
            );


    }catch(e){

        console.warn(
            "Claimed tasks load error:",
            e
        );

        claimedTasks =
            new Set();

    }

}


/* =========================
   PROGRESS
========================= */

function getTaskProgress(task){

    return Math.min(
        safeNumber(
            userStats[
                task.progressKey
            ]
        ),
        task.target
    );

}


function isTaskComplete(task){

    return (
        getTaskProgress(task) >=
        task.target
    );

}


/* =========================
   RENDER
========================= */

function renderTasks(){

    const list =
        document.getElementById(
            "taskList"
        );


    if(!list){
        return;
    }


    let visibleTasks =
        TASKS.filter(
            task =>
                activeTab === "all" ||
                task.type === activeTab
        );


    list.innerHTML = "";


    if(!visibleTasks.length){

        list.innerHTML = `
            <div class="empty">
                কোনো mission পাওয়া যায়নি।
            </div>
        `;

        updateOverallProgress();

        return;

    }


    visibleTasks.forEach(
        task => {

            const progress =
                getTaskProgress(task);

            const complete =
                isTaskComplete(task);

            const claimed =
                claimedTasks.has(
                    task.id
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "taskCard" +
                (
                    complete
                    ? " completed"
                    : ""
                );


            let buttonText =
                task.button;


            if(claimed){

                buttonText =
                    "Claimed";

            }else if(complete){

                buttonText =
                    "Claim";

            }


            card.innerHTML = `

                <div class="taskIcon">
                    <i class="fa-solid ${task.icon}"></i>
                </div>

                <div class="taskContent">

                    <div class="taskTitle">
                        ${task.title}
                    </div>

                    <div class="taskDesc">
                        ${task.desc}
                    </div>

                    <div class="taskProgress">

                        ${progress}/${task.target}

                        <span style="margin-left:5px;">
                            • Reward
                            <span class="reward">
                                ৳${task.reward}
                            </span>
                        </span>

                    </div>

                </div>

                <button
                    class="claimBtn ${
                        claimed
                        ? "claimed"
                        : ""
                    }"
                    data-id="${task.id}"
                    ${claimed ? "disabled" : ""}
                >
                    ${buttonText}
                </button>

            `;


            const btn =
                card.querySelector(
                    ".claimBtn"
                );


            if(!claimed){

                btn.addEventListener(
                    "click",
                    () => {

                        if(complete){

                            claimTask(task);

                        }else{

                            location.href =
                                task.link;

                        }

                    }
                );

            }


            list.appendChild(
                card
            );

        }
    );


    updateOverallProgress();

}


/* =========================
   OVERALL PROGRESS
========================= */

function updateOverallProgress(){

    const total =
        TASKS.length;


    const completed =
        TASKS.filter(
            task =>
                isTaskComplete(task)
        ).length;


    const claimedReward =
        TASKS
            .filter(
                task =>
                    claimedTasks.has(
                        task.id
                    )
            )
            .reduce(
                (sum, task) =>
                    sum + safeNumber(
                        task.reward
                    ),
                0
            );


    const percentage =
        total > 0
        ? Math.round(
            (
                completed /
                total
            ) * 100
        )
        : 0;


    document.getElementById(
        "completedCount"
    ).innerText =
        completed;


    document.getElementById(
        "totalCount"
    ).innerText =
        total;


    document.getElementById(
        "totalReward"
    ).innerText =
        claimedReward;


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";

}


/* =========================
   CLAIM TASK
========================= */

async function claimTask(task){

    if(!currentUser){

        showToast(
            "অনুগ্রহ করে আগে Login করুন।",
            "warning"
        );

        return;

    }


    if(
        claimedTasks.has(
            task.id
        )
    ){

        return;

    }


    if(
        !isTaskComplete(task)
    ){

        return;

    }


    try{

        /*
           Prevent duplicate claim
           by checking Firestore again.
        */

        const claimRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "claimedTasks",
                task.id
            );


        const existing =
            await getDoc(
                claimRef
            );


        if(existing.exists()){

            claimedTasks.add(
                task.id
            );

            renderTasks();

            showToast(
                "এই mission-এর reward ইতোমধ্যে claimed হয়েছে।",
                "warning"
            );

            return;

        }


        await setDoc(
            claimRef,
            {
                taskId:
                    task.id,

                title:
                    task.title,

                reward:
                    task.reward,

                claimed:
                    true,

                claimedAt:
                    serverTimestamp()
            }
        );


        claimedTasks.add(
            task.id
        );


        renderTasks();


        showToast(
            `Mission complete! +৳${task.reward}`,
            "success"
        );


    }catch(e){

        console.error(
            "Claim task error:",
            e
        );


        showToast(
            "Reward claim করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।",
            "error"
        );

    }

}


/* =========================

========================= */

document
    .querySelectorAll(

    )

            btn.addEventListener(

                        "active"
                    );


                    activeTab =
                        btn.dataset.tab;


                    renderTasks();

                }
            );

        }
    );


/* =========================
   TOAST
========================= */

function showToast(
    message,
    type = "success"
){

    const container =
        document.getElementById(
            "toast-container"
        );


    if(!container){
        return;
    }


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        `toast ${type}`;


    let icon =
        "fa-circle-check";


    if(type === "error"){
        icon =
            "fa-circle-xmark";
    }


    if(type === "warning"){
        icon =
            "fa-triangle-exclamation";
    }


    toast.innerHTML = `
        <i class="fa-solid ${icon}"></i>
        <span>${message}</span>
    `;


    container.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.style.opacity =
                "0";

            toast.style.transform =
                "translateY(-8px)";

            setTimeout(
                () =>
                    toast.remove(),
                250
            );

        },
        2800
    );

}


window.showToast =
    showToast;


/* =========================
   AUTH START
========================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            currentUser = null;

            document.getElementById(
                "pageLoader"
            ).style.display =
                "none";


            showToast(
                "Mission দেখতে Login করুন।",
                "warning"
            );


            setTimeout(
                () => {
                    location.href =
                        "login.html";
                },
                700
            );

            return;

        }


        currentUser =
            user;


        try{

            /*
               Load independent data
               together for faster response.
            */

            await Promise.all([
                loadClaimedTasks(),
                loadReferralStats(),
                loadActualMatchStats(),
                loadDepositStats()
            ]);


            renderTasks();


        }catch(e){

            console.error(e);

        }


        /*
           Remove loader quickly after
           initial data is ready.
        */

        document.getElementById(
            "pageLoader"
        ).style.display =
            "none";

    }
);

</script>
