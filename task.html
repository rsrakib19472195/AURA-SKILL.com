<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Skill - Missions</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Hind Siliguri', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(34,197,94,.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(59,130,246,.10), transparent 35%),
                #07110d;
            color: #fff;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.09);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .mission-card {
            transition: .2s ease;
        }

        .mission-card:active {
            transform: scale(.985);
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: rgba(255,255,255,.08);
            stroke-width: 8;
        }

        .progress-ring-fill {
            fill: none;
            stroke: #22c55e;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset .5s ease;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .65s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #07110d;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .25s ease, visibility .25s ease;
        }

        .page-loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            object-fit: cover;
            animation: loaderPulse 1.2s ease-in-out infinite;
        }

        @keyframes loaderPulse {
            0%,100% {
                transform: scale(.92);
                opacity: .75;
            }
            50% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .tab-btn {
            transition: .2s ease;
        }

        .tab-btn.active {
            background: #22c55e;
            color: #041008;
            box-shadow: 0 5px 20px rgba(34,197,94,.2);
        }

        .claim-btn {
            min-width: 94px;
        }

        .hide {
            display: none !important;
        }
    </style>
</head>

<body>

<!-- FIREBASE -->
<script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    runTransaction,
    increment,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   MISSIONS
========================================================= */

const missions = [

    {
        id: "play_5",
        type: "match",
        title: "Play 5 Matches",
        description: "Complete 5 matches",
        reward: 5,
        target: 5,
        progressKey: "matches",
        icon: "fa-gamepad",
        link: "index.html"
    },

    {
        id: "win_1",
        type: "match",
        title: "Win 1 Match",
        description: "Win any 1 completed match",
        reward: 2,
        target: 1,
        progressKey: "wins",
        icon: "fa-trophy",
        link: "index.html"
    },

    {
        id: "refer_1",
        type: "referral",
        title: "Refer 1 Friend",
        description: "Invite 1 friend and make sure they complete a successful deposit",
        reward: 5,
        target: 1,
        progressKey: "referrals",
        icon: "fa-user-plus",
        link: "referral.html"
    },

    {
        id: "first_deposit",
        type: "deposit",
        title: "Make First Deposit",
        description: "Complete your first approved deposit",
        reward: 5,
        target: 1,
        progressKey: "deposits",
        icon: "fa-wallet",
        link: "wallet.html"
    }

];


let currentUser = null;

let userStats = {
    matches: 0,
    wins: 0,
    referrals: 0,
    deposits: 0
};

let claimedTasks = {};

let currentTab = "all";

let claimingMission = null;


/* =========================================================
   HELPERS
========================================================= */

function normalize(value) {

    return String(value || "")
        .trim()
        .toLowerCase();

}


function isCompletedStatus(value) {

    const status = normalize(value);

    return [
        "completed",
        "complete",
        "finished",
        "finish",
        "success",
        "successful",
        "approved",
        "paid",
        "won",
        "winner"
    ].includes(status);

}


function isCancelledStatus(value) {

    const status = normalize(value);

    return [
        "cancelled",
        "canceled",
        "cancel",
        "rejected",
        "refunded"
    ].includes(status);

}


function getAmount(data) {

    const values = [
        data?.amount,
        data?.depositAmount,
        data?.transactionAmount,
        data?.value
    ];

    for (const value of values) {

        const number = Number(value);

        if (Number.isFinite(number) && number > 0) {
            return number;
        }

    }

    return 0;

}


/* =========================================================
   LOAD MATCH STATS
========================================================= */

async function loadMatchStats() {

    let completedMatches = new Set();
    let wins = 0;

    try {

        const matchQuery = query(
            collection(db, "matchHistory"),
            where("userId", "==", currentUser.uid)
        );

        const matchSnapshot = await getDocs(matchQuery);

        matchSnapshot.forEach((item) => {

            const data = item.data() || {};

            const statusValues = [
                data.status,
                data.matchStatus,
                data.resultStatus
            ];

            const cancelled = statusValues.some(
                value => isCancelledStatus(value)
            );

            if (cancelled) return;

            const completed =
                statusValues.some(value => isCompletedStatus(value)) ||
                !!data.completedAt;

            if (!completed) return;

            const matchId =
                data.matchId ||
                data.tournamentId ||
                data.tournamentID ||
                data.tournament ||
                item.id;

            completedMatches.add(String(matchId));

            const winnerValues = [
                data.isWinner,
                data.winner,
                data.won
            ];

            const directWin = winnerValues.some(value => {

                if (value === true) return true;

                const normalized = normalize(value);

                return [
                    "true",
                    "yes",
                    "win",
                    "won",
                    "winner",
                    "1"
                ].includes(normalized);

            });

            const result = normalize(
                data.result ||
                data.matchResult ||
                data.position ||
                ""
            );

            if (
                directWin ||
                result === "win" ||
                result === "won" ||
                result === "winner" ||
                result === "1" ||
                result === "first"
            ) {
                wins++;
            }

        });

    } catch (error) {

        console.error("matchHistory error:", error);

    }


    /* =====================================================
       TOURNAMENT PARTICIPANTS
    ===================================================== */

    try {

        const tournamentsSnapshot =
            await getDocs(collection(db, "tournaments"));

        const countedTournamentWins = new Set();

        tournamentsSnapshot.forEach((item) => {

            const data = item.data() || {};

            const statusValues = [
                data.status,
                data.matchStatus,
                data.resultStatus
            ];

            if (
                statusValues.some(value =>
                    isCancelledStatus(value)
                )
            ) {
                return;
            }

            const completed =
                statusValues.some(value =>
                    isCompletedStatus(value)
                ) ||
                !!data.completedAt;

            if (!completed) return;

            let participants = data.participants;

            if (!Array.isArray(participants)) return;

            participants.forEach((participant) => {

                if (!participant) return;

                const participantUid =
                    participant.uid ||
                    participant.userId ||
                    participant.userUID ||
                    participant.firebaseUid;

                if (String(participantUid) !== String(currentUser.uid)) {
                    return;
                }

                const matchId =
                    data.tournamentId ||
                    data.tournamentID ||
                    item.id;

                if (!completedMatches.has(String(matchId))) {
                    completedMatches.add(String(matchId));
                }

                const directWin =
                    participant.isWinner === true ||
                    participant.winner === true ||
                    participant.won === true ||
                    normalize(participant.result) === "win" ||
                    normalize(participant.result) === "won" ||
                    normalize(participant.result) === "winner";

                const position = Number(
                    participant.position
                );

                if (
                    directWin ||
                    position === 1
                ) {

                    const uniqueWinId =
                        String(matchId);

                    if (
                        !countedTournamentWins.has(
                            uniqueWinId
                        )
                    ) {

                        countedTournamentWins.add(
                            uniqueWinId
                        );

                        wins++;

                    }

                }

            });

        });

    } catch (error) {

        console.error("tournaments error:", error);

    }


    userStats.matches = completedMatches.size;
    userStats.wins = wins;

}


/* =========================================================
   LOAD REFERRAL STATS
=========================================================

   IMPORTANT:
   referralHistory document structure:

   referrerUid
   referredUid
   referredEmail
   referredUsername
   referrerCode
   depositBalanceAtReward
   rewardAmount
   status
   createdAt

   Referral only counts when:
   status == "paid"

========================================================= */

async function loadReferralStats() {

    let paidReferralCount = 0;

    try {

        const referralQuery = query(
            collection(db, "referralHistory"),
            where("referrerUid", "==", currentUser.uid)
        );

        const referralSnapshot =
            await getDocs(referralQuery);


        const countedReferredUsers = new Set();


        referralSnapshot.forEach((item) => {

            const data = item.data() || {};

            const status =
                normalize(data.status);

            const referredUid =
                data.referredUid ||
                item.id;


            /*
             * Only PAID referrals count.
             *
             * This means:
             * referred user must have completed
             * the successful deposit/referral reward
             * process and referralHistory must contain
             * status = "paid".
             */

            if (status !== "paid") {
                return;
            }


            /*
             * Prevent duplicate referralHistory
             * records for the same referred user.
             */

            const uniqueUid =
                String(referredUid);


            if (
                countedReferredUsers.has(
                    uniqueUid
                )
            ) {
                return;
            }


            countedReferredUsers.add(
                uniqueUid
            );

            paidReferralCount++;

        });


    } catch (error) {

        console.error(
            "referralHistory error:",
            error
        );

    }


    userStats.referrals =
        paidReferralCount;

}


/* =========================================================
   LOAD DEPOSIT STATS
========================================================= */

async function loadDepositStats() {

    let approvedDeposit = false;

    try {

        const depositQuery = query(
            collection(db, "transactions"),
            where("userId", "==", currentUser.uid)
        );

        const snapshot =
            await getDocs(depositQuery);


        snapshot.forEach((item) => {

            const data = item.data() || {};

            const statusValues = [
                data.status,
                data.transactionStatus,
                data.depositStatus
            ];

            const statusApproved =
                statusValues.some(value => {

                    const status =
                        normalize(value);

                    return [
                        "approved",
                        "success",
                        "successful",
                        "completed",
                        "complete",
                        "paid"
                    ].includes(status);

                });


            const amount =
                getAmount(data);


            if (
                statusApproved &&
                amount > 0
            ) {

                approvedDeposit = true;

            }

        });

    } catch (error) {

        console.error(
            "transactions error:",
            error
        );

    }


    userStats.deposits =
        approvedDeposit ? 1 : 0;

}


/* =========================================================
   LOAD CLAIMED MISSIONS
========================================================= */

async function loadClaimedTasks() {

    claimedTasks = {};

    try {

        const claimedRef =
            collection(
                db,
                "users",
                currentUser.uid,
                "claimedTasks"
            );

        const snapshot =
            await getDocs(claimedRef);


        snapshot.forEach((item) => {

            claimedTasks[item.id] =
                item.data() || {};

        });

    } catch (error) {

        console.error(
            "claimedTasks error:",
            error
        );

    }

}


/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function loadAllData() {

    await Promise.all([
        loadMatchStats(),
        loadReferralStats(),
        loadDepositStats(),
        loadClaimedTasks()
    ]);

    renderMissions();

}


/* =========================================================
   MISSION PROGRESS
========================================================= */

function getMissionProgress(mission) {

    const value =
        Number(
            userStats[
                mission.progressKey
            ] || 0
        );

    return Math.min(
        value,
        mission.target
    );

}


function isMissionComplete(mission) {

    return (
        getMissionProgress(mission) >=
        mission.target
    );

}


function isMissionClaimed(mission) {

    return !!claimedTasks[
        mission.id
    ];

}


/* =========================================================
   RENDER MISSIONS
========================================================= */

function renderMissions() {

    const container =
        document.getElementById(
            "missionsContainer"
        );


    container.innerHTML = "";


    const filtered =
        missions.filter(mission => {

            if (currentTab === "all") {
                return true;
            }

            return mission.type === currentTab;

        });


    filtered.forEach(mission => {

        const progress =
            getMissionProgress(mission);

        const complete =
            isMissionComplete(mission);

        const claimed =
            isMissionClaimed(mission);

        const percentage =
            Math.min(
                100,
                Math.round(
                    (progress /
                        mission.target) *
                    100
                )
            );


        let buttonHTML = "";


        if (claimingMission === mission.id) {

            buttonHTML = `
                <button
                    class="claim-btn px-4 py-2 rounded-xl
                           bg-green-500 text-black
                           font-semibold text-sm
                           flex items-center justify-center gap-2"
                    disabled>
                    <span class="spinner"></span>
                </button>
            `;

        } else if (claimed) {

            buttonHTML = `
                <button
                    class="claim-btn px-4 py-2 rounded-xl
                           bg-gray-700 text-gray-400
                           font-semibold text-sm"
                    disabled>
                    <i class="fa-solid fa-check mr-1"></i>
                    Claimed
                </button>
            `;

        } else if (complete) {

            buttonHTML = `
                <button
                    onclick="claimMission('${mission.id}')"
                    class="claim-btn px-4 py-2 rounded-xl
                           bg-green-500 hover:bg-green-400
                           text-black font-bold text-sm">
                    Claim
                </button>
            `;

        } else {

            buttonHTML = `
                <button
                    onclick="window.location.href='${mission.link}'"
                    class="claim-btn px-4 py-2 rounded-xl
                           bg-red-500 hover:bg-red-400
                           text-white font-bold text-sm">
                    Go
                </button>
            `;

        }


        const card =
            document.createElement("div");


        card.className =
            "mission-card glass rounded-2xl p-4";


        card.innerHTML = `

            <div class="flex items-start gap-3">

                <div class="
                    w-11 h-11
                    rounded-xl
                    bg-green-500/10
                    text-green-400
                    flex items-center justify-center
                    shrink-0
                ">
                    <i class="fa-solid ${mission.icon}"></i>
                </div>


                <div class="flex-1 min-w-0">

                    <div class="flex items-start justify-between gap-2">

                        <div>

                            <h3 class="font-bold text-base">
                                ${mission.title}
                            </h3>

                            <p class="text-xs text-gray-400 mt-0.5">
                                ${mission.description}
                            </p>

                        </div>

                        <div class="
                            shrink-0
                            px-2.5 py-1
                            rounded-lg
                            bg-yellow-500/10
                            text-yellow-400
                            text-xs
                            font-bold
                        ">
                            +৳${mission.reward}
                        </div>

                    </div>


                    <div class="mt-3">

                        <div class="
                            flex
                            items-center
                            justify-between
                            text-xs
                            mb-1.5
                        ">

                            <span class="text-gray-400">
                                Progress
                            </span>

                            <span class="text-gray-300">
                                ${progress}/${mission.target}
                            </span>

                        </div>


                        <div class="
                            h-1.5
                            bg-white/5
                            rounded-full
                            overflow-hidden
                        ">

                            <div
                                class="
                                    h-full
                                    rounded-full
                                    bg-green-500
                                    transition-all
                                    duration-500
                                "
                                style="
                                    width:${percentage}%;
                                ">
                            </div>

                        </div>

                    </div>


                    <div class="
                        mt-3
                        flex
                        items-center
                        justify-between
                        gap-3
                    ">

                        <div class="text-xs">

                            ${
                                complete
                                ? `
                                    <span class="text-green-400">
                                        <i class="fa-solid fa-circle-check mr-1"></i>
                                        Mission completed
                                    </span>
                                  `
                                : `
                                    <span class="text-gray-500">
                                        Keep going
                                    </span>
                                  `
                            }

                        </div>

                        ${buttonHTML}

                    </div>

                </div>

            </div>
        `;


        container.appendChild(card);

    });


    updateOverview();

}


/* =========================================================
   UPDATE OVERVIEW
========================================================= */

function updateOverview() {

    const total =
        missions.length;


    let completed = 0;
    let earned = 0;


    missions.forEach(mission => {

        if (
            isMissionClaimed(mission)
        ) {

            completed++;
            earned += Number(
                mission.reward
            );

        }

    });


    const percentage =
        total > 0
        ? Math.round(
            (completed / total) * 100
        )
        : 0;


    document.getElementById(
        "completedCount"
    ).textContent =
        completed;


    document.getElementById(
        "earnedReward"
    ).textContent =
        `৳${earned}`;


    document.getElementById(
        "progressPercent"
    ).textContent =
        `${percentage}%`;


    document.getElementById(
        "progressText"
    ).textContent =
        `${completed}/${total}`;


    document.getElementById(
        "overallProgress"
    ).style.width =
        `${percentage}%`;


    const circumference =
        251.2;


    const offset =
        circumference -
        (percentage / 100) *
        circumference;


    document.getElementById(
        "progressRing"
    ).style.strokeDashoffset =
        offset;

}


/* =========================================================
   CLAIM MISSION
========================================================= */

window.claimMission =
async function(missionId) {

    if (!currentUser) {
        return;
    }


    const mission =
        missions.find(
            item => item.id === missionId
        );


    if (!mission) {
        return;
    }


    if (
        isMissionClaimed(mission)
    ) {
        return;
    }


    if (
        !isMissionComplete(mission)
    ) {
        return;
    }


    claimingMission =
        mission.id;

    renderMissions();


    try {

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const claimedRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "claimedTasks",
                mission.id
            );


        await runTransaction(
            db,
            async (transaction) => {

                const claimedSnapshot =
                    await transaction.get(
                        claimedRef
                    );


                if (
                    claimedSnapshot.exists()
                ) {

                    throw new Error(
                        "Mission already claimed."
                    );

                }


                const userSnapshot =
                    await transaction.get(
                        userRef
                    );


                if (
                    !userSnapshot.exists()
                ) {

                    throw new Error(
                        "User account not found."
                    );

                }


                transaction.update(
                    userRef,
                    {
                        balance:
                            increment(
                                mission.reward
                            )
                    }
                );


                transaction.set(
                    claimedRef,
                    {
                        missionId:
                            mission.id,

                        title:
                            mission.title,

                        reward:
                            mission.reward,

                        claimedAt:
                            serverTimestamp()
                    }
                );

            }
        );


        claimedTasks[
            mission.id
        ] = {
            missionId:
                mission.id,
            reward:
                mission.reward
        };


        claimingMission =
            null;


        renderMissions();


    } catch (error) {

        console.error(
            "Claim error:",
            error
        );


        claimingMission =
            null;


        renderMissions();


        alert(
            error.message ||
            "Mission claim failed."
        );

    }

};


/* =========================================================
   TABS
========================================================= */

document
    .querySelectorAll(".tab-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".tab-btn")
                    .forEach(btn => {

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                currentTab =
                    button.dataset.tab;


                renderMissions();

            }
        );

    });


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        /*
         * Maximum loader time 2 seconds.
         */

        const loaderTimer =
            new Promise(resolve =>
                setTimeout(
                    resolve,
                    2000
                )
            );


        try {

            await Promise.all([
                loadAllData(),
                loaderTimer
            ]);

        } catch (error) {

            console.error(
                "Page loading error:",
                error
            );

        }


        const loader =
            document.getElementById(
                "pageLoader"
            );


        loader.classList.add(
            "hide"
        );

    }
);

</script>
