<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Skill - Missions</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Hind Siliguri',sans-serif;
    background:
        radial-gradient(circle at top left,rgba(124,58,237,.16),transparent 35%),
        radial-gradient(circle at top right,rgba(34,197,94,.10),transparent 30%),
        #070b14;
    color:#fff;
    min-height:100vh;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.glass{
    background:rgba(15,23,42,.78);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
}

.loader{
    position:fixed;
    inset:0;
    background:#070b14;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.25s ease;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-box{
    text-align:center;
}

.loader img{
    width:72px;
    height:72px;
    border-radius:20px;
    object-fit:cover;
    margin:auto;
    box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid rgba(255,255,255,.15);
    border-top-color:#22c55e;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:18px auto 0;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(7,11,20,.88);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(16px);
}

.progress-ring{
    width:92px;
    height:92px;
    border-radius:50%;
    background:conic-gradient(#22c55e 0deg,#22c55e var(--progress),rgba(255,255,255,.08) var(--progress));
    display:flex;
    align-items:center;
    justify-content:center;
}

.progress-inner{
    width:72px;
    height:72px;
    border-radius:50%;
    background:#0b1120;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.tab-btn{
    transition:.2s ease;
}

.tab-btn.active{
    background:#22c55e;
    color:#04100a;
    box-shadow:0 5px 18px rgba(34,197,94,.2);
}

.task-card{
    transition:.2s ease;
}

.task-card:active{
    transform:scale(.99);
}

.task-icon{
    width:48px;
    height:48px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.task-btn{
    min-width:92px;
    height:40px;
    padding:0 15px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    transition:.2s ease;
}

.task-btn.incomplete{
    background:#ef4444;
    color:#fff;
    box-shadow:0 5px 15px rgba(239,68,68,.18);
}

.task-btn.complete{
    background:#22c55e;
    color:#04100a;
    box-shadow:0 5px 15px rgba(34,197,94,.18);
}

.task-btn.claimed{
    background:#334155;
    color:#cbd5e1;
    cursor:not-allowed;
    box-shadow:none;
}

.task-btn:disabled{
    opacity:.85;
}

.progress-bar{
    height:7px;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,#16a34a,#4ade80);
    transition:.3s ease;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(100px);
    background:#111827;
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    padding:12px 18px;
    border-radius:14px;
    z-index:10000;
    opacity:0;
    transition:.25s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.empty{
    border:1px dashed rgba(255,255,255,.1);
}
</style>
</head>

<body>

<!-- Loader -->
<div id="loader" class="loader">
    <div class="loader-box">
        <img src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
             alt="Aura Skill">
        <div class="spinner"></div>
        <p class="text-gray-400 text-sm mt-3">Loading...</p>
    </div>
</div>

<!-- Header -->
<header class="header">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center gap-3">

        <button onclick="history.back()"
                class="w-10 h-10 rounded-xl glass flex items-center justify-center">
            <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>

        <div class="flex-1">
            <h1 class="text-lg font-bold">Missions</h1>
            <p class="text-xs text-gray-400">Complete missions & earn rewards</p>
        </div>

        <div class="w-10 h-10 rounded-xl bg-green-500/10 flex items-center justify-center">
            <i class="fa-solid fa-trophy text-green-400"></i>
        </div>
    </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-5 pb-10">

    <!-- Overall Progress -->
    <section class="glass rounded-3xl p-5 mb-5">

        <div class="flex items-center gap-5">

            <div id="progressRing"
                 class="progress-ring"
                 style="--progress:0deg">

                <div class="progress-inner">
                    <span id="overallPercent" class="text-xl font-bold">0%</span>
                    <span class="text-[10px] text-gray-500">DONE</span>
                </div>

            </div>

            <div class="flex-1">

                <p class="text-gray-400 text-sm">Mission Progress</p>

                <h2 class="text-xl font-bold mt-1">
                    <span id="completedCount">0</span>
                    /
                    <span id="totalCount">0</span>
                    Completed
                </h2>

                <div class="progress-bar mt-3">
                    <div id="overallBar"
                         class="progress-fill"
                         style="width:0%">
                    </div>
                </div>

                <p class="text-xs text-gray-500 mt-2">
                    Earned rewards:
                    <span id="earnedReward" class="text-green-400 font-semibold">
                        ৳0
                    </span>
                </p>

            </div>
        </div>
    </section>

    <!-- Tabs -->
    <div class="glass rounded-2xl p-1.5 flex gap-1 mb-5">

        <button class="tab-btn active flex-1 py-2.5 rounded-xl text-sm font-semibold"
                data-tab="all">
            All
        </button>

        <button class="tab-btn flex-1 py-2.5 rounded-xl text-sm font-semibold text-gray-400"
                data-tab="match">
            Match
        </button>

        <button class="tab-btn flex-1 py-2.5 rounded-xl text-sm font-semibold text-gray-400"
                data-tab="referral">
            Referral
        </button>

        <button class="tab-btn flex-1 py-2.5 rounded-xl text-sm font-semibold text-gray-400"
                data-tab="deposit">
            Deposit
        </button>

    </div>

    <!-- Tasks -->
    <div id="taskList" class="space-y-3"></div>

</main>

<div id="toast" class="toast"></div>

<script type="module">

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp,
    collection,
    getDocs,
    query,
    where,
    runTransaction
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import { auth, db } from "./firebase.js";


/* =========================================================
   MISSIONS
========================================================= */

const missions = [

    {
        id:"play_1",
        type:"match",
        target:1,
        reward:2,
        progressKey:"matches",
        title:"Play 1 Match",
        description:"Complete 1 match",
        icon:"fa-gamepad",
        button:"Play Match",
        link:"index.html"
    },

    {
        id:"play_3",
        type:"match",
        target:3,
        reward:6,
        progressKey:"matches",
        title:"Play 3 Matches",
        description:"Complete 3 matches",
        icon:"fa-gamepad",
        button:"Play Match",
        link:"index.html"
    },

    {
        id:"win_1",
        type:"match",
        target:1,
        reward:3,
        progressKey:"wins",
        title:"Win 1 Match",
        description:"Win any 1 completed match",
        icon:"fa-trophy",
        button:"Play Match",
        link:"index.html"
    },

    {
        id:"refer_1",
        type:"referral",
        target:1,
        reward:5,
        progressKey:"referrals",
        title:"Refer 1 Friend",
        description:"Invite 1 friend",
        icon:"fa-user-plus",
        button:"Refer",
        link:"referral.html"
    },

    {
        id:"refer_5",
        type:"referral",
        target:5,
        reward:30,
        progressKey:"referrals",
        title:"Refer 5 Friends",
        description:"Invite 5 friends",
        icon:"fa-users",
        button:"Refer",
        link:"referral.html"
    },

    {
        id:"first_deposit",
        type:"deposit",
        target:1,
        reward:5,
        progressKey:"deposits",
        title:"Make First Deposit",
        description:"Complete your first approved deposit",
        icon:"fa-wallet",
        button:"Deposit",
        link:"wallet.html"
    }

];


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentTab = "all";

let claimedTasks = new Set();

let userStats = {
    matches:0,
    wins:0,
    referrals:0,
    deposits:0
};


/* =========================================================
   HELPERS
========================================================= */

function safeNumber(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;
}


function normalizeText(value){

    return String(value ?? "")
        .trim()
        .toLowerCase();
}


function isCancelledMatch(data){

    const status = normalizeText(
        data?.status ??
        data?.matchStatus ??
        data?.resultStatus
    );

    return [
        "cancelled",
        "canceled",
        "refunded",
        "refund",
        "cancel"
    ].includes(status);
}


function isCompletedMatch(data){

    const status = normalizeText(
        data?.status ??
        data?.matchStatus ??
        data?.resultStatus
    );

    return (
        status === "completed" ||
        status === "complete" ||
        status === "finished" ||
        status === "finish" ||
        !!data?.completedAt
    );
}


function findUserParticipant(tournamentData){

    const participants =
        Array.isArray(tournamentData?.participants)
            ? tournamentData.participants
            : [];

    return participants.find(p => {

        if(!p) return false;

        return (
            p.uid === currentUser.uid ||
            p.userId === currentUser.uid ||
            p.firebaseUid === currentUser.uid
        );

    }) || null;
}


function isWinnerRecord(data, participant = null){

    const values = [

        data?.isWinner,
        data?.winner,
        data?.won,
        data?.result,
        data?.matchResult,
        data?.position

    ];

    if(participant){

        values.push(
            participant.isWinner,
            participant.winner,
            participant.won,
            participant.result,
            participant.matchResult,
            participant.position
        );
    }

    for(const value of values){

        if(value === true) return true;

        const text = normalizeText(value);

        if([
            "winner",
            "won",
            "win",
            "1",
            "true",
            "yes"
        ].includes(text)){
            return true;
        }
    }

    return false;
}


/* =========================================================
   MATCH STATS
========================================================= */

async function loadActualMatchStats(){

    if(!currentUser) return;

    let matchIds = new Set();
    let wins = 0;

    try{

        const historyQuery = query(
            collection(db,"matchHistory"),
            where("userId","==",currentUser.uid)
        );

        const historySnapshot =
            await getDocs(historyQuery);

        historySnapshot.forEach(item => {

            const data = item.data() || {};

            if(isCancelledMatch(data)) return;

            if(!isCompletedMatch(data)) return;

            const matchId =
                data.tournamentId ??
                data.matchId ??
                data.tournamentID ??
                item.id;

            if(matchId){
                matchIds.add(String(matchId));
            }

            if(isWinnerRecord(data)){
                wins++;
            }

        });

    }catch(error){

        console.error("matchHistory error:",error);

    }


    try{

        const tournamentSnapshot =
            await getDocs(collection(db,"tournaments"));

        tournamentSnapshot.forEach(item => {

            const data = item.data() || {};

            if(isCancelledMatch(data)) return;

            const participant =
                findUserParticipant(data);

            if(!participant) return;

            if(!isCompletedMatch(data)) return;

            const matchId =
                data.tournamentId ??
                data.matchId ??
                item.id;

            if(matchId){
                matchIds.add(String(matchId));
            }

            if(isWinnerRecord(data,participant)){
                wins++;
            }

        });

    }catch(error){

        console.error("tournaments error:",error);

    }


    userStats.matches = matchIds.size;

    userStats.wins = wins;

}


/* =========================================================
   REFERRAL STATS
========================================================= */

async function loadReferralStats(){

    if(!currentUser) return;

    try{

        const userRef =
            doc(db,"users",currentUser.uid);

        const snap =
            await getDoc(userRef);

        if(!snap.exists()){

            userStats.referrals = 0;

            return;
        }

        const data = snap.data() || {};

        userStats.referrals =
            safeNumber(
                data.referrals ??
                data.totalReferrals ??
                data.referralCount ??
                0
            );

    }catch(error){

        console.error("Referral stats error:",error);

        userStats.referrals = 0;
    }
}


/* =========================================================
   DEPOSIT STATS
========================================================= */

async function loadDepositStats(){

    if(!currentUser) return;

    try{

        const depositQuery = query(
            collection(db,"transactions"),
            where("userId","==",currentUser.uid)
        );

        const snapshot =
            await getDocs(depositQuery);

        let approvedCount = 0;

        snapshot.forEach(item => {

            const data = item.data() || {};

            const status =
                normalizeText(data.status);

            const amount =
                safeNumber(data.amount);

            const approved =
                [
                    "approved",
                    "success",
                    "successful",
                    "completed"
                ].includes(status);

            if(approved && amount > 0){

                approvedCount++;

            }

        });

        userStats.deposits =
            approvedCount > 0 ? 1 : 0;

    }catch(error){

        console.error("Deposit stats error:",error);

        userStats.deposits = 0;
    }
}


/* =========================================================
   CLAIMED TASKS
========================================================= */

async function loadClaimedTasks(){

    if(!currentUser) return;

    claimedTasks = new Set();

    try{

        const ref =
            collection(
                db,
                "users",
                currentUser.uid,
                "claimedTasks"
            );

        const snapshot =
            await getDocs(ref);

        snapshot.forEach(item => {

            claimedTasks.add(item.id);

        });

    }catch(error){

        console.error("Claimed tasks error:",error);

    }
}


/* =========================================================
   MISSION PROGRESS
========================================================= */

function getMissionProgress(task){

    return safeNumber(
        userStats[task.progressKey]
    );
}


function isMissionComplete(task){

    return getMissionProgress(task) >= task.target;
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },3000);
}


/* =========================================================
   CLAIM MISSION
========================================================= */

async function claimTask(taskId){

    if(!currentUser) return;

    const task =
        missions.find(x => x.id === taskId);

    if(!task) return;


    if(claimedTasks.has(task.id)){

        showToast("এই mission-এর reward ইতিমধ্যে claim করা হয়েছে।");

        return;
    }


    if(!isMissionComplete(task)){

        showToast("Mission এখনো complete হয়নি।");

        return;
    }


    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );

    const claimRef =
        doc(
            db,
            "users",
            currentUser.uid,
            "claimedTasks",
            task.id
        );


    try{

        const reward =
            safeNumber(task.reward);


        await runTransaction(
            db,
            async transaction => {

                const userSnap =
                    await transaction.get(userRef);

                const claimSnap =
                    await transaction.get(claimRef);


                /* Prevent duplicate claim */
                if(claimSnap.exists()){

                    throw new Error(
                        "ALREADY_CLAIMED"
                    );
                }


                const userData =
                    userSnap.exists()
                        ? userSnap.data()
                        : {};


                const currentBalance =
                    safeNumber(
                        userData.balance
                    );


                /* Add mission reward to wallet */
                transaction.set(
                    userRef,
                    {
                        balance:
                            currentBalance + reward,

                        updatedAt:
                            serverTimestamp()
                    },
                    {
                        merge:true
                    }
                );


                /* Save claim record */
                transaction.set(
                    claimRef,
                    {
                        taskId:task.id,
                        title:task.title,
                        reward:reward,
                        claimed:true,
                        claimedAt:
                            serverTimestamp()
                    }
                );

            }
        );


        claimedTasks.add(task.id);

        renderTasks();

        showToast(
            `অভিনন্দন! ৳${reward} আপনার Wallet Balance-এ যোগ হয়েছে।`
        );


    }catch(error){

        console.error("Claim error:",error);

        if(error.message === "ALREADY_CLAIMED"){

            claimedTasks.add(task.id);

            renderTasks();

            showToast(
                "এই mission-এর reward ইতিমধ্যে claim করা হয়েছে।"
            );

            return;
        }


        showToast(
            "Reward claim করা যায়নি। আবার চেষ্টা করুন।"
        );
    }
}


/* =========================================================
   TASK BUTTON
========================================================= */

function handleTaskButton(task){

    const complete =
        isMissionComplete(task);

    const claimed =
        claimedTasks.has(task.id);


    if(claimed){

        return;
    }


    if(complete){

        claimTask(task.id);

        return;
    }


    if(task.link){

        window.location.href =
            task.link;

    }else{

        showToast(
            "আগে mission complete করুন।"
        );
    }
}


/* =========================================================
   RENDER TASKS
========================================================= */

function renderTasks(){

    const list =
        document.getElementById("taskList");

    let filtered =
        missions.filter(task => {

            if(currentTab === "all"){
                return true;
            }

            return task.type === currentTab;

        });


    if(filtered.length === 0){

        list.innerHTML = `
            <div class="glass rounded-2xl p-8 text-center empty">
                <i class="fa-solid fa-list-check text-3xl text-gray-500"></i>
                <p class="text-gray-400 mt-3">
                    কোনো mission পাওয়া যায়নি
                </p>
            </div>
        `;

        updateOverallProgress();

        return;
    }


    list.innerHTML =
        filtered.map(task => {

            const progress =
                getMissionProgress(task);

            const complete =
                isMissionComplete(task);

            const claimed =
                claimedTasks.has(task.id);

            const percent =
                Math.min(
                    100,
                    Math.round(
                        (progress / task.target) * 100
                    )
                );


            let buttonClass =
                "incomplete";

            let buttonText =
                task.button;

            let disabled = "";


            /*
             * RED = incomplete
             * GREEN = complete and ready to claim
             * GRAY = already claimed
             */

            if(claimed){

                buttonClass =
                    "claimed";

                buttonText =
                    "Claimed";

                disabled =
                    "disabled";

            }else if(complete){

                buttonClass =
                    "complete";

                buttonText =
                    "Claim";

            }


            return `

            <div class="task-card glass rounded-2xl p-4">

                <div class="flex items-center gap-3">

                    <div class="task-icon bg-green-500/10">
                        <i class="fa-solid ${task.icon}
                           text-green-400 text-lg"></i>
                    </div>

                    <div class="flex-1 min-w-0">

                        <div class="flex items-start justify-between gap-2">

                            <div>

                                <h3 class="font-semibold text-sm">
                                    ${task.title}
                                </h3>

                                <p class="text-xs text-gray-500 mt-0.5">
                                    ${task.description}
                                </p>

                            </div>

                            <div class="text-green-400 font-bold text-sm whitespace-nowrap">
                                +৳${task.reward}
                            </div>

                        </div>

                        <div class="flex items-center gap-2 mt-3">

                            <div class="flex-1 progress-bar">

                                <div class="progress-fill"
                                     style="width:${percent}%">
                                </div>

                            </div>

                            <span class="text-[11px] text-gray-400 whitespace-nowrap">
                                ${Math.min(progress,task.target)}/${task.target}
                            </span>

                        </div>

                    </div>

                    <button
                        class="task-btn ${buttonClass}"
                        ${disabled}
                        onclick="handleMission('${task.id}')">

                        ${buttonText}

                    </button>

                </div>

            </div>

            `;

        }).join("");


    updateOverallProgress();
}


/* =========================================================
   OVERALL PROGRESS
========================================================= */

function updateOverallProgress(){

    const total =
        missions.length;

    let completed = 0;

    let earned = 0;


    missions.forEach(task => {

        if(isMissionComplete(task)){

            completed++;

        }

        if(claimedTasks.has(task.id)){

            earned += safeNumber(
                task.reward
            );

        }

    });


    const percent =
        total > 0
            ? Math.round(
                (completed / total) * 100
              )
            : 0;


    document.getElementById(
        "completedCount"
    ).textContent = completed;


    document.getElementById(
        "totalCount"
    ).textContent = total;


    document.getElementById(
        "overallPercent"
    ).textContent = `${percent}%`;


    document.getElementById(
        "overallBar"
    ).style.width = `${percent}%`;


    document.getElementById(
        "earnedReward"
    ).textContent = `৳${earned}`;


    document.getElementById(
        "progressRing"
    ).style.setProperty(
        "--progress",
        `${percent * 3.6}deg`
    );
}


/* =========================================================
   GLOBAL BUTTON HANDLER
========================================================= */

window.handleMission =
    function(taskId){

        const task =
            missions.find(
                x => x.id === taskId
            );

        if(!task) return;

        handleTaskButton(task);
    };


/* =========================================================
   TABS
========================================================= */

document.querySelectorAll(".tab-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
                .querySelectorAll(".tab-btn")
                .forEach(btn => {

                    btn.classList.remove("active");

                    btn.classList.add(
                        "text-gray-400"
                    );

                });


            button.classList.add("active");

            button.classList.remove(
                "text-gray-400"
            );


            currentTab =
                button.dataset.tab;


            renderTasks();

        }
    );

});


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;
        }


        currentUser = user;


        try{

            /*
             * Load data
             */
            await Promise.all([
                loadClaimedTasks(),
                loadReferralStats(),
                loadActualMatchStats(),
                loadDepositStats()
            ]);


            /*
             * Render immediately after data loads
             */
            renderTasks();


        }catch(error){

            console.error(
                "Mission loading error:",
                error
            );

            renderTasks();

            showToast(
                "Mission data load করতে সমস্যা হয়েছে।"
            );

        }finally{

            setTimeout(() => {

                document
                    .getElementById("loader")
                    .classList.add("hide");

            },150);

        }

    }
);

</script>
