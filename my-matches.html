<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aura Skill - My Matches</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(37,99,235,.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at top right,
                    rgba(16,185,129,.06),
                    transparent 25%
                ),
                #050811;

            color: #f8fafc;

            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }

        .glass-card {
            background: rgba(15, 23, 42, .86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(51, 65, 85, .65);
        }

        .summary-card {
            background:
                linear-gradient(
                    145deg,
                    rgba(15,23,42,.95),
                    rgba(11,18,32,.88)
                );

            border: 1px solid rgba(51,65,85,.7);

            box-shadow:
                0 15px 40px rgba(0,0,0,.22);
        }

        .match-card {
            transition:
                transform .18s ease,
                border-color .18s ease;
        }

        .match-card:active {
            transform: scale(.99);
        }

        .tab-active {
            background: #2563eb !important;
            color: white !important;

            box-shadow:
                0 5px 18px rgba(37,99,235,.25);
        }

        .tab-btn {
            color: #94a3b8;
            transition: .18s ease;
        }

        .tab-btn:hover {
            color: white;
        }

        .filter-box {
            background: rgba(13,19,34,.9);
            border: 1px solid rgba(51,65,85,.75);
        }

        .copy-btn {
            transition: .15s ease;
        }

        .copy-btn:active {
            transform: scale(.92);
        }

        #toast-container {
            position: fixed;
            top: 18px;
            right: 15px;
            left: 15px;
            z-index: 9999;

            display: flex;
            flex-direction: column;
            align-items: flex-end;

            gap: 9px;

            pointer-events: none;
        }

        .toast {
            max-width: 340px;

            background: rgba(15,23,42,.96);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border-left: 4px solid #3b82f6;

            color: #fff;

            padding: 11px 15px;

            border-radius: 13px;

            box-shadow:
                0 12px 30px rgba(0,0,0,.45);

            font-size: 12px;
            font-weight: 600;

            display: flex;
            align-items: center;

            gap: 9px;

            animation:
                slideIn .25s ease,
                fadeOut .3s ease 3s forwards;
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        .toast.success {
            border-left-color: #10b981;
        }

        @keyframes slideIn {

            from {
                transform: translateY(-12px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }

        }

        @keyframes fadeOut {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                transform: translateY(-8px);
            }

        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            display: inline-block;
        }

        .profit-positive {
            color: #34d399;
        }

        .profit-negative {
            color: #fb7185;
        }

        .profit-zero {
            color: #94a3b8;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

    </style>
</head>

<script type="module">

    import {
        auth,
        db
    } from "./firebase.js";


    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    import {
        doc,
        getDoc,
        collection,
        getDocs,
        query,
        where,
        onSnapshot,
        setDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    let currentUserUid = null;

    let allJoinedMatches = [];

    let currentFilter = "all";


    /* =========================
       TOAST
    ========================= */

    window.showToast = function(
        message,
        type = "success"
    ) {

        const container =
            document.getElementById(
                "toast-container"
            );


        const toast =
            document.createElement(
                "div"
            );


        toast.className =
            `toast ${type}`;


        const icon =
            type === "error"

                ? '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>'

                : '<i class="fa-solid fa-circle-check text-emerald-400"></i>';


        toast.innerHTML =
            `${icon}<span>${message}</span>`;


        container.appendChild(
            toast
        );


        setTimeout(() => {

            toast.remove();

        }, 3500);

    };


    /* =========================
       AUTH
    ========================= */

    onAuthStateChanged(
        auth,
        async user => {

            if (!user) {

                window.location.replace(
                    "login.html"
                );

                return;

            }


            currentUserUid =
                user.uid;


            /*
             * UI সাথে সাথে render
             * করবে।
             */

            renderMatches();


            /*
             * User balance এবং matches
             * parallel load হবে।
             */

            await Promise.allSettled([

                fetchUserData(
                    user.uid
                ),

                fetchMyMatches(
                    user.uid
                )

            ]);


            /*
             * Data load হওয়ার পর
             * realtime চালু।
             */

            startMyMatchesRealtime(
                user.uid
            );

        }
    );


    /* =========================
       USER DATA
    ========================= */

    async function fetchUserData(uid) {

        try {

            const snap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        uid
                    )
                );


            if (
                snap.exists()
            ) {

                const data =
                    snap.data();


                document.getElementById(
                    "wallet-balance"
                ).innerText =
                    Number(
                        data.balance || 0
                    );

            }

        } catch (e) {

            console.error(
                "User data:",
                e
            );

        }

    }


    /* =========================
       TIMESTAMP
    ========================= */

    function getMatchTimestamp(m) {

        return Number(
            m.completedAt ||
            m.startTime ||
            m.registeredAt ||
            m.createdAt ||
            0
        );

    }


    function formatBanglaDateTime(
        timestamp
    ) {

        const value =
            Number(timestamp);


        if (!value)
            return "সময় নির্ধারিত নয়";


        const d =
            new Date(value);


        if (
            isNaN(
                d.getTime()
            )
        )
            return "সময় নির্ধারিত নয়";


        const date =
            d.toLocaleDateString(
                "bn-BD",
                {
                    day: "numeric",
                    month: "numeric",
                    year: "numeric"
                }
            );


        const time =
            d.toLocaleTimeString(
                "en-US",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true
                }
            );


        return `${date} • ${time}`;

    }


    /* =========================
       ARCHIVE
    ========================= */

    async function archiveCompletedMatch(
        tournamentId,
        data,
        userEntry
    ) {

        try {

            const historyId =
                `${tournamentId}_${currentUserUid}`;


            const historyRef =
                doc(
                    db,
                    "matchHistory",
                    historyId
                );


            const historySnap =
                await getDoc(
                    historyRef
                );


            if (
                historySnap.exists()
            )
                return;


            const results =
                Array.isArray(
                    data.results
                )
                    ? data.results
                    : [];


            const userResult =
                results.find(
                    r =>
                        r &&
                        (
                            r.userId ===
                                currentUserUid ||

                            r.uid ===
                                currentUserUid
                        )
                ) || {};


            const outcome =
                String(
                    userResult.result ??
                    userResult.outcome ??
                    userResult.matchResult ??
                    userEntry.result ??
                    userEntry.outcome ??
                    ""
                )
                .trim()
                .toLowerCase();


            let wonAmount =
                Number(
                    userResult.amount ??
                    userResult.prize ??
                    userEntry.wonAmount ??
                    userEntry.winnings ??
                    userEntry.prizeWon ??
                    userEntry.winAmount ??
                    0
                );


            const kills =
                Number(
                    userResult.kills ||
                    0
                );


            const perKill =
                Number(
                    data.perKill ||
                    0
                );


            if (
                wonAmount <= 0 &&
                kills > 0 &&
                perKill > 0 &&
                (
                    userResult.killOnly === true ||
                    data.killOnly === true
                )
            ) {

                wonAmount =
                    kills * perKill;

            }


            const isWinner =
                userResult.winner === true ||
                userEntry.isWinner === true ||
                userEntry.winner === true ||
                data.winnerUid === currentUserUid ||
                (
                    Array.isArray(
                        data.winnerUids
                    ) &&
                    data.winnerUids.includes(
                        currentUserUid
                    )
                ) ||
                [
                    "win",
                    "won",
                    "winner",
                    "victory"
                ].includes(
                    outcome
                ) ||
                wonAmount > 0;


            const isLoss =
                userResult.winner === false ||
                userEntry.isWinner === false ||
                userEntry.winner === false ||
                [
                    "loss",
                    "lost",
                    "lose",
                    "defeat"
                ].includes(
                    outcome
                );


            await setDoc(
                historyRef,
                {

                    tournamentId,

                    userId:
                        currentUserUid,

                    uid:
                        currentUserUid,

                    name:
                        data.name ||
                        "Tournament",

                    time:
                        data.time ||
                        "",

                    startTime:
                        Number(
                            data.startTime ||
                            0
                        ),

                    completedAt:
                        Number(
                            data.completedAt ||
                            Date.now()
                        ),

                    status:
                        "completed",

                    userPlayers:
                        Array.isArray(
                            userEntry.players
                        )
                            ? userEntry.players
                            : [],

                    registeredAt:
                        userEntry.registeredAt ||
                        0,

                    entryFee:
                        Number(
                            data.entryFee ||
                            0
                        ),

                    entryFeePaid:
                        Number(
                            userEntry.entryFeePaid ??
                            userEntry.paidEntryFee ??
                            userEntry.amountPaid ??
                            data.entryFee ??
                            0
                        ),

                    prize:
                        data.prize ||
                        0,

                    map:
                        data.map ||
                        "Bermuda",

                    result:
                        isWinner
                            ? "WIN"
                            : (
                                isLoss
                                    ? "LOSS"
                                    : "RESULT PENDING"
                            ),

                    matchResult:
                        isWinner
                            ? "WIN"
                            : (
                                isLoss
                                    ? "LOSS"
                                    : "RESULT PENDING"
                            ),

                    isWinner,

                    winner:
                        isWinner,

                    wonAmount:
                        isWinner
                            ? wonAmount
                            : 0,

                    winnings:
                        isWinner
                            ? wonAmount
                            : 0,

                    prizeWon:
                        isWinner
                            ? wonAmount
                            : 0,

                    kills,

                    position:
                        userResult.position ??
                        null,

                    roomId:
                        data.roomId ||
                        "",

                    roomPass:
                        data.roomPass ||
                        ""

                }
            );

        } catch (e) {

            console.error(
                "Archive:",
                e
            );

        }

    }


    /* =========================
       RESULT
    ========================= */

    function getResultInfo(m) {

        const entry =
            m.userEntry ||
            {};


        const results =
            Array.isArray(
                m.results
            )
                ? m.results
                : [];


        const userResult =
            results.find(
                r =>
                    r &&
                    (
                        r.userId ===
                            currentUserUid ||

                        r.uid ===
                            currentUserUid
                    )
            ) || {};


        const outcome =
            String(
                m.result ??
                m.matchResult ??
                m.outcome ??
                entry.result ??
                entry.matchResult ??
                entry.outcome ??
                userResult.result ??
                userResult.outcome ??
                ""
            )
            .trim()
            .toLowerCase();


        let wonAmount =
            Number(
                m.wonAmount ??
                m.winnings ??
                m.prizeWon ??
                m.winAmount ??
                entry.wonAmount ??
                entry.winnings ??
                entry.prizeWon ??
                entry.winAmount ??
                userResult.amount ??
                userResult.prize ??
                0
            );


        const kills =
            Number(
                userResult.kills ??
                m.kills ??
                0
            );


        const perKill =
            Number(
                m.perKill ||
                0
            );


        if (
            wonAmount <= 0 &&
            kills > 0 &&
            perKill > 0 &&
            (
                userResult.killOnly === true ||
                m.killOnly === true
            )
        ) {

            wonAmount =
                kills * perKill;

        }


        const isWinner =
            m.isWinner === true ||
            m.winner === true ||
            entry.isWinner === true ||
            entry.winner === true ||
            userResult.winner === true ||
            m.winnerUid === currentUserUid ||
            (
                Array.isArray(
                    m.winnerUids
                ) &&
                m.winnerUids.includes(
                    currentUserUid
                )
            ) ||
            [
                "win",
                "won",
                "winner",
                "victory"
            ].includes(
                outcome
            ) ||
            wonAmount > 0;


        const isLoss =
            m.isWinner === false ||
            m.winner === false ||
            entry.isWinner === false ||
            entry.winner === false ||
            userResult.winner === false ||
            [
                "loss",
                "lost",
                "lose",
                "defeat"
            ].includes(
                outcome
            );


        return {

            isWinner,

            isLoss,

            result:
                isWinner
                    ? "WIN"
                    : (
                        isLoss
                            ? "LOSS"
                            : "RESULT PENDING"
                    ),

            wonAmount:
                Number.isFinite(
                    wonAmount
                )
                    ? wonAmount
                    : 0,

            kills,

            position:
                userResult.position ??
                m.position ??
                null

        };

    }


    /* =========================
       FETCH MATCHES
    ========================= */

    async function fetchMyMatches(uid) {

        try {

            /*
             * দুই query একসাথে।
             */

            const historyPromise =
                getDocs(
                    query(
                        collection(
                            db,
                            "matchHistory"
                        ),
                        where(
                            "userId",
                            "==",
                            uid
                        )
                    )
                ).catch(
                    () => null
                );


            const tournamentPromise =
                getDocs(
                    collection(
                        db,
                        "tournaments"
                    )
                );


            const [
                historySnap,
                tourSnap
            ] =
                await Promise.all([
                    historyPromise,
                    tournamentPromise
                ]);


            const byId =
                new Map();


            /* Permanent history */

            if (historySnap) {

                historySnap.forEach(
                    d => {

                        const data =
                            d.data() ||
                            {};


                        byId.set(
                            String(
                                data.tournamentId ||
                                d.id
                            ),
                            {

                                id:
                                    String(
                                        data.tournamentId ||
                                        d.id
                                    ),

                                ...data,

                                status:
                                    "completed",

                                userEntry: {

                                    uid,

                                    players:
                                        data.userPlayers ||
                                        [],

                                    isWinner:
                                        data.isWinner === true,

                                    winner:
                                        data.winner === true,

                                    wonAmount:
                                        data.wonAmount

                                },

                                userPlayers:
                                    Array.isArray(
                                        data.userPlayers
                                    )
                                        ? data.userPlayers
                                        : []

                            }
                        );

                    }
                );

            }


            /* Current tournaments */

            for (
                const d of
                tourSnap.docs
            ) {

                const data =
                    d.data() ||
                    {};


                const participants =
                    Array.isArray(
                        data.participants
                    )
                        ? data.participants
                        : [];


                const userEntry =
                    participants.find(
                        p =>
                            p &&
                            (
                                p.uid === uid ||
                                p.userId === uid
                            )
                    );


                if (!userEntry)
                    continue;


                const rawStatus =
                    String(
                        data.status ||
                        "upcoming"
                    )
                    .toLowerCase();


                const isCompleted =
                    [
                        "complete",
                        "completed",
                        "finished",
                        "finish",
                        "result"
                    ].includes(
                        rawStatus
                    ) ||
                    data.completed === true ||
                    data.isCompleted === true;


                const isCancelled =
                    [
                        "cancelled",
                        "canceled",
                        "cancel",
                        "refunded"
                    ].includes(
                        rawStatus
                    ) ||
                    data.cancelled === true ||
                    data.canceled === true;


                if (
                    isCompleted
                ) {

                    await archiveCompletedMatch(
                        d.id,
                        data,
                        userEntry
                    );

                }


                const existing =
                    byId.get(
                        d.id
                    );


                if (
                    existing &&
                    existing.status ===
                        "completed"
                ) {

                    byId.set(
                        d.id,
                        {

                            ...existing,

                            name:
                                data.name ||
                                existing.name,

                            time:
                                data.time ||
                                existing.time,

                            startTime:
                                data.startTime ??
                                existing.startTime,

                            roomId:
                                data.roomId ??
                                existing.roomId,

                            roomPass:
                                data.roomPass ??
                                existing.roomPass,

                            prize:
                                data.prize ??
                                existing.prize,

                            map:
                                data.map ??
                                existing.map,

                            results:
                                data.results ??
                                existing.results,

                            perKill:
                                data.perKill ??
                                existing.perKill

                        }
                    );

                } else {

                    byId.set(
                        d.id,
                        {

                            id:
                                d.id,

                            ...data,

                            userPlayers:
                                Array.isArray(
                                    userEntry.players
                                )
                                    ? userEntry.players
                                    : [],

                            userEntry,

                            registeredAt:
                                userEntry.registeredAt ||
                                0,

                            status:
                                isCancelled
                                    ? "cancelled"
                                    : (
                                        data.status ||
                                        "upcoming"
                                    )

                        }
                    );

                }

            }


            allJoinedMatches =
                Array.from(
                    byId.values()
                )
                .sort(
                    (a, b) =>
                        getMatchTimestamp(b) -
                        getMatchTimestamp(a)
                );


            renderMatches();

        } catch (e) {

            console.error(
                "Matches:",
                e
            );


            showToast(
                "ম্যাচ হিস্ট্রি লোড করতে সমস্যা হয়েছে!",
                "error"
            );

        }

    }


    /* =========================
       REALTIME
    ========================= */

    function startMyMatchesRealtime(
        uid
    ) {

        onSnapshot(

            collection(
                db,
                "tournaments"
            ),

            async () => {

                await fetchMyMatches(
                    uid
                );

            },

            e =>
                console.warn(
                    "Tournament realtime failed:",
                    e
                )

        );


        onSnapshot(

            query(
                collection(
                    db,
                    "matchHistory"
                ),
                where(
                    "userId",
                    "==",
                    uid
                )
            ),

            snapshot => {

                snapshot.docChanges()
                    .forEach(
                        change => {

                            if (
                                change.type ===
                                "removed"
                            )
                                return;


                            const data =
                                change.doc.data() ||
                                {};


                            const tournamentId =
                                String(
                                    data.tournamentId ||
                                    change.doc.id
                                );


                            const item = {

                                id:
                                    tournamentId,

                                ...data,

                                status:
                                    "completed",

                                userPlayers:
                                    Array.isArray(
                                        data.userPlayers
                                    )
                                        ? data.userPlayers
                                        : [],

                                userEntry: {

                                    uid,

                                    players:
                                        Array.isArray(
                                            data.userPlayers
                                        )
                                            ? data.userPlayers
                                            : [],

                                    isWinner:
                                        data.isWinner === true,

                                    winner:
                                        data.winner === true,

                                    wonAmount:
                                        data.wonAmount

                                }

                            };


                            const idx =
                                allJoinedMatches.findIndex(
                                    m =>
                                        String(
                                            m.id
                                        ) ===
                                        tournamentId
                                );


                            if (
                                idx >= 0
                            ) {

                                allJoinedMatches[idx] =
                                    {

                                        ...allJoinedMatches[idx],

                                        ...item

                                    };

                            } else {

                                allJoinedMatches.unshift(
                                    item
                                );

                            }

                        }
                    );


                allJoinedMatches.sort(
                    (a, b) =>
                        getMatchTimestamp(b) -
                        getMatchTimestamp(a)
                );


                renderMatches();

            },

            e =>
                console.warn(
                    "History realtime failed:",
                    e
                )

        );

    }

    /* =========================
       MATCH STATE
    ========================= */

    function getMatchState(m) {

        const status =
            String(
                m.status ||
                "upcoming"
            )
            .toLowerCase();


        if (
            [
                "cancelled",
                "canceled",
                "cancel",
                "refunded"
            ].includes(
                status
            ) ||
            m.cancelled === true ||
            m.canceled === true
        ) {

            return "cancelled";

        }


        if (
            [
                "completed",
                "complete",
                "finished",
                "finish",
                "result"
            ].includes(
                status
            ) ||
            m.completed === true ||
            m.isCompleted === true
        ) {

            return "completed";

        }


        if (
            status === "live" ||
            status === "running"
        ) {

            return "live";

        }


        return "joined";

    }

    /* =========================
       SUMMARY
    ========================= */

    function updateSummary() {

        const completed =
            allJoinedMatches.filter(
                m =>
                    getMatchState(m) ===
                    "completed"
            );


        let totalEntry = 0;

        let totalWon = 0;


        completed.forEach(
            m => {

                const entry =
                    Number(
                        m.entryFeePaid ??
                        (m.userEntry || {})
                            .entryFeePaid ??
                        (m.userEntry || {})
                            .paidEntryFee ??
                        (m.userEntry || {})
                            .amountPaid ??
                        m.entryFee ??
                        0
                    );


                const result =
                    getResultInfo(m);


                totalEntry +=
                    Number.isFinite(
                        entry
                    )
                        ? entry
                        : 0;


                totalWon +=
                    Number.isFinite(
                        result.wonAmount
                    )
                        ? result.wonAmount
                        : 0;

            }
        );


        const totalProfit =
            totalWon -
            totalEntry;


        document.getElementById(
            "total-matches"
        ).innerText =
            allJoinedMatches.length;


        document.getElementById(
            "total-entry"
        ).innerText =
            `৳${totalEntry}`;


        document.getElementById(
            "total-won"
        ).innerText =
            `৳${totalWon}`;


        const profitElement =
            document.getElementById(
                "total-profit"
            );


        profitElement.innerText =
            `৳${totalProfit}`;


        profitElement.className =
            "text-xl font-black mt-0.5 " +

            (
                totalProfit > 0

                    ? "profit-positive"

                    : totalProfit < 0

                        ? "profit-negative"

                        : "profit-zero"
            );


        document.getElementById(
            "profit-note"
        ).innerText =

            totalProfit > 0

                ? `তোমার মোট লাভ ৳${totalProfit}`

                : totalProfit < 0

                    ? `তোমার নেট ফলাফল ৳${totalProfit}`

                    : "Total Won − Total Entry";

    }


    /* =========================
       SHARE
    ========================= */

    window.shareProfit =
        async function() {

            const text =
                document.getElementById(
                    "total-profit"
                ).innerText;


            const shareText =
                `Aura Skill My Matches\n\n` +
                `Total Profit: ${text}\n` +
                `My tournament performance`;


            try {

                if (
                    navigator.share
                ) {

                    await navigator.share({

                        title:
                            "Aura Skill - My Matches",

                        text:
                            shareText

                    });

                    return;

                }


                await navigator.clipboard.writeText(
                    shareText
                );


                showToast(
                    "Profit summary কপি হয়েছে!"
                );

            } catch (e) {

                if (
                    e &&
                    e.name ===
                    "AbortError"
                )
                    return;


                showToast(
                    "Share করা যায়নি!",
                    "error"
                );

            }

        };


    /* =========================
       COPY
    ========================= */

    window.copyText =
        async function(text) {

            if (!text) {

                showToast(
                    "কপি করার মতো তথ্য নেই!",
                    "error"
                );

                return;

            }


            try {

                await navigator.clipboard.writeText(
                    text
                );


                showToast(
                    "কপি হয়েছে!"
                );

            } catch (e) {

                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.value =
                    text;


                document.body.appendChild(
                    textarea
                );


                textarea.select();


                document.execCommand(
                    "copy"
                );


                textarea.remove();


                showToast(
                    "কপি হয়েছে!"
                );

            }

        };


    /* =========================
       ESCAPE
    ========================= */

    function escapeHtml(value) {

        return String(
            value ?? ""
        )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeJs(value) {

        return String(
            value
        )

            .replace(
                /\\/g,
                "\\\\"
            )

            .replace(
                /'/g,
                "\\'"
            )

            .replace(
                /"/g,
                "&quot;"
            );

    }

</script>
