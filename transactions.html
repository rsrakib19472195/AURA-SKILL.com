<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aura Skill - Transactions History</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #050811;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 41, 59, 0.8);
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-left: 4px solid #3b82f6;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }

        .toast.success {
            border-left-color: #10b981;
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        .toast.warning {
            border-left-color: #f59e0b;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        .reason-box {
            animation: reasonIn 0.25s ease;
        }

        @keyframes reasonIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>


<body class="min-h-screen flex flex-col pb-24">


    <!-- TOAST -->

    <div id="toast-container"></div>


    <!-- HEADER -->

    <header
        class="px-4 py-3 flex items-center space-x-3 sticky top-0 z-30
               bg-[#050811]/90 backdrop-blur-md border-b border-slate-900">

        <a
            href="wallet.html"
            class="w-9 h-9 rounded-xl bg-slate-800/80
                   hover:bg-slate-800 text-slate-300
                   flex items-center justify-center text-sm transition">

            <i class="fa-solid fa-arrow-left"></i>

        </a>


        <h1 class="text-sm font-black text-white tracking-wide">
            Transaction History
        </h1>

    </header>


    <!-- MAIN -->

    <main class="max-w-md mx-auto px-4 py-6 w-full space-y-4">

        <div id="transactions-list" class="space-y-3">

            <p class="text-center text-slate-500 text-xs py-10">
                লোড হচ্ছে...
            </p>

        </div>

    </main>


    <!-- FIREBASE -->

    <script type="module">

        import { auth, db } from "./firebase.js";

        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        import {
            collection,
            query,
            where,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        /* =========================================================
           TOAST
        ========================================================= */

        window.showToast = function(message, type = 'success') {

            const container =
                document.getElementById('toast-container');

            if (!container) return;


            const toast =
                document.createElement('div');

            toast.className = `toast ${type}`;


            let iconClass =
                "fa-solid fa-circle-check text-emerald-400";


            if (type === 'error') {

                iconClass =
                    "fa-solid fa-circle-xmark text-red-400";

            }


            if (type === 'warning') {

                iconClass =
                    "fa-solid fa-triangle-exclamation text-amber-400";

            }


            toast.innerHTML = `
                <i class="${iconClass}"></i>
                <span>${escapeHtml(message)}</span>
            `;


            container.appendChild(toast);


            setTimeout(() => {

                toast.remove();

            }, 3000);

        };


        /* =========================================================
           ESCAPE HTML
        ========================================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return '';
            }


            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        /* =========================================================
           AUTH STATE
        ========================================================= */

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                showToast(
                    "দয়া করে লগইন করুন!",
                    "warning"
                );


                setTimeout(() => {

                    window.location.href =
                        'login.html';

                }, 1000);


                return;

            }


            await loadUserTransactions(user.uid);

        });


        /* =========================================================
           GET TIME
        ========================================================= */

        function getTimeValue(item) {

            if (!item) return 0;


            if (
                typeof item.timestamp === 'number'
            ) {

                return item.timestamp;

            }


            if (
                typeof item.createdAt === 'number'
            ) {

                return item.createdAt;

            }


            if (
                item.timestamp &&
                typeof item.timestamp.toMillis === 'function'
            ) {

                return item.timestamp.toMillis();

            }


            if (
                item.createdAt &&
                typeof item.createdAt.toMillis === 'function'
            ) {

                return item.createdAt.toMillis();

            }


            if (
                item.timestamp &&
                item.timestamp.seconds
            ) {

                return Number(
                    item.timestamp.seconds
                ) * 1000;

            }


            if (
                item.createdAt &&
                item.createdAt.seconds
            ) {

                return Number(
                    item.createdAt.seconds
                ) * 1000;

            }


            return 0;

        }


        /* =========================================================
           DATE FORMAT
        ========================================================= */

        function formatDate(item) {

            const time =
                getTimeValue(item);


            if (!time) return '';


            try {

                return new Date(time)
                    .toLocaleString('bn-BD');

            } catch {

                return '';

            }

        }


        /* =========================================================
           NORMALIZE STATUS
        ========================================================= */

        function normalizeStatus(status) {

            return String(
                status || 'pending'
            )
            .trim()
            .toLowerCase();

        }


        /* =========================================================
           GET REJECT REASON

           Firestore supports:

           reviewReason
           rejectReason
           rejectionReason
           reject_reason
           reason

        ========================================================= */

        function getRejectReason(tx) {

            if (!tx) return '';


            const reason =
                tx.reviewReason ||
                tx.rejectReason ||
                tx.rejectionReason ||
                tx.reject_reason ||
                tx.reason ||
                '';


            return String(reason).trim();

        }


        /* =========================================================
           REJECT REASON BOX
        ========================================================= */

        function getRejectReasonHtml(tx) {

            const status =
                normalizeStatus(tx.status);


            const rejected =
                status === 'rejected' ||
                status === 'reject' ||
                status === 'failed' ||
                status === 'declined';


            if (!rejected) {

                return '';

            }


            const reason =
                getRejectReason(tx) ||
                'কোনো কারণ দেওয়া হয়নি';


            return `

                <div
                    class="reason-box mt-2.5 p-2.5 rounded-xl
                           bg-rose-500/10
                           border border-rose-500/20">

                    <div class="flex items-center gap-1.5">

                        <i
                            class="fa-solid fa-circle-exclamation
                                   text-rose-400 text-[9px]">
                        </i>


                        <p
                            class="text-[9px]
                                   text-rose-300
                                   font-bold">

                            Reject Reason

                        </p>

                    </div>


                    <p
                        class="text-[10px]
                               text-slate-300
                               mt-1
                               leading-relaxed
                               break-words">

                        ${escapeHtml(reason)}

                    </p>

                </div>

            `;

        }


        /* =========================================================
           LOAD TRANSACTIONS
        ========================================================= */

        async function loadUserTransactions(uid) {

            const listEl =
                document.getElementById(
                    'transactions-list'
                );


            try {

                /* ================================
                   DEPOSIT
                ================================= */

                const qTx = query(
                    collection(
                        db,
                        "transactions"
                    ),

                    where(
                        "userId",
                        "==",
                        uid
                    )
                );


                /* ================================
                   WITHDRAW
                ================================= */

                const qWd = query(
                    collection(
                        db,
                        "withdraws"
                    ),

                    where(
                        "uid",
                        "==",
                        uid
                    )
                );


                /* ================================
                   REFERRAL
                ================================= */

                const qRef = query(
                    collection(
                        db,
                        "referralHistory"
                    ),

                    where(
                        "referrerUid",
                        "==",
                        uid
                    )
                );


                /* ================================
                   PARALLEL LOAD
                ================================= */

                const [
                    snapTx,
                    snapWd,
                    snapRef
                ] = await Promise.all([

                    getDocs(qTx),

                    getDocs(qWd),

                    getDocs(qRef)

                ]);


                listEl.innerHTML = '';


                let docs = [];


                /* =================================================
                   DEPOSIT RECORDS
                ================================================= */

                snapTx.forEach(docSnap => {

                    docs.push({

                        id: docSnap.id,

                        source: 'deposit',

                        ...docSnap.data()

                    });

                });


                /* =================================================
                   WITHDRAW RECORDS
                ================================================= */

                snapWd.forEach(docSnap => {

                    docs.push({

                        id: docSnap.id,

                        source: 'withdraw',

                        ...docSnap.data()

                    });

                });


                /* =================================================
                   REFERRAL RECORDS
                ================================================= */

                snapRef.forEach(docSnap => {

                    const data =
                        docSnap.data() || {};


                    docs.push({

                        id: docSnap.id,

                        source: 'referral',

                        amount:
                            Number(
                                data.rewardAmount ||
                                10
                            ),

                        status:
                            data.status ||
                            'paid',

                        referredUsername:
                            data.referredUsername ||
                            data.referredEmail ||
                            'User',

                        createdAt:
                            data.createdAt,

                        timestamp:
                            typeof data.createdAt === 'number'
                                ? data.createdAt
                                : undefined,

                        ...data

                    });

                });


                /* =================================================
                   EMPTY
                ================================================= */

                if (docs.length === 0) {

                    listEl.innerHTML = `

                        <div
                            class="glass-card p-6
                                   rounded-2xl
                                   text-center
                                   text-slate-400
                                   text-xs">

                            কোনো ট্রানজেকশন পাওয়া যায়নি!

                        </div>

                    `;

                    return;

                }


                /* =================================================
                   SORT
                ================================================= */

                docs.sort(
                    (a, b) =>
                        getTimeValue(b) -
                        getTimeValue(a)
                );


                /* =================================================
                   RENDER
                ================================================= */

                docs.forEach(tx => {


                    /* =================================================
                       REFERRAL
                    ================================================= */

                    if (
                        tx.source === 'referral'
                    ) {

                        listEl.innerHTML += `

                            <div
                                class="glass-card p-4
                                       rounded-2xl
                                       flex items-center
                                       justify-between
                                       border
                                       border-emerald-500/20
                                       shadow-lg">

                                <div class="space-y-1">

                                    <div
                                        class="flex
                                               items-center
                                               space-x-2">

                                        <span
                                            class="w-7 h-7
                                                   rounded-lg
                                                   bg-emerald-600/20
                                                   text-emerald-400
                                                   flex items-center
                                                   justify-center
                                                   text-xs">

                                            <i
                                                class="fa-solid fa-gift">
                                            </i>

                                        </span>


                                        <h4
                                            class="text-xs
                                                   font-bold
                                                   text-white">

                                            Refer Earn

                                        </h4>

                                    </div>


                                    <p
                                        class="text-[10px]
                                               text-slate-400">

                                        Refer থেকে পেয়েছেন

                                        <b
                                            class="text-emerald-400">

                                            ৳${Number(
                                                tx.rewardAmount ||
                                                tx.amount ||
                                                10
                                            )}

                                        </b>

                                    </p>


                                    <p
                                        class="text-[9px]
                                               text-slate-500">

                                        ${
                                            tx.referredUsername
                                                ? 'User: ' +
                                                  escapeHtml(
                                                      tx.referredUsername
                                                  ) +
                                                  ' • '
                                                : ''
                                        }

                                        ${formatDate(tx)}

                                    </p>

                                </div>


                                <div>

                                    <span
                                        class="text-[10px]
                                               font-bold
                                               px-2.5 py-1
                                               rounded-lg
                                               border
                                               text-emerald-400
                                               bg-emerald-500/10
                                               border-emerald-500/20">

                                        +৳${Number(
                                            tx.rewardAmount ||
                                            tx.amount ||
                                            10
                                        )}

                                    </span>

                                </div>

                            </div>

                        `;

                        return;

                    }


                    /* =================================================
                       STATUS
                    ================================================= */

                    const status =
                        normalizeStatus(
                            tx.status
                        );


                    let statusClass =
                        'text-amber-400 bg-amber-500/10 border-amber-500/20';


                    let statusText =
                        'Pending';


                    /* =================================================
                       SUCCESS
                    ================================================= */

                    if (
                        status === 'success' ||
                        status === 'approved' ||
                        status === 'completed' ||
                        status === 'complete' ||
                        status === 'paid'
                    ) {

                        statusClass =
                            'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';

                        statusText =
                            'Success';

                    }


                    /* =================================================
                       REJECTED
                    ================================================= */

                    else if (
                        status === 'rejected' ||
                        status === 'reject' ||
                        status === 'failed' ||
                        status === 'declined'
                    ) {

                        statusClass =
                            'text-rose-400 bg-rose-500/10 border-rose-500/20';

                        statusText =
                            'Rejected';

                    }


                    /* =================================================
                       TYPE LABEL
                    ================================================= */

                    const typeLabel =
                        tx.source === 'withdraw'

                            ? `Withdraw (${escapeHtml(
                                tx.method ||
                                'Bkash'
                            )})`

                            : escapeHtml(
                                tx.type ||
                                'Deposit'
                            );


                    /* =================================================
                       REJECT REASON
                    ================================================= */

                    const reasonHtml =
                        getRejectReasonHtml(tx);


                    /* =================================================
                       DATE
                    ================================================= */

                    const dateHtml =
                        getTimeValue(tx)

                            ? `
                                <p
                                    class="text-[9px]
                                           text-slate-600">

                                    ${formatDate(tx)}

                                </p>
                              `

                            : '';


                    /* =================================================
                       NUMBER / TRX
                    ================================================= */

                    const numberHtml =
                        tx.number
                            ? `
                                No:
                                ${escapeHtml(tx.number)}
                              `
                            : '';


                    const trxHtml =
                        tx.trxId
                            ? `
                                ${tx.number ? ' • ' : ''}
                                TrxID:
                                ${escapeHtml(tx.trxId)}
                              `
                            : '';


                    /* =================================================
                       FEE
                    ================================================= */

                    const feeHtml =
                        tx.source === 'withdraw' &&
                        tx.fee !== undefined

                            ? `
                                <p
                                    class="text-[9px]
                                           text-slate-500">

                                    Fee:

                                    <span
                                        class="text-amber-400">

                                        ৳${escapeHtml(tx.fee)}

                                    </span>

                                </p>
                              `

                            : '';


                    /* =================================================
                       RECEIVE AMOUNT
                    ================================================= */

                    const receiveHtml =
                        tx.source === 'withdraw' &&
                        tx.receiveAmount !== undefined

                            ? `
                                <p
                                    class="text-[9px]
                                           text-slate-500">

                                    Receive:

                                    <span
                                        class="text-emerald-400">

                                        ৳${escapeHtml(
                                            tx.receiveAmount
                                        )}

                                    </span>

                                </p>
                              `

                            : '';


                    /* =================================================
                       CARD
                    ================================================= */

                    listEl.innerHTML += `

                        <div
                            class="glass-card p-4
                                   rounded-2xl
                                   border
                                   border-slate-800
                                   shadow-lg">


                            <div
                                class="flex
                                       items-start
                                       justify-between
                                       gap-3">


                                <!-- LEFT -->

                                <div
                                    class="space-y-1
                                           min-w-0">


                                    <div
                                        class="flex
                                               items-center
                                               space-x-2">


                                        <span
                                            class="w-7 h-7
                                                   rounded-lg
                                                   bg-blue-600/20
                                                   text-blue-400
                                                   flex items-center
                                                   justify-center
                                                   text-xs
                                                   flex-shrink-0">

                                            <i
                                                class="fa-solid fa-wallet">
                                            </i>

                                        </span>


                                        <h4
                                            class="text-xs
                                                   font-bold
                                                   text-white">

                                            ${typeLabel}

                                        </h4>

                                    </div>


                                    <p
                                        class="text-[10px]
                                               text-slate-400">

                                        Amount:

                                        <b class="text-white">

                                            ৳${escapeHtml(
                                                tx.amount ?? 0
                                            )}

                                        </b>

                                    </p>


                                    <p
                                        class="text-[9px]
                                               text-slate-500
                                               break-words">

                                        ${numberHtml}

                                        ${trxHtml}

                                    </p>


                                    ${feeHtml}


                                    ${receiveHtml}


                                    ${dateHtml}


                                </div>


                                <!-- STATUS -->

                                <div
                                    class="flex-shrink-0">


                                    <span
                                        class="text-[10px]
                                               font-bold
                                               px-2.5 py-1
                                               rounded-lg
                                               border
                                               whitespace-nowrap
                                               ${statusClass}">

                                        ${escapeHtml(
                                            statusText
                                        )}

                                    </span>

                                </div>


                            </div>


                            <!-- REJECT REASON -->

                            ${reasonHtml}


                        </div>

                    `;

                });


            } catch (error) {

                console.error(
                    "Transaction history error:",
                    error
                );


                listEl.innerHTML = `

                    <div
                        class="glass-card p-6
                               rounded-2xl
                               text-center
                               text-rose-400
                               text-xs">

                        <i
                            class="fa-solid
                                   fa-circle-exclamation
                                   mb-2">
                        </i>


                        <p>
                            ট্রানজেকশন লোড করতে সমস্যা হয়েছে!
                        </p>

                    </div>

                `;

            }

        }

    </script>

</body>
</html>
