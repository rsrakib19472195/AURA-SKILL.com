<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Skill - Transactions History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #050811; color: #f8fafc; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.8); }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-left: 4px solid #3b82f6;
            color: #fff; padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }
        .toast.warning { border-left-color: #f59e0b; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <div id="toast-container"></div>

    <header class="px-4 py-3 flex items-center space-x-3 sticky top-0 z-30 bg-[#050811]/90 backdrop-blur-md border-b border-slate-900">
        <a href="wallet.html" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-300 flex items-center justify-center text-sm transition">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="text-sm font-black text-white tracking-wide">Transaction History</h1>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 w-full space-y-4">
        <div id="transactions-list" class="space-y-3">
            <p class="text-center text-slate-500 text-xs py-10">লোড হচ্ছে...</p>
        </div>
    </main>

    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            let iconClass = "fa-solid fa-circle-check text-emerald-400";
            if (type === 'error') iconClass = "fa-solid fa-circle-xmark text-red-400";
            if (type === 'warning') iconClass = "fa-solid fa-triangle-exclamation text-amber-400";

            toast.innerHTML = `<i class="${iconClass}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                showToast("দয়া করে লগইন করুন!", "warning");
                setTimeout(() => { window.location.href = 'login.html'; }, 1000);
            } else {
                loadUserTransactions(user.uid);
            }
        });

        function getTimeValue(item) {
            if (typeof item.timestamp === 'number') return item.timestamp;
            if (typeof item.createdAt === 'number') return item.createdAt;
            if (item.createdAt?.toMillis) return item.createdAt.toMillis();
            return 0;
        }

        function formatDate(item) {
            const t = getTimeValue(item);
            return t ? new Date(t).toLocaleString('bn-BD') : '';
        }

        async function loadUserTransactions(uid) {
            const listEl = document.getElementById('transactions-list');

            try {
                const qTx = query(collection(db, "transactions"), where("userId", "==", uid));
                const qWd = query(collection(db, "withdraws"), where("uid", "==", uid));
                const qRef = query(collection(db, "referralHistory"), where("referrerUid", "==", uid));

                const [snapTx, snapWd, snapRef] = await Promise.all([
                    getDocs(qTx),
                    getDocs(qWd),
                    getDocs(qRef)
                ]);

                listEl.innerHTML = "";
                let docs = [];

                snapTx.forEach(docSnap => {
                    docs.push({ id: docSnap.id, source: 'deposit', ...docSnap.data() });
                });

                snapWd.forEach(docSnap => {
                    docs.push({ id: docSnap.id, source: 'withdraw', ...docSnap.data() });
                });

                snapRef.forEach(docSnap => {
                    const data = docSnap.data() || {};
                    docs.push({
                        id: docSnap.id,
                        source: 'referral',
                        amount: Number(data.rewardAmount || 10),
                        status: data.status || 'paid',
                        referredUsername: data.referredUsername || data.referredEmail || 'User',
                        createdAt: data.createdAt,
                        timestamp: typeof data.createdAt === 'number' ? data.createdAt : undefined,
                        ...data
                    });
                });

                if (docs.length === 0) {
                    listEl.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-slate-400 text-xs">কোনো ট্রানজেকশন পাওয়া যায়নি!</div>`;
                    return;
                }

                docs.sort((a, b) => getTimeValue(b) - getTimeValue(a));

                docs.forEach(tx => {
                    if (tx.source === 'referral') {
                        listEl.innerHTML += `
                            <div class="glass-card p-4 rounded-2xl flex items-center justify-between border border-emerald-500/20 shadow-lg">
                                <div class="space-y-1">
                                    <div class="flex items-center space-x-2">
                                        <span class="w-7 h-7 rounded-lg bg-emerald-600/20 text-emerald-400 flex items-center justify-center text-xs">
                                            <i class="fa-solid fa-gift"></i>
                                        </span>
                                        <h4 class="text-xs font-bold text-white">Refer Earn</h4>
                                    </div>
                                    <p class="text-[10px] text-slate-400">
                                        Refer থেকে পেয়েছেন <b class="text-emerald-400">৳${Number(tx.rewardAmount || tx.amount || 10)}</b>
                                    </p>
                                    <p class="text-[9px] text-slate-500">
                                        ${tx.referredUsername ? 'User: ' + tx.referredUsername + ' • ' : ''}${formatDate(tx)}
                                    </p>
                                </div>
                                <div>
                                    <span class="text-[10px] font-bold px-2.5 py-1 rounded-lg border text-emerald-400 bg-emerald-500/10 border-emerald-500/20">
                                        +৳${Number(tx.rewardAmount || tx.amount || 10)}
                                    </span>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    let statusClass = 'text-amber-400 bg-amber-500/10 border-amber-500/20';
                    let typeLabel = tx.source === 'withdraw'
                        ? `Withdraw (${tx.method || 'Bkash'})`
                        : (tx.type || 'Deposit');
                    let statusText = tx.status || 'Pending';

                    if (statusText.toLowerCase() === 'success' || statusText.toLowerCase() === 'approved') {
                        statusClass = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
                        statusText = 'Success';
                    } else if (statusText.toLowerCase() === 'rejected') {
                        statusClass = 'text-rose-400 bg-rose-500/10 border-rose-500/20';
                        statusText = 'Rejected';
                    }

                    listEl.innerHTML += `
                        <div class="glass-card p-4 rounded-2xl flex items-center justify-between border border-slate-800 shadow-lg">
                            <div class="space-y-1">
                                <div class="flex items-center space-x-2">
                                    <span class="w-7 h-7 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center text-xs">
                                        <i class="fa-solid fa-wallet"></i>
                                    </span>
                                    <h4 class="text-xs font-bold text-white">${typeLabel}</h4>
                                </div>
                                <p class="text-[10px] text-slate-400">Amount: <b>৳${tx.amount}</b></p>
                                <p class="text-[9px] text-slate-500">${tx.number ? 'No: ' + tx.number : ''} ${tx.trxId ? 'TrxID: ' + tx.trxId : ''}</p>
                            </div>
                            <div>
                                <span class="text-[10px] font-bold px-2.5 py-1 rounded-lg border ${statusClass}">
                                    ${statusText}
                                </span>
                            </div>
                        </div>
                    `;
                });

            } catch (e) {
                console.error(e);
                listEl.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-rose-400 text-xs">ট্রানজেকশন লোড করতে সমস্যা হয়েছে!</div>`;
            }
        }
    </script>
</body>
</html>
