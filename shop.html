<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f1a">
  <title>AURA ARMAN SHOP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: #080c16;
    }

    body {
      margin: 0 auto;
      max-width: 480px;
      min-height: 100vh;
      background: #080c16;
      color: #f1f5f9;
      font-family: 'Hind Siliguri', sans-serif;
      padding-bottom: 76px;
    }

    .top-header {
      padding: 18px 16px;
      background: #0b0f1a;
      border-bottom: 1px solid #172033;
    }

    .brand {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .3px;
      color: #60a5fa;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: #94a3b8;
      font-size: 11px;
    }

    .shop-content {
      padding: 20px 16px 24px;
    }

    .shop-image-wrap {
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid #1e293b;
      background: #111827;
      cursor: pointer;
      position: relative;
    }

    .shop-image {
      display: block;
      width: 100%;
      height: auto;
      min-height: 100px;
      object-fit: contain;
    }

    .shop-image-wrap:active {
      transform: scale(.99);
    }

    .shop-message {
      text-align: center;
      margin-top: 16px;
      padding: 0 5px;
    }

    .shop-message p {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.8;
      font-weight: 500;
      color: #e2e8f0;
    }

    .shop-name {
      color: #60a5fa !important;
      font-weight: 700 !important;
      font-size: 14px !important;
      letter-spacing: .3px;
    }

    /* Wallet HTML-এর মতো ছোট navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(11, 15, 26, .97);
      backdrop-filter: blur(12px);
      border-top: 1px solid #172033;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, .18);
    }

    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      min-width: 44px;
    }

    .bottom-nav a i {
      font-size: 16px;
      line-height: 1;
    }

    .bottom-nav a.active {
      color: #60a5fa;
      font-weight: 700;
    }

    .bottom-nav a:active {
      opacity: .7;
    }

    /* Redirect screen */
    .redirect-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(5, 8, 16, .94);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .redirect-overlay.show {
      display: flex;
    }

    .redirect-box {
      width: 100%;
      max-width: 300px;
      text-align: center;
      padding: 26px 20px;
      background: #0b0f1a;
      border: 1px solid #1e293b;
      border-radius: 16px;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 3px solid #263449;
      border-top-color: #60a5fa;
      border-radius: 50%;
      margin: 0 auto 15px;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .redirect-title {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .redirect-description {
      margin: 0;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <header class="top-header">
    <h1 class="brand">AURA ARMAN SHOP</h1>
    <p class="brand-subtitle">Diamond Top-Up Store</p>
  </header>

  <main class="shop-content">
    <div
      class="shop-image-wrap"
      id="shopImageButton"
      role="link"
      tabindex="0"
      aria-label="AURA ARMAN SHOP খুলুন"
    >
      <img
        class="shop-image"
        src="shop.jpg"
        alt="AURA ARMAN SHOP"
      >
    </div>

    <section class="shop-message">
      <p>আমাদের থেকে ডায়মন্ড টপআপ করতে উপরের ছবিটিতে ক্লিক করুন</p>
      <p class="shop-name">আমাদের নিজেদের ওয়েবসাইট নাম: AURA ARMAN SHOP</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>

    <a href="shop.html" class="active" aria-current="page">
      <i class="fa-solid fa-store"></i>
      <span>SHOP</span>
    </a>

    <a href="wallet.html">
      <i class="fa-solid fa-wallet"></i>
      <span>Wallet</span>
    </a>

    <a href="profile.html">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </a>
  </nav>

  <div class="redirect-overlay" id="redirectOverlay" aria-live="polite">
    <div class="redirect-box">
      <div class="spinner"></div>
      <p class="redirect-title">Redirecting...</p>
      <p class="redirect-description">AURA ARMAN SHOP-এ নেওয়া হচ্ছে</p>
    </div>
  </div>

  <script>
    (() => {
      const imageButton = document.getElementById('shopImageButton');
      const overlay = document.getElementById('redirectOverlay');

      let redirecting = false;

      async function openShop() {
        if (redirecting) return;
        redirecting = true;
        overlay.classList.add('show');

        let destination = 'https://top-up.auraarmantour.shop';

        try {
          const response = await fetch('shop.txt', {
            cache: 'no-store'
          });

          if (response.ok) {
            const text = (await response.text()).trim();

            if (/^https?:\/\/\S+$/i.test(text)) {
              destination = text;
            }
          }
        } catch (error) {
          // shop.txt না পাওয়া গেলে ডিফল্ট লিংক ব্যবহার হবে।
        }

        setTimeout(() => {
          window.location.href = destination;
        }, 1000);
      }

      imageButton.addEventListener('click', openShop);

      imageButton.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openShop();
        }
      });
    })();
  </script>
</body>
</html>
