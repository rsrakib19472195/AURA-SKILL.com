<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referral History</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#050811] text-white min-h-screen"><main class="max-w-4xl mx-auto p-4"><h1 class="text-xl font-bold mb-4">Refer History</h1><div class="bg-[#0f172a] rounded-2xl border border-slate-800 overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-900"><tr><th class="p-3 text-left">Refer Code</th><th class="p-3 text-left">Referrer UID</th><th class="p-3 text-left">New Account</th><th class="p-3 text-left">Email</th><th class="p-3 text-left">Deposit</th><th class="p-3 text-left">Reward</th><th class="p-3 text-left">Date</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="p-6 text-center text-slate-400">Loading...</td></tr></tbody></table></div></main><script type="module">import {db} from './firebase.js';import {collection,getDocs,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const rows=document.getElementById('rows');try{const snap=await getDocs(query(collection(db,'referralHistory'),orderBy('createdAt','desc'),limit(500)));rows.innerHTML='';if(snap.empty){rows.innerHTML='<tr><td colspan="7" class="p-6 text-center text-slate-400">কোনো referral history নেই</td></tr>';}snap.forEach(d=>{const x=d.data()||{};const date=x.createdAt?.toDate?x.createdAt.toDate().toLocaleString('bn-BD'):(x.createdAt?new Date(x.createdAt).toLocaleString('bn-BD'):'-');rows.insertAdjacentHTML('beforeend',`<tr class="border-t border-slate-800"><td class="p-3 text-emerald-400 font-bold">${x.referrerCode||'-'}</td><td class="p-3">${x.referrerUid||'-'}</td><td class="p-3">${x.referredUsername||'-'}<br><span class="text-slate-500">${x.referredUid||''}</span></td><td class="p-3">${x.referredEmail||'-'}</td><td class="p-3">৳${Number(x.depositAmount||x.depositBalanceAtReward||0)}</td><td class="p-3 text-emerald-400 font-bold">৳${Number(x.rewardAmount||0)}</td><td class="p-3">${date}</td></tr>`)});}catch(e){console.error(e);rows.innerHTML='<tr><td colspan="7" class="p-6 text-center text-rose-400">Permission denied / data load failed</td></tr>'}</script></body></html>
