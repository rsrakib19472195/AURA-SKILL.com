
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .custom-input {
            background-color: #131b2e;
            border: 1px solid #1e293b;
            transition: all .2s ease;
        }

        .custom-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59,130,246,.08);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        .toast-slide-in {
            animation: slideIn .25s ease-in-out forwards;
        }

        .toast-slide-out {
            animation: slideOut .25s ease-in-out forwards;
        }

        .refer-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .refer-status.real { color: #34d399; }
        .refer-status.fake { color: #fb7185; }
        .refer-status.checking { color: #94a3b8; }

        .logo-glow {
            box-shadow: 0 0 20px rgba(59,130,246,.25),
                        0 0 50px rgba(59,130,246,.08);
        }

        .register-card {
            box-shadow: 0 25px 60px rgba(0,0,0,.45),
                        0 0 35px rgba(59,130,246,.04);
        }

        .submit-loading {
            pointer-events: none;
            opacity: .75;
        }

        .email-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .email-status.available { color: #34d399; }
        .email-status.used { color: #fb7185; }
        .email-status.checking { color: #94a3b8; }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen py-10 px-4 relative overflow-x-hidden">

<div id="toastContainer"
     class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none">
</div>

<div class="w-full max-w-md bg-[#0f172a] p-8 rounded-3xl border border-[#1e293b] register-card">

    <div class="flex flex-col items-center mb-6">
        <div class="w-20 h-20 rounded-full flex items-center justify-center p-1 logo-glow mb-3">
            <img
                src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
                alt="AURA ARMAN TOUR Logo"
                class="w-full h-full object-cover rounded-full"
            >
        </div>

        <h2 class="text-2xl font-bold text-white tracking-wide">
            Create an account
        </h2>

        <p class="text-slate-400 text-sm mt-1">
            Start your journey with us
        </p>
    </div>

    <form id="registerForm" class="space-y-4" novalidate>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Full Name
            </label>

            <div class="relative flex items-center">
                <span class="absolute left-4 text-slate-400">
                    <i class="fa-regular fa-user"></i>
                </span>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    maxlength="60"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Username (Unique)
            </label>

            <div class="relative flex items-center">
                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-at"></i>
                </span>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a unique username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    maxlength="30"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >
            </div>

            <div id="usernameStatus" class="text-xs mt-1.5 hidden"></div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Email Address
            </label>

            <div class="relative flex items-center">
                <span class="absolute left-4 text-slate-400">
                    <i class="fa-regular fa-envelope"></i>
                </span>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your Gmail address"
                    autocomplete="email"
                    autocapitalize="none"
                    spellcheck="false"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >
            </div>

            <div id="emailStatus" class="email-status hidden"></div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                WhatsApp Number (For Admin Contact)
            </label>

            <div class="relative flex items-center">
                <span class="absolute left-4 text-slate-400 text-xs font-bold bg-[#1e293b] px-2 py-1 rounded">
                    +88
                </span>

                <input
                    type="tel"
                    id="whatsapp"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="Enter WhatsApp number"
                    autocomplete="tel"
                    class="w-full pl-16 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Password
            </label>

            <div class="relative flex items-center">
                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    minlength="6"
                    class="w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >

                <button
                    type="button"
                    onclick="togglePassword('password','eye1')"
                    aria-label="Show password"
                    class="absolute right-4 text-slate-400"
                >
                    <i id="eye1" class="fa-regular fa-eye-slash"></i>
                </button>
            </div>

            <div id="passwordLengthStatus"
                 class="text-xs mt-1.5 font-medium text-slate-400">
                <i class="fa-solid fa-circle-info mr-1"></i>
                Password কমপক্ষে 6 characters হতে হবে
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Confirm Password
            </label>

            <div class="relative flex items-center">
                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    class="w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >

                <button
                    type="button"
                    onclick="togglePassword('confirmPassword','eye2')"
                    aria-label="Show confirm password"
                    class="absolute right-4 text-slate-400"
                >
                    <i id="eye2" class="fa-regular fa-eye-slash"></i>
                </button>
            </div>

            <div id="passwordStatus" class="text-xs mt-1.5 hidden"></div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Refer Code (Optional)
            </label>

            <div class="relative flex items-center">
                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-gift"></i>
                </span>

                <input
                    type="text"
                    id="referCode"
                    placeholder="Enter refer code if any"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="30"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >
            </div>

            <div id="referCodeStatus" class="refer-status hidden"></div>
        </div>

        <div class="flex items-center space-x-2 pt-1">
            <input
                type="checkbox"
                id="terms"
                checked
                class="w-4 h-4 rounded bg-[#131b2e] border-slate-700 text-blue-600 focus:ring-0 cursor-pointer"
            >

            <label for="terms" class="text-xs text-slate-400 cursor-pointer">
                I agree to
            </label>

            <a
                href="terms.html"
                target="_blank"
                rel="noopener noreferrer"
                class="text-xs text-blue-400 hover:text-blue-300 hover:underline font-semibold"
            >
                all Rules, Regulations and Policy
            </a>
        </div>

        <button
            type="submit"
            id="submitBtn"
            class="w-full py-3.5 mt-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition shadow-lg shadow-blue-600/30"
        >
            <i class="fa-solid fa-user-plus mr-2"></i>
            Register
        </button>
    </form>

    <p class="text-center text-xs text-slate-400 mt-6">
        Already have an account?
        <a href="login.html" class="text-blue-400 font-semibold hover:underline">
            Sign In
        </a>
    </p>
</div>

<script type="module">

import {
    auth,
    db,
    DEFAULT_PROFILE_PHOTO
} from "./firebase.js";

import {
    createUserWithEmailAndPassword,
    deleteUser
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    writeBatch,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


let usernameAvailable = false;
let usernameTimer = null;

let referCodeTimer = null;
let referCodeValid = true;

let emailAvailable = false;
let emailTimer = null;

const emailInput = document.getElementById("email");
const emailStatus = document.getElementById("emailStatus");

function normalizeEmail(value) {
    return String(value || "").trim().toLowerCase();
}

function normalizeGmail(value) {
    return String(value || "").trim().toLowerCase();
}

function isValidEmail(value) {
    return /^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(
        normalizeGmail(value)
    );
}

function setEmailStatus(message, type = "checking") {
    emailStatus.className = `email-status ${type}`;
    emailStatus.innerHTML = message || "";
    emailStatus.classList.toggle("hidden", !message);
}


/* EMAIL AVAILABILITY CHECK — OTP ছাড়া */
async function checkEmailAvailability(immediate = false) {
    const email = normalizeEmail(emailInput.value);

    clearTimeout(emailTimer);
    emailAvailable = false;

    if (!email) {
        setEmailStatus("");
        return false;
    }

    if (!isValidEmail(email)) {
        setEmailStatus(
            '<i class="fa-solid fa-circle-exclamation mr-1"></i> Only @gmail.com is allowed',
            "used"
        );
        return false;
    }

    setEmailStatus(
        '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Checking email...',
        "checking"
    );

    const runCheck = async () => {
        try {
            const q = query(
                collection(db, "users"),
                where("emailLower", "==", email)
            );

            const snap = await getDocs(q);

            if (normalizeEmail(emailInput.value) !== email) {
                return false;
            }

            if (!snap.empty) {
                emailAvailable = false;

                setEmailStatus(
                    '<i class="fa-solid fa-circle-xmark mr-1"></i> Email already registered',
                    "used"
                );

                return false;
            }

            emailAvailable = true;

            setEmailStatus(
                '<i class="fa-solid fa-circle-check mr-1"></i> Email available',
                "available"
            );

            return true;

        } catch (error) {
            console.error("Email availability check error:", error);
            emailAvailable = false;

            setEmailStatus(
                '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Email check করা যায়নি',
                "checking"
            );

            return false;
        }
    };

    if (immediate) {
        return await runCheck();
    }

    return await new Promise(resolve => {
        emailTimer = setTimeout(async () => {
            resolve(await runCheck());
        }, 450);
    });
}


window.showToast = function(message, type = "success") {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");

    let bg = "bg-emerald-600";
    let icon = "fa-circle-check";

    if (type === "error") {
        bg = "bg-rose-600";
        icon = "fa-circle-exclamation";
    }

    if (type === "warning") {
        bg = "bg-amber-600";
        icon = "fa-triangle-exclamation";
    }

    toast.className =
        `pointer-events-auto flex items-center space-x-3 ${bg} text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-medium toast-slide-in min-w-[260px] max-w-[calc(100vw-40px)]`;

    const iconElement = document.createElement("i");
    iconElement.className = `fa-solid ${icon}`;

    const messageElement = document.createElement("span");
    messageElement.textContent = message;

    toast.append(iconElement, messageElement);
    container.appendChild(toast);

    setTimeout(() => {
        toast.classList.remove("toast-slide-in");
        toast.classList.add("toast-slide-out");

        setTimeout(() => toast.remove(), 250);
    }, 3000);
};


window.togglePassword = function(fieldId, iconId) {
    const field = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);

    if (field.type === "password") {
        field.type = "text";
        icon.className = "fa-regular fa-eye";
    } else {
        field.type = "password";
        icon.className = "fa-regular fa-eye-slash";
    }
};


const usernameInput = document.getElementById("username");
const usernameStatus = document.getElementById("usernameStatus");

usernameInput.addEventListener("keydown", event => {
    if (/\s/.test(event.key)) {
        event.preventDefault();

        showToast(
            "Username-এ space দেওয়া যাবে না",
            "warning"
        );
    }
});

usernameInput.addEventListener("input", () => {
    const hadSpace = /\s/.test(usernameInput.value);

    if (hadSpace) {
        usernameInput.value = usernameInput.value.replace(/\s+/g, "");

        showToast(
            "Username-এ space দেওয়া যাবে না",
            "warning"
        );
    }

    clearTimeout(usernameTimer);

    const username = usernameInput.value.trim().toLowerCase();
    usernameAvailable = false;

    if (!username) {
        usernameStatus.classList.add("hidden");
        return;
    }

    if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) {
        usernameStatus.classList.remove("hidden");
        usernameStatus.className = "text-xs mt-1.5 text-rose-400";
        usernameStatus.innerHTML =
            '<i class="fa-solid fa-circle-exclamation mr-1"></i> Username 3-30 characters হতে হবে';
        return;
    }

    usernameStatus.classList.remove("hidden");
    usernameStatus.className = "text-xs mt-1.5 text-slate-400";
    usernameStatus.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Checking...';

    usernameTimer = setTimeout(async () => {
        try {
            const q = query(
                collection(db, "users"),
                where("usernameLower", "==", username)
            );

            const snap = await getDocs(q);

            if (usernameInput.value.trim().toLowerCase() !== username) {
                return;
            }

            if (!snap.empty) {
                usernameAvailable = false;
                usernameStatus.className =
                    "text-xs mt-1.5 text-rose-500 font-medium";
                usernameStatus.innerHTML =
                    '<i class="fa-solid fa-circle-xmark mr-1"></i> Already taken!';
            } else {
                usernameAvailable = true;
                usernameStatus.className =
                    "text-xs mt-1.5 text-emerald-400 font-medium";
                usernameStatus.innerHTML =
                    '<i class="fa-solid fa-circle-check mr-1"></i> Available!';
            }

        } catch (error) {
            console.error("Username check error:", error);
            usernameAvailable = false;

            usernameStatus.className =
                "text-xs mt-1.5 text-amber-400";

            usernameStatus.innerHTML =
                '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Username check করা যায়নি।';
        }
    }, 400);
});


emailInput.addEventListener("input", () => {
    checkEmailAvailability();
});

emailInput.addEventListener("blur", () => {
    const email = normalizeEmail(emailInput.value);

    if (email && !isValidEmail(email)) {
        showToast(
            "সঠিক Gmail address দিন (example@gmail.com)",
            "warning"
        );
    }

    checkEmailAvailability();
});


const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const passwordStatus = document.getElementById("passwordStatus");

function checkPassword() {
    const password = passwordInput.value;
    const confirm = confirmPasswordInput.value;
    const passwordLengthStatus =
        document.getElementById("passwordLengthStatus");

    if (password.length >= 6) {
        passwordLengthStatus.className =
            "text-xs mt-1.5 font-medium text-emerald-400";

        passwordLengthStatus.innerHTML =
            `<i class="fa-solid fa-circle-check mr-1"></i> Password valid — ${password.length} characters`;

    } else if (password.length > 0) {
        const remaining = 6 - password.length;

        passwordLengthStatus.className =
            "text-xs mt-1.5 font-medium text-rose-400";

        passwordLengthStatus.innerHTML =
            `<i class="fa-solid fa-circle-xmark mr-1"></i> আরও ${remaining} character দিন (minimum 6)`;

    } else {
        passwordLengthStatus.className =
            "text-xs mt-1.5 font-medium text-slate-400";

        passwordLengthStatus.innerHTML =
            '<i class="fa-solid fa-circle-info mr-1"></i> Password কমপক্ষে 6 characters হতে হবে';
    }

    if (!confirm) {
        passwordStatus.classList.add("hidden");
        return;
    }

    passwordStatus.classList.remove("hidden");

    if (password === confirm) {
        passwordStatus.className =
            "text-xs mt-1.5 text-emerald-400 font-medium";

        passwordStatus.innerHTML =
            '<i class="fa-solid fa-circle-check mr-1"></i> Passwords match!';
    } else {
        passwordStatus.className =
            "text-xs mt-1.5 text-rose-500 font-medium";

        passwordStatus.innerHTML =
            '<i class="fa-solid fa-circle-xmark mr-1"></i> Passwords do not match!';
    }
}

passwordInput.addEventListener("input", checkPassword);
confirmPasswordInput.addEventListener("input", checkPassword);


const referCodeInput = document.getElementById("referCode");
const referCodeStatus = document.getElementById("referCodeStatus");

referCodeInput.addEventListener("input", () => {
    clearTimeout(referCodeTimer);

    const code = referCodeInput.value.trim().toUpperCase();
    referCodeValid = !code;

    if (!code) {
        referCodeStatus.classList.add("hidden");
        return;
    }

    referCodeStatus.classList.remove("hidden");
    referCodeStatus.className = "refer-status checking";
    referCodeStatus.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i><span>Checking refer code...</span>';

    referCodeTimer = setTimeout(async () => {
        try {
            const q = query(
                collection(db, "users"),
                where("referCode", "==", code)
            );

            const snap = await getDocs(q);

            if (referCodeInput.value.trim().toUpperCase() !== code) {
                return;
            }

            if (snap.empty) {
                referCodeValid = false;
                referCodeStatus.className = "refer-status fake";
                referCodeStatus.innerHTML =
                    '<i class="fa-solid fa-circle-xmark"></i><span>Fake / Invalid refer code</span>';
            } else {
                referCodeValid = true;
                referCodeStatus.className = "refer-status real";
                referCodeStatus.innerHTML =
                    '<i class="fa-solid fa-circle-check"></i><span>Real refer code</span>';
            }

        } catch (error) {
            console.error("Refer code check:", error);
            referCodeValid = false;

            referCodeStatus.className = "refer-status checking";
            referCodeStatus.innerHTML =
                '<i class="fa-solid fa-triangle-exclamation"></i><span>Refer code check করা যায়নি</span>';
        }
    }, 350);
});


function generateReferCode(username) {
    const cleanUsername = username
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .slice(0, 8);

    const random = Math.random()
        .toString(36)
        .slice(2, 7)
        .toUpperCase();

    return `PT-${cleanUsername}-${random}`;
}


function setButtonLoading(loading) {
    const button = document.getElementById("submitBtn");

    if (loading) {
        button.disabled = true;
        button.classList.add("submit-loading");

        button.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Creating account...';
    } else {
        button.disabled = false;
        button.classList.remove("submit-loading");

        button.innerHTML =
            '<i class="fa-solid fa-user-plus mr-2"></i> Register';
    }
}


async function getReferrer(code, currentUid) {
    if (!code) {
        return { uid: "", code: "" };
    }

    const q = query(
        collection(db, "users"),
        where("referCode", "==", code)
    );

    const snap = await getDocs(q);

    if (snap.empty) {
        throw new Error("এই refer code পাওয়া যায়নি।");
    }

    const refDoc = snap.docs[0];

    if (refDoc.id === currentUid) {
        throw new Error("নিজের refer code ব্যবহার করা যাবে না।");
    }

    const data = refDoc.data() || {};

    return {
        uid: refDoc.id,
        code: String(data.referCode || code).toUpperCase()
    };
}


document.getElementById("registerForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (document.getElementById("submitBtn").disabled) {
        return;
    }

    const fullName = document.getElementById("fullName").value.trim();
    const username = usernameInput.value.trim();
    const usernameLower = username.toLowerCase();
    const email = normalizeGmail(emailInput.value);
    const whatsappInput = document.getElementById("whatsapp").value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;
    const enteredReferCode = referCodeInput.value.trim().toUpperCase();
    const terms = document.getElementById("terms").checked;

    if (!fullName) {
        showToast("Full Name দিন", "warning");
        document.getElementById("fullName").focus();
        return;
    }

    if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) {
        showToast("Valid username দিন", "warning");
        usernameInput.focus();
        return;
    }

    if (!email || !isValidEmail(email)) {
        showToast("সঠিক Gmail address দিন (example@gmail.com)", "warning");
        emailInput.focus();
        return;
    }

    /* OTP নেই — শুধু Gmail availability check */
    const available = await checkEmailAvailability(true);

    if (!available || !emailAvailable) {
        showToast("এই Email available নয় অথবা check করা যায়নি।", "error");
        emailInput.focus();
        return;
    }

    if (!/^(01)[0-9]{9}$/.test(whatsappInput)) {
        showToast("সঠিক 11 digit WhatsApp number দিন", "warning");
        document.getElementById("whatsapp").focus();
        return;
    }

    if (password.length < 6) {
        showToast("Password কমপক্ষে 6 characters হতে হবে", "warning");
        passwordInput.focus();
        return;
    }

    if (password !== confirmPassword) {
        showToast("Password match করছে না", "error");
        confirmPasswordInput.focus();
        return;
    }

    if (!terms) {
        showToast("Rules & Policy accept করুন", "warning");
        return;
    }

    if (enteredReferCode && !referCodeValid) {
        showToast("সঠিক Real refer code দিন", "error");
        referCodeInput.focus();
        return;
    }

    setButtonLoading(true);

    let createdUser = null;
    let usernameReserved = false;
    let profileCreated = false;

    try {
        const usernameQuery = query(
            collection(db, "users"),
            where("usernameLower", "==", usernameLower)
        );

        const usernameSnap = await getDocs(usernameQuery);

        if (!usernameSnap.empty) {
            throw new Error("এই username ইতিমধ্যে ব্যবহার করা হয়েছে।");
        }

        const credential = await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        createdUser = credential.user;
        const uid = createdUser.uid;

        let referredByUid = "";
        let referredByCode = "";

        if (enteredReferCode) {
            const referrer = await getReferrer(enteredReferCode, uid);
            referredByUid = referrer.uid;
            referredByCode = referrer.code;
        }

        const ownReferCode = generateReferCode(username);

        const usernameRef = doc(db, "usernames", usernameLower);

        await runTransaction(db, async transaction => {
            const usernameDoc = await transaction.get(usernameRef);

            if (usernameDoc.exists()) {
                throw new Error("এই username ইতিমধ্যে ব্যবহার করা হয়েছে।");
            }

            transaction.set(usernameRef, {
                uid,
                username,
                email,
                createdAt: serverTimestamp()
            });
        });

        usernameReserved = true;

        const userData = {
            uid,
            name: fullName,
            fullName,
            username,
            usernameLower,
            email,
            emailLower: email,

            whatsapp: "+88" + whatsappInput,
            whatsappNumber: "+88" + whatsappInput,
            phone: "+88" + whatsappInput,

            referCode: ownReferCode,
            referredByUid,
            referredByCode,

            referralCount: 0,
            successfulReferrals: 0,
            referralBonusTotal: 0,
            referralRewardPaid: false,
            referralRewardAmount: 0,

            photoURL: DEFAULT_PROFILE_PHOTO,

            balance: 0,
            winnings: 0,
            matchesPlayed: 0,
            matchesWon: 0,
            matchesLost: 0,
            totalEarnings: 0,

            status: "active",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        };

        const userRef = doc(db, "users", uid);
        const profileBatch = writeBatch(db);

        profileBatch.set(userRef, userData);
        await profileBatch.commit();
        profileCreated = true;

        if (referredByUid) {
            try {
                const referrerRef = doc(db, "users", referredByUid);

                await runTransaction(db, async transaction => {
                    const refSnap = await transaction.get(referrerRef);

                    if (!refSnap.exists()) {
                        return;
                    }

                    const refData = refSnap.data() || {};
                    const currentCount = Number(refData.referralCount || 0);

                    transaction.update(referrerRef, {
                        referralCount: currentCount + 1,
                        updatedAt: serverTimestamp()
                    });
                });

            } catch (referralUpdateError) {
                console.warn("Referral count update failed:", referralUpdateError);
            }
        }

        showToast("রেজিস্ট্রেশন সফল হয়েছে! এখন Login করুন 🎉", "success");

        setTimeout(() => {
            window.location.replace("login.html");
        }, 1000);

    } catch (error) {
        console.error("Registration Error:", error);

        if (usernameReserved && createdUser) {
            try {
                const usernameRef = doc(db, "usernames", usernameLower);

                await runTransaction(db, async transaction => {
                    const snap = await transaction.get(usernameRef);

                    if (snap.exists() && snap.data().uid === createdUser.uid) {
                        transaction.delete(usernameRef);
                    }
                });
            } catch (rollbackError) {
                console.warn("Username rollback failed:", rollbackError);
            }
        }

        if (createdUser) {
            try {
                if (profileCreated) {
                    // Profile save হয়ে গেলে সেটিও rollback করার চেষ্টা।
                    const { deleteDoc } = await import(
                        "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
                    );

                    await deleteDoc(doc(db, "users", createdUser.uid));
                }

                await deleteUser(createdUser);

            } catch (deleteError) {
                console.warn("Registration rollback failed:", deleteError);
            }
        }

        let message = "Registration করতে সমস্যা হয়েছে.";

        if (error.code === "auth/email-already-in-use") {
            message = "এই Email দিয়ে account already আছে!";
        } else if (error.code === "auth/invalid-email") {
            message = "সঠিক Email address দিন!";
        } else if (error.code === "auth/weak-password") {
            message = "Password আরও শক্ত করুন!";
        } else if (error.code === "auth/network-request-failed") {
            message = "Internet connection check করুন এবং আবার চেষ্টা করুন.";
        } else if (
            error.code === "permission-denied" ||
            error.code === "PERMISSION_DENIED"
        ) {
            message = "Firebase permission সমস্যা. Firestore Rules check করুন.";
        } else if (error.message) {
            message = error.message;
        }

        showToast(message, "error");
        setButtonLoading(false);
    }
});


document.getElementById("whatsapp").addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "").slice(0, 11);
});

usernameInput.addEventListener("blur", function() {
    this.value = this.value.trim().toLowerCase();
});

referCodeInput.addEventListener("blur", function() {
    this.value = this.value.trim().toUpperCase();
});

document.getElementById("terms").checked = true;

console.log("AURA ARMAN TOUR registration system ready — OTP disabled.");

</script>

</body>
</html>
