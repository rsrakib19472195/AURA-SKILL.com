<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .custom-input {
            background-color: #131b2e;
            border: 1px solid #1e293b;
            transition: all .2s ease;
        }

        .custom-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59,130,246,.08);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-slide-in {
            animation: slideIn .25s ease-in-out forwards;
        }

        .toast-slide-out {
            animation: slideOut .25s ease-in-out forwards;
        }

        .refer-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .refer-status.real {
            color: #34d399;
        }

        .refer-status.fake {
            color: #fb7185;
        }

        .refer-status.checking {
            color: #94a3b8;
        }

        .logo-glow {
            box-shadow:
                0 0 20px rgba(59,130,246,.25),
                0 0 50px rgba(59,130,246,.08);
        }

        .register-card {
            box-shadow:
                0 25px 60px rgba(0,0,0,.45),
                0 0 35px rgba(59,130,246,.04);
        }

        .submit-loading {
            pointer-events: none;
            opacity: .75;
        }

        .email-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .email-status.available {
            color: #34d399;
        }

        .email-status.used {
            color: #fb7185;
        }

        .email-status.checking {
            color: #94a3b8;
        }

        .email-status.verified {
            color: #34d399;
        }

        .otp-row {
            display: flex;
            gap: 8px;
        }

        .otp-row.otp-hidden {
            display: none;
        }

        .otp-row .otp-input-wrap {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        .otp-send-btn,
        .otp-resend-btn {
            flex: 0 0 auto;
            min-width: 104px;
            padding: 0 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            transition: all .2s ease;
        }

        .otp-send-btn {
            background: #2563eb;
            color: #fff;
        }

        .otp-send-btn:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .otp-send-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        .otp-send-btn.submit-loading {
            pointer-events: none;
            opacity: .8;
        }

        .otp-resend-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .otp-send-btn:disabled,
        .otp-resend-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .otp-message {
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .otp-message.success {
            color: #34d399;
        }

        .otp-message.error {
            color: #fb7185;
        }

        .otp-message.warning {
            color: #fbbf24;
        }

        .otp-message.info {
            color: #94a3b8;
        }

        #otpProcessingScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(
                    circle at top,
                    rgba(37,99,235,.20),
                    transparent 35%
                ),
                rgba(5,10,20,.97);
            backdrop-filter: blur(12px);
        }

        #otpProcessingScreen.show {
            display: flex;
        }

        .otp-processing-card {
            width: 100%;
            max-width: 390px;
            padding: 30px 24px;
            text-align: center;
            border-radius: 28px;
            background: rgba(15,23,42,.96);
            border: 1px solid #26344d;
            box-shadow:
                0 25px 80px rgba(0,0,0,.55),
                0 0 50px rgba(37,99,235,.10);
        }

        .processing-spinner {
            width: 68px;
            height: 68px;
            margin: 0 auto 22px;
            border-radius: 50%;
            border: 5px solid #1e293b;
            border-top-color: #3b82f6;
            border-right-color: #60a5fa;
            animation: otpSpin .8s linear infinite;
        }

        @keyframes otpSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .processing-error-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 22px;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(244,63,94,.12);
            color: #fb7185;
            font-size: 30px;
            border: 2px solid rgba(251,113,133,.35);
        }

        .processing-dots span {
            display: inline-block;
            animation: dotPulse 1.2s infinite;
        }

        .processing-dots span:nth-child(2) {
            animation-delay: .2s;
        }

        .processing-dots span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes dotPulse {
            0%,60%,100% {
                opacity: .25;
            }

            30% {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen py-10 px-4 relative overflow-x-hidden">

<div id="otpProcessingScreen">
    <div class="otp-processing-card">

        <div id="processingSpinner" class="processing-spinner"></div>

        <div id="processingErrorIcon" class="processing-error-icon">
            <i class="fa-solid fa-xmark"></i>
        </div>

        <h2 id="processingTitle"
            class="text-xl font-bold text-white mb-2">
            OTP পাঠানো হচ্ছে
        </h2>

        <p id="processingText"
           class="text-sm text-slate-400 leading-6">
            আপনার Gmail-এ verification OTP পাঠানো হচ্ছে।
        </p>

        <div id="processingDots"
             class="processing-dots text-blue-400 font-bold text-lg mt-3">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </div>

    </div>
</div>

<div id="toastContainer"
     class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none">
</div>

<div class="w-full max-w-md bg-[#0f172a] p-8 rounded-3xl border border-[#1e293b] register-card">

    <div class="flex flex-col items-center mb-6">

        <div class="w-20 h-20 rounded-full flex items-center justify-center p-1 logo-glow mb-3">

            <img
                src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
                alt="AURA ARMAN TOUR Logo"
                class="w-full h-full object-cover rounded-full"
            >

        </div>

        <h2 class="text-2xl font-bold text-white tracking-wide">
            Create an account
        </h2>

        <p class="text-slate-400 text-sm mt-1">
            Start your journey with us
        </p>

    </div>

    <form id="registerForm"
          class="space-y-4"
          novalidate>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Full Name
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-regular fa-user"></i>
                </span>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    maxlength="60"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >

            </div>

        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Username (Unique)
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-at"></i>
                </span>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a unique username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    maxlength="30"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >

            </div>

            <div id="usernameStatus"
                 class="text-xs mt-1.5 hidden">
            </div>

        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Email Address
            </label>

            <div class="otp-row">

                <div class="otp-input-wrap">

                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your Gmail address"
                        autocomplete="email"
                        autocapitalize="none"
                        spellcheck="false"
                        class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                    >

                </div>

                <button
                    type="button"
                    id="sendOtpBtn"
                    class="otp-send-btn"
                >
                    <i class="fa-solid fa-paper-plane mr-1"></i>
                    Send OTP
                </button>

            </div>

            <div id="emailStatus"
                 class="email-status hidden">
            </div>

            <div id="otpRow"
                 class="otp-row mt-2 otp-hidden">

                <div class="otp-input-wrap">

                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>

                    <input
                        type="text"
                        id="otp"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        placeholder="Enter 6-digit OTP"
                        class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                        disabled
                    >

                </div>

            </div>

            <div id="otpExpiryCountdown"
                 class="text-xs mt-1.5 font-semibold text-amber-400 hidden">
            </div>

            <div class="flex items-center justify-between gap-3">

                <div id="otpMessage"
                     class="otp-message info">
                </div>

                <button
                    type="button"
                    id="resendOtpBtn"
                    class="otp-resend-btn hidden"
                    disabled
                >
                    Resend OTP
                </button>

            </div>

        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                WhatsApp Number (For Admin Contact)
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400 text-xs font-bold bg-[#1e293b] px-2 py-1 rounded">
                    +88
                </span>

                <input
                    type="tel"
                    id="whatsapp"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="Enter WhatsApp number"
                    autocomplete="tel"
                    class="w-full pl-16 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >

            </div>

        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Password
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    minlength="6"
                    class="w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >

                <button
                    type="button"
                    onclick="togglePassword('password','eye1')"
                    aria-label="Show password"
                    class="absolute right-4 text-slate-400"
                >
                    <i id="eye1"
                       class="fa-regular fa-eye-slash">
                    </i>
                </button>

            </div>

            <div id="passwordLengthStatus"
                 class="text-xs mt-1.5 font-medium text-slate-400">
                <i class="fa-solid fa-circle-info mr-1"></i>
                Password কমপক্ষে 6 characters হতে হবে
            </div>

        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Confirm Password
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    class="w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >

                <button
                    type="button"
                    onclick="togglePassword('confirmPassword','eye2')"
                    aria-label="Show confirm password"
                    class="absolute right-4 text-slate-400"
                >
                    <i id="eye2"
                       class="fa-regular fa-eye-slash">
                    </i>
                </button>

            </div>

            <div id="passwordStatus"
                 class="text-xs mt-1.5 hidden">
            </div>

        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Refer Code (Optional)
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-gift"></i>
                </span>

                <input
                    type="text"
                    id="referCode"
                    placeholder="Enter refer code if any"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="30"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 custom-input"
                >

            </div>

            <div id="referCodeStatus"
                 class="refer-status hidden">
            </div>

        </div>

        <div class="flex items-center space-x-2 pt-1">

            <input
                type="checkbox"
                id="terms"
                checked
                class="w-4 h-4 rounded bg-[#131b2e] border-slate-700 text-blue-600 focus:ring-0 cursor-pointer"
            >

            <label
                for="terms"
                class="text-xs text-slate-400 cursor-pointer"
            >
                I agree to
            </label>

            <a
                href="terms.html"
                target="_blank"
                rel="noopener noreferrer"
                class="text-xs text-blue-400 hover:text-blue-300 hover:underline font-semibold"
            >
                all Rules, Regulations and Policy
            </a>

        </div>

        <button
            type="submit"
            id="submitBtn"
            class="w-full py-3.5 mt-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition shadow-lg shadow-blue-600/30"
        >
            <i class="fa-solid fa-user-plus mr-2"></i>
            Register
        </button>

    </form>

    <p class="text-center text-xs text-slate-400 mt-6">
        Already have an account?
        <a
            href="login.html"
            class="text-blue-400 font-semibold hover:underline"
        >
            Sign In
        </a>
    </p>

</div>

<script type="module">

import {
    auth,
    db,
    DEFAULT_PROFILE_PHOTO
} from "./firebase.js";

import {
    createUserWithEmailAndPassword,
    deleteUser
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    writeBatch,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


let usernameAvailable = false;
let usernameTimer = null;

let referCodeTimer = null;
let referCodeValid = true;

const OTP_API_URL =
"https://script.google.com/macros/s/AKfycbxcKFlQ7e3P2d5Dg_4gZHU5JXCDDBL71ZTlChGV7Fd5jwmDBslP_44Dg4S8QWeTZssjIw/exec";

const OTP_EXPIRY_MS = 5 * 60 * 1000;
const OTP_RESEND_MS = 30 * 1000;

let emailAvailable = false;
let emailVerified = false;
let emailTimer = null;

let currentOtp = "";
let otpExpiresAt = 0;
let otpSentAt = 0;
let otpUsed = false;

let otpResendTimer = null;
let otpExpiryTimer = null;
let otpCountdownTimer = null;

let otpSending = false;


const emailInput =
document.getElementById("email");

const emailStatus =
document.getElementById("emailStatus");

const otpInput =
document.getElementById("otp");

const otpRow =
document.getElementById("otpRow");

const otpExpiryCountdown =
document.getElementById("otpExpiryCountdown");

const sendOtpBtn =
document.getElementById("sendOtpBtn");

const resendOtpBtn =
document.getElementById("resendOtpBtn");

const otpMessage =
document.getElementById("otpMessage");

const otpProcessingScreen =
document.getElementById("otpProcessingScreen");

const processingSpinner =
document.getElementById("processingSpinner");

const processingErrorIcon =
document.getElementById("processingErrorIcon");

const processingTitle =
document.getElementById("processingTitle");

const processingText =
document.getElementById("processingText");

const processingDots =
document.getElementById("processingDots");


function restoreOtpButton() {

    sendOtpBtn.classList.remove(
        "submit-loading"
    );

    sendOtpBtn.innerHTML =
        `<i class="fa-solid fa-paper-plane mr-1"></i> Send OTP`;

    sendOtpBtn.disabled =
        !isValidEmail(
            normalizeEmail(
                emailInput.value
            )
        );
}


function setOtpButtonLoading(
    text = "Checking..."
) {

    sendOtpBtn.disabled = true;

    sendOtpBtn.classList.add(
        "submit-loading"
    );

    sendOtpBtn.innerHTML =
        `<i class="fa-solid fa-spinner fa-spin mr-1"></i> ${text}`;
}


function showOtpProcessing() {

    otpProcessingScreen.classList.add("show");

    processingSpinner.style.display = "block";

    processingErrorIcon.style.display = "none";

    processingTitle.textContent =
        "OTP পাঠানো হচ্ছে";

    processingText.innerHTML =
        "আপনার Gmail-এ verification OTP পাঠানো হচ্ছে." +
        "<br>" +
        "<span style=\"display:block;margin-top:8px;color:#fbbf24;font-size:12px;\">" +
        "📩 OTP না পেলে Gmail-এর <strong>Spam / Junk</strong> folder-টি চেক করুন।" +
        "</span>" +
        "<span style=\"display:block;margin-top:6px;color:#94a3b8;font-size:12px;\">" +
        "⚠️ OTP পাঠানো শেষ না হওয়া পর্যন্ত এই পেজ থেকে বের হবেন না।" +
        "</span>";

    processingDots.style.display = "block";
}


function hideOtpProcessing() {

    otpProcessingScreen.classList.remove("show");
}


function showOtpProcessingError() {

    processingSpinner.style.display = "none";

    processingErrorIcon.style.display = "flex";

    processingTitle.textContent =
        "OTP পাঠানো যায়নি";

    processingText.textContent =
        "OTP পাঠাতে সমস্যা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।";

    processingDots.style.display = "none";

    setTimeout(() => {
        otpProcessingScreen.classList.remove("show");
    }, 900);
}


function setEmailStatus(message, type = "checking") {

    emailStatus.className =
        `email-status ${type}`;

    emailStatus.innerHTML =
        message || "";

    emailStatus.classList.toggle(
        "hidden",
        !message
    );
}


function setOtpMessage(
    message = "",
    type = "info"
) {

    otpMessage.className =
        `otp-message ${type}`;

    otpMessage.textContent =
        message;
}


function normalizeEmail(value) {

    return String(value || "")
        .trim()
        .toLowerCase();
}


function normalizeGmail(value) {

    return String(value || "")
        .trim()
        .toLowerCase();
}


function isValidEmail(value) {

    const email =
        normalizeGmail(value);

    return /^[a-zA-Z0-9._%+-]+@gmail\.com$/i
        .test(email);
}


function generateOtp() {

    const array =
        new Uint32Array(1);

    crypto.getRandomValues(array);

    return String(
        100000 +
        (array[0] % 900000)
    );
}


function formatSeconds(ms) {

    return Math.max(
        0,
        Math.ceil(ms / 1000)
    );
}


function stopOtpTimers() {

    clearInterval(otpResendTimer);
    clearTimeout(otpExpiryTimer);
    clearInterval(otpCountdownTimer);

    otpResendTimer = null;
    otpExpiryTimer = null;
    otpCountdownTimer = null;
}


function resetOtpState(clearInput = true) {

    stopOtpTimers();

    currentOtp = "";
    otpExpiresAt = 0;
    otpSentAt = 0;
    otpUsed = false;
    emailVerified = false;

    if (clearInput) {
        otpInput.value = "";
    }

    otpInput.disabled = true;

    otpRow.classList.add("otp-hidden");

    otpExpiryCountdown.textContent = "";

    otpExpiryCountdown.className =
        "text-xs mt-1.5 font-semibold text-amber-400 hidden";

    if (!otpSending) {

        sendOtpBtn.classList.remove(
            "submit-loading"
        );

        sendOtpBtn.innerHTML =
            `<i class="fa-solid fa-paper-plane mr-1"></i> Send OTP`;

        sendOtpBtn.disabled =
            !isValidEmail(
                normalizeEmail(
                    emailInput.value
                )
            );
    }

    resendOtpBtn.classList.add("hidden");
    resendOtpBtn.disabled = true;

    setOtpMessage("");
}


function startOtpTimers() {

    const resendEndsAt =
        otpSentAt + OTP_RESEND_MS;

    const expiresAt =
        otpExpiresAt;

    clearInterval(otpResendTimer);
    clearTimeout(otpExpiryTimer);
    clearInterval(otpCountdownTimer);

    resendOtpBtn.classList.remove("hidden");

    resendOtpBtn.disabled = true;


    const updateResend = () => {

        const remaining =
            resendEndsAt - Date.now();

        if (remaining <= 0) {

            clearInterval(
                otpResendTimer
            );

            resendOtpBtn.disabled = false;

            resendOtpBtn.textContent =
                "Resend OTP";

            return;
        }

        resendOtpBtn.disabled = true;

        resendOtpBtn.textContent =
            `Resend (${formatSeconds(remaining)}s)`;
    };


    updateResend();

    otpResendTimer =
        setInterval(
            updateResend,
            250
        );


    /* LIVE OTP EXPIRY COUNTDOWN */
    otpExpiryCountdown.classList.remove("hidden");

    const updateOtpExpiry = () => {

        const remaining =
            expiresAt - Date.now();

        if (remaining <= 0) {

            otpExpiryCountdown.textContent =
                "OTP Expired — আবার Resend OTP চাপুন।";

            otpExpiryCountdown.className =
                "text-xs mt-1.5 font-semibold text-rose-400";

            clearInterval(
                otpCountdownTimer
            );

            otpCountdownTimer = null;

            return;
        }

        const totalSeconds =
            Math.ceil(
                remaining / 1000
            );

        const minutes =
            Math.floor(
                totalSeconds / 60
            );

        const seconds =
            totalSeconds % 60;

        otpExpiryCountdown.textContent =
            `OTP expires in ${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

        otpExpiryCountdown.className =
            "text-xs mt-1.5 font-semibold text-amber-400";
    };


    updateOtpExpiry();

    otpCountdownTimer =
        setInterval(
            updateOtpExpiry,
            250
        );


    otpExpiryTimer =
        setTimeout(() => {

            if (
                !emailVerified &&
                !otpUsed
            ) {

                currentOtp = "";

                otpExpiresAt = 0;

                otpInput.disabled = true;

                resendOtpBtn.disabled = false;

                resendOtpBtn.textContent =
                    "Resend OTP";

                otpExpiryCountdown.classList.remove(
                    "hidden"
                );

                otpExpiryCountdown.textContent =
                    "OTP Expired — আবার Resend OTP চাপুন।";

                otpExpiryCountdown.className =
                    "text-xs mt-1.5 font-semibold text-rose-400";

                clearInterval(
                    otpCountdownTimer
                );

                otpCountdownTimer = null;

                setOtpMessage(
                    "OTP expired. আবার Resend OTP চাপুন।",
                    "warning"
                );
            }

        }, Math.max(
            0,
            expiresAt - Date.now()
        ));
}


async function checkEmailAvailability(
    immediate = false
) {

    const email =
        normalizeEmail(
            emailInput.value
        );

    clearTimeout(emailTimer);

    emailAvailable = false;
    emailVerified = false;


    if (!otpSending) {

        sendOtpBtn.disabled =
            !isValidEmail(email);
    }


    if (!email) {

        setEmailStatus("");

        resetOtpState();

        return false;
    }


    if (!isValidEmail(email)) {

        setEmailStatus(
            '<i class="fa-solid fa-circle-exclamation mr-1"></i> Only @gmail.com is allowed',
            "used"
        );

        resetOtpState();

        return false;
    }


    setEmailStatus(
        '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Checking email...',
        "checking"
    );


    const runCheck = async () => {

        try {

            const q =
                query(
                    collection(db, "users"),
                    where(
                        "emailLower",
                        "==",
                        email
                    )
                );

            const snap =
                await getDocs(q);


            if (
                normalizeEmail(
                    emailInput.value
                ) !== email
            ) {
                return false;
            }


            if (!snap.empty) {

                emailAvailable = false;

                setEmailStatus(
                    '<i class="fa-solid fa-circle-xmark mr-1"></i> Email already registered',
                    "used"
                );

                resetOtpState();

                return false;
            }


            emailAvailable = true;

            setEmailStatus(
                '<i class="fa-solid fa-circle-check mr-1"></i> Email available',
                "available"
            );


            if (!otpSending) {
                sendOtpBtn.disabled = false;
            }

            return true;

        } catch (error) {

            console.error(
                "Email availability check error:",
                error
            );

            emailAvailable = false;


            if (!otpSending) {
                sendOtpBtn.disabled = true;
            }

            setEmailStatus(
                '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Email check করা যায়নি',
                "checking"
            );

            resetOtpState();

            return false;
        }
    };


    if (immediate) {
        return await runCheck();
    }


    return await new Promise(resolve => {

        emailTimer =
            setTimeout(
                async () => {

                    resolve(
                        await runCheck()
                    );

                },
                450
            );

    });
}

    const subject =

    const logoUrl =

    const htmlBody = `

    try {

                    },

                    }),

                }

        const raw =

function verifyOtp() {

    if (emailVerified) {
        return true;
    }


    const entered =
        otpInput.value.trim();


    if (
        !currentOtp ||
        !otpExpiresAt
    ) {

        setOtpMessage(
            "আগে Send OTP চাপুন।",
            "warning"
        );

        return false;
    }


    if (
        Date.now() >=
        otpExpiresAt
    ) {

        currentOtp = "";

        otpExpiresAt = 0;

        otpInput.disabled = true;

        resendOtpBtn.disabled = false;

        resendOtpBtn.textContent =
            "Resend OTP";

        otpExpiryCountdown.classList.remove(
            "hidden"
        );

        otpExpiryCountdown.textContent =
            "OTP Expired — আবার Resend OTP চাপুন।";

        otpExpiryCountdown.className =
            "text-xs mt-1.5 font-semibold text-rose-400";

        setOtpMessage(
            "OTP expired. আবার Resend OTP চাপুন।",
            "warning"
        );

        return false;
    }


    if (!/^\d{6}$/.test(entered)) {

        setOtpMessage(
            "6 digit OTP দিন।",
            "warning"
        );

        return false;
    }


    if (entered !== currentOtp) {

        setOtpMessage(
            "ভুল OTP। সঠিক OTP দিন।",
            "error"
        );

        otpInput.select();

        return false;
    }


    emailVerified = true;
    otpUsed = true;

    currentOtp = "";
    otpExpiresAt = 0;


    stopOtpTimers();


    otpInput.disabled = true;

    resendOtpBtn.classList.add(
        "hidden"
    );

    otpExpiryCountdown.classList.add(
        "hidden"
    );

    otpExpiryCountdown.textContent = "";


    setOtpMessage(
        "Email verified successfully.",
        "success"
    );


    setEmailStatus(
        '<i class="fa-solid fa-circle-check mr-1"></i> Email verified',
        "verified"
    );


    return true;
}

window.showToast =
function(message, type = "success") {

    const container =
        document.getElementById(
            "toastContainer"
        );


    const toast =
        document.createElement(
            "div"
        );


    let bg =
        "bg-emerald-600";

    let icon =
        "fa-circle-check";


    if (type === "error") {

        bg =
            "bg-rose-600";

        icon =
            "fa-circle-exclamation";
    }


    if (type === "warning") {

        bg =
            "bg-amber-600";

        icon =
            "fa-triangle-exclamation";
    }


    toast.className =
        `pointer-events-auto flex items-center space-x-3 ${bg} text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-medium toast-slide-in min-w-[260px] max-w-[calc(100vw-40px)]`;


    toast.innerHTML = `
        <i class="fa-solid ${icon}"></i>
        <span>${escapeHtml(message)}</span>
    `;


    container.appendChild(
        toast
    );


    setTimeout(() => {

        toast.classList.remove(
            "toast-slide-in"
        );

        toast.classList.add(
            "toast-slide-out"
        );


        setTimeout(
            () => toast.remove(),
            250
        );

    }, 3000);
};


function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}

        passwordInput.value;

    const confirm =
        confirmPasswordInput.value;

    const passwordLengthStatus =
        document.getElementById(
            "passwordLengthStatus"
        );


    if (
        password.length >= 6

            "text-xs mt-1.5 font-medium text-emerald-400";

        passwordLengthStatus.innerHTML =
            `<i class="fa-solid fa-circle-check mr-1"></i> Password valid — ${password.length} characters`;

        password.length > 0
    ) {

            6 - password.length;

        passwordLengthStatus.className =
            "text-xs mt-1.5 font-medium text-rose-400";

        passwordLengthStatus.innerHTML =
            `<i class="fa-solid fa-circle-xmark mr-1"></i> আরও ${remaining} character দিন (minimum 6)`;

        passwordStatus.classList.add(

        "hidden"

            `<i class="fa-solid fa-spinner fa-spin"></i><span>Checking refer code...</span>`;


        referCodeTimer =
            setTimeout(
                async () => {

                    try {

                        const q =
                            query(
                                collection(
                                    db,
                                    "users"
                                ),
                                where(
                                    "referCode",
                                    "==",
                                    code
                                )
                            );


                        const snap =
                            await getDocs(q);


                        if (
                            snap.empty
                        ) {

                            referCodeValid =
                                false;

                            referCodeStatus.className =
                                "refer-status fake";

                            referCodeStatus.innerHTML =
                                `<i class="fa-solid fa-circle-xmark"></i><span>Fake / Invalid refer code</span>`;

                        } else {

                            referCodeValid =
                                true;

                            referCodeStatus.className =
                                "refer-status real";

                            referCodeStatus.innerHTML =
                                `<i class="fa-solid fa-circle-check"></i><span>Real refer code</span>`;
                        }


                    } catch (error) {

                        console.error(
                            "Refer code check:",
                            error
                        );


                        referCodeValid =
                            false;

                        referCodeStatus.className =
                            "refer-status checking";

                        referCodeStatus.innerHTML =
                            `<i class="fa-solid fa-triangle-exclamation"></i><span>Refer code check করা যায়নি</span>`;
                    }

                },
                350
            );
    }
);


function generateReferCode(
    username
) {

    const cleanUsername =
        username
            .toUpperCase()
            .replace(
                /[^A-Z0-9]/g,
                ""
            )
            .slice(0, 8);


    const random =
        Math.random()
            .toString(36)
            .slice(2, 7)
            .toUpperCase();


    return `PT-${cleanUsername}-${random}`;
}


function setButtonLoading(
    loading
) {

    const button =
        document.getElementById(
            "submitBtn"
        );


    if (loading) {

        button.disabled = true;

        button.classList.add(
            "submit-loading"
        );

        button.innerHTML =
            `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Creating account...`;

    } else {

        button.disabled = false;

        button.classList.remove(
            "submit-loading"
        );

        button.innerHTML =
            `<i class="fa-solid fa-user-plus mr-2"></i> Register`;
    }
}


async function getReferrer(
    code,
    currentUid
) {

    if (!code) {
        return {
            uid: "",
            code: ""
        };
    }


    const q =
        query(
            collection(
                db,
                "users"
            ),
            where(
                "referCode",
                "==",
                code
            )
        );


    const snap =
        await getDocs(q);


    if (snap.empty) {

        throw new Error(
            "এই refer code পাওয়া যায়নি।"
        );
    }


    const refDoc =
        snap.docs[0];


    if (
        refDoc.id === currentUid
    ) {

        throw new Error(
            "নিজের refer code ব্যবহার করা যাবে না।"
        );
    }


    const data =
        refDoc.data() || {};


    return {

        uid: refDoc.id,

        code:
            String(
                data.referCode ||
                code
            ).toUpperCase()
    };
}


document
.getElementById("registerForm")
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        if (
            document.getElementById(
                "submitBtn"
            ).disabled
        ) {
            return;
        }


        const fullName =
            document
                .getElementById(
                    "fullName"
                )
                .value
                .trim();


        const username =
            document
                .getElementById(
                    "username"
                )
                .value
                .trim();


        const usernameLower =
            username.toLowerCase();


        const emailInputValue =
            document
                .getElementById(
                    "email"
                )
                .value;


        const email =
            normalizeGmail(
                emailInputValue
            );


        const whatsappInput =
            document
                .getElementById(
                    "whatsapp"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "password"
                )
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "confirmPassword"
                )
                .value;


        const enteredReferCode =
            document
                .getElementById(
                    "referCode"
                )
                .value
                .trim()
                .toUpperCase();


        const terms =
            document
                .getElementById(
                    "terms"
                )
                .checked;


        if (!fullName) {

            showToast(
                "Full Name দিন",
                "warning"
            );

            document
                .getElementById(
                    "fullName"
                )
                .focus();

            return;
        }


        if (
            !/^[a-zA-Z0-9._-]{3,30}$/
                .test(username)
        ) {

            showToast(
                "Valid username দিন",
                "warning"
            );

            usernameInput.focus();

            return;
        }


        if (!email) {

            showToast(
                "Gmail address দিন",
                "warning"
            );

            emailInput.focus();

            return;
        }


        if (!isValidEmail(email)) {

            showToast(
                "সঠিক Gmail address দিন (example@gmail.com)",
                "warning"
            );

            emailInput.focus();

            return;
        }


        if (!emailAvailable) {

            showToast(
                "এই Email available নয়।",
                "error"
            );

            emailInput.focus();

            return;
        }


        if (!emailVerified) {

            showToast(
                "Register করার আগে Email OTP verify করুন।",
                "warning"
            );

            otpInput.focus();

            return;
        }


        if (
            !/^(01)[0-9]{9}$/
                .test(whatsappInput)
        ) {

            showToast(
                "সঠিক 11 digit WhatsApp number দিন",
                "warning"
            );

            document
                .getElementById(
                    "whatsapp"
                )
                .focus();

            return;
        }


        if (
            password.length < 6
        ) {

            showToast(
                "Password কমপক্ষে 6 characters হতে হবে",
                "warning"
            );

            passwordInput.focus();

            return;
        }


        if (
            password !==
            confirmPassword
        ) {

            showToast(
                "Password match করছে না",
                "error"
            );

            confirmPasswordInput.focus();

            return;
        }


        if (!terms) {

            showToast(
                "Rules & Policy accept করুন",
                "warning"
            );

            return;
        }


        if (
            enteredReferCode &&
            !referCodeValid
        ) {

            showToast(
                "সঠিক Real refer code দিন",
                "error"
            );

            referCodeInput.focus();

            return;
        }


        setButtonLoading(true);


        let createdUser = null;

        let usernameReserved =
            false;


        try {

            const usernameQuery =
                query(
                    collection(
                        db,
                        "users"
                    ),
                    where(
                        "usernameLower",
                        "==",
                        usernameLower
                    )
                );


            const usernameSnap =
                await getDocs(
                    usernameQuery
                );


            if (
                !usernameSnap.empty
            ) {

                throw new Error(
                    "এই username ইতিমধ্যে ব্যবহার করা হয়েছে।"
                );
            }


            const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            createdUser =
                credential.user;


            const uid =
                createdUser.uid;


            let referredByUid = "";
            let referredByCode = "";


            if (enteredReferCode) {

                const referrer =
                    await getReferrer(
                        enteredReferCode,
                        uid
                    );


                referredByUid =
                    referrer.uid;

                referredByCode =
                    referrer.code;
            }


            const ownReferCode =
                generateReferCode(
                    username
                );


            const usernameRef =
                doc(
                    db,
                    "usernames",
                    usernameLower
                );


            await runTransaction(
                db,
                async transaction => {

                    const usernameDoc =
                        await transaction.get(
                            usernameRef
                        );


                    if (
                        usernameDoc.exists()
                    ) {

                        throw new Error(
                            "এই username ইতিমধ্যে ব্যবহার করা হয়েছে।"
                        );
                    }


                    transaction.set(
                        usernameRef,
                        {
                            uid,
                            username,
                            email,
                            createdAt:
                                serverTimestamp()
                        }
                    );
                }
            );


            usernameReserved =
                true;


            const userData = {

                uid,

                name:
                    fullName,

                fullName,

                username,

                usernameLower,

                email,

                emailLower:
                    email,

                whatsapp:
                    "+88" +
                    whatsappInput,

                whatsappNumber:
                    "+88" +
                    whatsappInput,

                phone:
                    "+88" +
                    whatsappInput,

                referCode:
                    ownReferCode,

                referredByUid,

                referredByCode,

                referralCount: 0,

                successfulReferrals: 0,

                referralBonusTotal: 0,

                referralRewardPaid: false,

                referralRewardAmount: 0,

                photoURL:
                    DEFAULT_PROFILE_PHOTO,

                balance: 0,

                winnings: 0,

                matchesPlayed: 0,

                matchesWon: 0,

                matchesLost: 0,

                totalEarnings: 0,

                status:
                    "active",

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()
            };


            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            const profileBatch =
                writeBatch(db);


            profileBatch.set(
                userRef,
                userData
            );


            await profileBatch.commit();


            if (referredByUid) {

                try {

                    const referrerRef =
                        doc(
                            db,
                            "users",
                            referredByUid
                        );


                    await runTransaction(
                        db,
                        async transaction => {

                            const refSnap =
                                await transaction.get(
                                    referrerRef
                                );


                            if (
                                !refSnap.exists()
                            ) {
                                return;
                            }


                            const refData =
                                refSnap.data() ||
                                {};


                            const currentCount =
                                Number(
                                    refData.referralCount ||
                                    0
                                );


                            transaction.update(
                                referrerRef,
                                {
                                    referralCount:
                                        currentCount +
                                        1,

                                    updatedAt:
                                        serverTimestamp()
                                }
                            );
                        }
                    );


                } catch (
                    referralUpdateError
                ) {

                    console.warn(
                        "Referral count update failed:",
                        referralUpdateError
                    );
                }
            }


            showToast(
                "রেজিস্ট্রেশন সফল হয়েছে! এখন Login করুন 🎉",
                "success"
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "login.html"
                    );

                },
                1000
            );


        } catch (error) {

            console.error(
                "Registration Error:",
                error
            );


            if (
                usernameReserved &&
                createdUser
            ) {

                try {

                    const usernameRef =
                        doc(
                            db,
                            "usernames",
                            usernameLower
                        );


                    await runTransaction(
                        db,
                        async transaction => {

                            const snap =
                                await transaction.get(
                                    usernameRef
                                );


                            if (
                                snap.exists() &&
                                snap.data().uid ===
                                createdUser.uid
                            ) {

                                transaction.delete(
                                    usernameRef
                                );
                            }
                        }
                    );


                } catch (
                    rollbackError
                ) {

                    console.warn(
                        "Username rollback failed:",
                        rollbackError
                    );
                }
            }


            if (createdUser) {

                try {

                    await deleteUser(
                        createdUser
                    );

                } catch (
                    deleteError
                ) {

                    console.warn(
                        "Auth rollback failed:",
                        deleteError
                    );
                }
            }


            let message =
                "Registration করতে সমস্যা হয়েছে.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                message =
                    "এই Email দিয়ে account already আছে!";

            } else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "সঠিক Email address দিন!";

            } else if (
                error.code ===
                "auth/weak-password"
            ) {

                message =
                    "Password আরও শক্ত করুন!";

            } else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                message =
                    "Internet connection check করুন এবং আবার চেষ্টা করুন.";

            } else if (
                error.code ===
                    "permission-denied" ||
                error.code ===
                    "PERMISSION_DENIED"
            ) {

                message =
                    "Firebase permission সমস্যা. Firestore Rules check করুন.";

            } else if (
                error.message
            ) {

                message =
                    error.message;
            }


            showToast(
                message,
                "error"
            );


            setButtonLoading(
                false
            );
        }
    }
);

.getElementById("whatsapp")

                .replace(/\D/g, "")
                .slice(0, 11);

);

                .trim()
                .toLowerCase();
    }
);


referCodeInput.addEventListener(

        this.value =
            this.value
                .trim()
                .toUpperCase();
    }
);


document
.getElementById("terms")
.checked = true;


console.log(
    "AURA ARMAN TOUR registration system ready."
);
