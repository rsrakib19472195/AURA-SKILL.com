<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create an Account</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .custom-input {
            background-color: #131b2e;
            border: 1px solid #1e293b;
        }

        .custom-input:focus {
            border-color: #3b82f6;
            outline: none;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-slide-in {
            animation: slideIn 0.25s ease-in-out forwards;
        }

        .toast-slide-out {
            animation: slideOut 0.25s ease-in-out forwards;
        }

        .refer-status {
            display:flex;
            align-items:center;
            gap:6px;
            margin-top:6px;
            font-size:12px;
            font-weight:600;
        }
        .refer-status.real { color:#34d399; }
        .refer-status.fake { color:#fb7185; }
        .refer-status.checking { color:#94a3b8; }

    </style>
</head>

<body class="flex items-center justify-center min-h-screen py-10 px-4 relative overflow-x-hidden">

<div id="toastContainer"
     class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none">
</div>

<div class="w-full max-w-md bg-[#0f172a] p-8 rounded-3xl shadow-2xl border border-[#1e293b]">

    <div class="flex flex-col items-center mb-6">

        <div class="w-20 h-20 rounded-full flex items-center justify-center p-1
                    shadow-[0_0_20px_rgba(59,130,246,0.3)] mb-3">

            <img
                src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
                alt="Logo"
                class="w-full h-full object-cover rounded-full">
        </div>

        <h2 class="text-2xl font-bold text-white tracking-wide">
            Create an account
        </h2>

        <p class="text-slate-400 text-sm mt-1">
            Start your journey with us
        </p>
    </div>

    <form id="registerForm" class="space-y-4">

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Full Name
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-regular fa-user"></i>
                </span>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">
            </div>
        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Username (Unique)
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-at"></i>
                </span>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a unique username"
                    autocomplete="username"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">
            </div>

            <div id="usernameStatus"
                 class="text-xs mt-1.5 hidden">
            </div>
        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Email Address
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-regular fa-envelope"></i>
                </span>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">
            </div>
        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                WhatsApp Number (For Admin Contact)
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400 text-xs font-bold
                             bg-[#1e293b] px-2 py-1 rounded">
                    +88
                </span>

                <input
                    type="tel"
                    id="whatsapp"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="Enter WhatsApp number"
                    class="w-full pl-16 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">
            </div>
        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Password
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    class="w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">

                <button
                    type="button"
                    onclick="togglePassword('password','eye1')"
                    class="absolute right-4 text-slate-400">

                    <i id="eye1"
                       class="fa-regular fa-eye-slash">
                    </i>
                </button>
            </div>
        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Confirm Password
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    class="w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">

                <button
                    type="button"
                    onclick="togglePassword('confirmPassword','eye2')"
                    class="absolute right-4 text-slate-400">

                    <i id="eye2"
                       class="fa-regular fa-eye-slash">
                    </i>
                </button>
            </div>

            <div id="passwordStatus"
                 class="text-xs mt-1.5 hidden">
            </div>
        </div>

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Refer Code (Optional)
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-gift"></i>
                </span>

                <input
                    type="text"
                    id="referCode"
                    placeholder="Enter refer code if any"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">
                <div id="referCodeStatus" class="refer-status hidden"></div>
        </div>
        </div>

        <div class="flex items-center space-x-2 pt-1">

            <input
                type="checkbox"
                id="terms"
                class="w-4 h-4 rounded bg-[#131b2e] border-slate-700
                       text-blue-600 focus:ring-0 cursor-pointer">

            <label
                for="terms"
                class="text-xs text-slate-400 cursor-pointer">

                I agree to all Rules, Regulations and Policy

            </label>
        </div>

        <button
            type="submit"
            id="submitBtn"
            class="w-full py-3.5 mt-2 bg-blue-600 hover:bg-blue-700
                   text-white font-semibold rounded-xl transition
                   shadow-lg shadow-blue-600/30">

            Register

        </button>

    </form>

    <p class="text-center text-xs text-slate-400 mt-6">

        Already have an account?

        <a
            href="login.html"
            class="text-blue-400 font-semibold hover:underline">

            Sign In

        </a>

    </p>

</div>

<script type="module">

import {
    auth,
    db,
    DEFAULT_PROFILE_PHOTO
} from "./firebase.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    setDoc,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


let usernameAvailable = false;
let usernameTimer = null;


/* =========================================================
   TOAST
========================================================= */

window.showToast = function(message, type = "success") {

    const container =
        document.getElementById("toastContainer");

    const toast =
        document.createElement("div");

    let bg = "bg-emerald-600";
    let icon = "fa-circle-check";

    if (type === "error") {
        bg = "bg-rose-600";
        icon = "fa-circle-exclamation";
    }

    if (type === "warning") {
        bg = "bg-amber-600";
        icon = "fa-triangle-exclamation";
    }

    toast.className =
        `pointer-events-auto flex items-center space-x-3
         ${bg} text-white px-5 py-3 rounded-2xl shadow-xl
         text-sm font-medium toast-slide-in min-w-[260px]`;

    toast.innerHTML = `
        <i class="fa-solid ${icon}"></i>
        <span>${message}</span>
    `;

    container.appendChild(toast);

    setTimeout(() => {

        toast.classList.remove("toast-slide-in");
        toast.classList.add("toast-slide-out");

        setTimeout(() => toast.remove(), 250);

    }, 3000);
};


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

window.togglePassword = function(fieldId, iconId) {

    const field =
        document.getElementById(fieldId);

    const icon =
        document.getElementById(iconId);

    if (field.type === "password") {

        field.type = "text";

        icon.className =
            "fa-regular fa-eye";

    } else {

        field.type = "password";

        icon.className =
            "fa-regular fa-eye-slash";
    }
};


/* =========================================================
   USERNAME CHECK
========================================================= */

const usernameInput =
    document.getElementById("username");

const usernameStatus =
    document.getElementById("usernameStatus");


usernameInput.addEventListener("input", () => {

    clearTimeout(usernameTimer);

    const username =
        usernameInput.value
        .trim()
        .toLowerCase();

    usernameAvailable = false;

    if (!username) {

        usernameStatus.classList.add("hidden");

        return;
    }

    if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) {

        usernameStatus.classList.remove("hidden");

        usernameStatus.className =
            "text-xs mt-1.5 text-rose-400";

        usernameStatus.innerHTML =
            "Username 3-30 characters হতে হবে";

        return;
    }

    usernameStatus.classList.remove("hidden");

    usernameStatus.className =
        "text-xs mt-1.5 text-slate-400";

    usernameStatus.innerHTML =
        `<i class="fa-solid fa-spinner fa-spin mr-1"></i>
         Checking...`;

    usernameTimer = setTimeout(async () => {

        try {

            const q =
                query(
                    collection(db, "users"),
                    where("usernameLower", "==", username)
                );

            const snap =
                await getDocs(q);

            if (!snap.empty) {

                usernameAvailable = false;

                usernameStatus.className =
                    "text-xs mt-1.5 text-rose-500 font-medium";

                usernameStatus.innerHTML =
                    `<i class="fa-solid fa-circle-xmark mr-1"></i>
                     Already taken!`;

            } else {

                usernameAvailable = true;

                usernameStatus.className =
                    "text-xs mt-1.5 text-emerald-400 font-medium";

                usernameStatus.innerHTML =
                    `<i class="fa-solid fa-circle-check mr-1"></i>
                     Available!`;
            }

        } catch (error) {

            console.error(error);

            usernameAvailable = false;

            usernameStatus.className =
                "text-xs mt-1.5 text-amber-400";

            usernameStatus.innerText =
                "Username check করা যায়নি। আবার চেষ্টা করুন।";
        }

    }, 350);
});


/* =========================================================
   PASSWORD MATCH
========================================================= */

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const passwordStatus =
    document.getElementById("passwordStatus");


function checkPassword() {

    const password =
        passwordInput.value;

    const confirm =
        confirmPasswordInput.value;

    if (!confirm) {

        passwordStatus.classList.add("hidden");

        return;
    }

    passwordStatus.classList.remove("hidden");

    if (password === confirm) {

        passwordStatus.className =
            "text-xs mt-1.5 text-emerald-400 font-medium";

        passwordStatus.innerHTML =
            "✓ Passwords match!";

    } else {

        passwordStatus.className =
            "text-xs mt-1.5 text-rose-500 font-medium";

        passwordStatus.innerHTML =
            "✕ Passwords do not match!";
    }
}

passwordInput.addEventListener("input", checkPassword);
confirmPasswordInput.addEventListener("input", checkPassword);


/* =========================================================
   REFER CODE LIVE CHECK
========================================================= */

const referCodeInput = document.getElementById("referCode");
const referCodeStatus = document.getElementById("referCodeStatus");
let referCodeTimer = null;
let referCodeValid = true;

referCodeInput.addEventListener("input", () => {
    clearTimeout(referCodeTimer);

    const code = referCodeInput.value.trim().toUpperCase();
    referCodeValid = !code;

    if (!code) {
        referCodeStatus.classList.add("hidden");
        return;
    }

    referCodeStatus.classList.remove("hidden");
    referCodeStatus.className = "text-xs mt-1.5 text-slate-400";
    referCodeStatus.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Checking refer code...';

    referCodeTimer = setTimeout(async () => {
        try {
            const q = query(
                collection(db, "users"),
                where("referCode", "==", code)
            );
            const snap = await getDocs(q);

            if (snap.empty) {
                referCodeValid = false;
                referCodeStatus.className =
                    "text-xs mt-1.5 text-rose-500 font-medium";
                referCodeStatus.innerHTML =
                    '<i class="fa-solid fa-circle-xmark mr-1"></i> Fake / Invalid refer code';
            } else {
                referCodeValid = true;
                referCodeStatus.className =
                    "text-xs mt-1.5 text-emerald-400 font-medium";
                referCodeStatus.innerHTML =
                    '<i class="fa-solid fa-circle-check mr-1"></i> Real refer code';
            }
        } catch (error) {
            referCodeValid = false;
            referCodeStatus.className =
                "text-xs mt-1.5 text-amber-400";
            referCodeStatus.innerHTML =
                '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Refer code check করা যায়নি';
        }
    }, 300);
});


/* =========================================================
   REGISTER
========================================================= */

document
.getElementById("registerForm")
.addEventListener("submit", async (event) => {

    event.preventDefault();

    const fullName =
        document.getElementById("fullName")
        .value.trim();

    const username =
        document.getElementById("username")
        .value.trim();

    const usernameLower =
        username.toLowerCase();

    const email =
        document.getElementById("email")
        .value.trim()
        .toLowerCase();

    const whatsappInput =
        document.getElementById("whatsapp")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;

    const enteredReferCode =
        document.getElementById("referCode")
        .value.trim()
        .toUpperCase();

    const ownReferCode =
        "PT-" +
        username.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) +
        "-" +
        Math.random().toString(36).slice(2, 6).toUpperCase();

    const terms =
        document.getElementById("terms")
        .checked;

    const button =
        document.getElementById("submitBtn");


    if (!fullName) {
        showToast("Full Name দিন", "warning");
        return;
    }

    if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) {
        showToast("Valid username দিন", "warning");
        return;
    }

    if (!email) {
        showToast("Email দিন", "warning");
        return;
    }

    if (!whatsappInput) {
        showToast("WhatsApp number দিন", "warning");
        return;
    }

    if (!/^(01)[0-9]{9}$/.test(whatsappInput)) {
        showToast("সঠিক 11 digit WhatsApp number দিন", "warning");
        return;
    }

    if (password.length < 6) {
        showToast("Password কমপক্ষে 6 characters হতে হবে", "warning");
        return;
    }

    if (password !== confirmPassword) {
        showToast("Password match করছে না", "error");
        return;
    }

    if (!terms) {
        showToast("Rules & Policy accept করুন", "warning");
        return;
    }

    if (enteredReferCode && !referCodeValid) {
        showToast("সঠিক Real refer code দিন", "error");
        referCodeInput.focus();
        return;
    }

    button.disabled = true;

    button.innerHTML =
        `<i class="fa-solid fa-spinner fa-spin mr-2"></i>
         Creating account...`;


    try {

        /*
         * Final username check
         */

        const usernameQuery =
            query(
                collection(db, "users"),
                where("usernameLower", "==", usernameLower)
            );

        const usernameSnap =
            await getDocs(usernameQuery);

        if (!usernameSnap.empty) {

            throw new Error(
                "এই username ইতিমধ্যে ব্যবহার করা হয়েছে।"
            );
        }


        /*
         * Firebase Authentication
         */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        const user =
            credential.user;

        let referredByUid = "";
        let referredByCode = "";

        if (enteredReferCode) {
            try {
                const refQuery = query(
                    collection(db, "users"),
                    where("referCode", "==", enteredReferCode)
                );
                const refSnap = await getDocs(refQuery);
                if (!refSnap.empty && refSnap.docs[0].id !== user.uid) {
                    const refData = refSnap.docs[0].data() || {};
                    referredByUid = refSnap.docs[0].id;
                    referredByCode = String(refData.referCode || enteredReferCode).toUpperCase();
                }
            } catch (refError) {
                console.warn("Referral lookup failed:", refError);
            }
        }


        /*
         * Firestore user profile
         */

        const userData = {

            uid: user.uid,

            name: fullName,
            fullName: fullName,

            username: username,
            usernameLower: usernameLower,

            email: email,
            emailLower: email,

            whatsapp: "+88" + whatsappInput,
            whatsappNumber: "+88" + whatsappInput,
            phone: "+88" + whatsappInput,

            referCode: ownReferCode,
            referredByUid: referredByUid,
            referredByCode: referredByCode,

            referralCount: 0,
            successfulReferrals: 0,
            referralBonusTotal: 0,
            referralRewardPaid: false,
            referralRewardAmount: 0,

            photoURL: DEFAULT_PROFILE_PHOTO,

            balance: 0,
            winnings: 0,

            matchesPlayed: 0,
            matchesWon: 0,
            matchesLost: 0,

            totalEarnings: 0,

            status: "active",

            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        };


        /*
         * Save user
         */

        await setDoc(
            doc(db, "users", user.uid),
            userData
        );


        /*
         * Username index
         */

        await setDoc(
            doc(db, "usernames", usernameLower),
            {
                uid: user.uid,
                username: username,
                email: email,
                createdAt: serverTimestamp()
            }
        );


        showToast(
            "Registration Successful! আপনার Refer Code: " + ownReferCode,
            "success"
        );


        setTimeout(() => {

            window.location.replace("index.html");

        }, 900);


    } catch (error) {

        console.error(
            "Registration Error:",
            error
        );

        let message =
            "Registration করতে সমস্যা হয়েছে।";

        if (
            error.code ===
            "auth/email-already-in-use"
        ) {
            message =
                "এই Email দিয়ে account already আছে!";
        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {
            message =
                "সঠিক Email address দিন!";
        }

        else if (
            error.code ===
            "auth/weak-password"
        ) {
            message =
                "Password আরও শক্ত করুন!";
        }

        else if (error.message) {

            message =
                error.message;
        }

        showToast(
            message,
            "error"
        );

        button.disabled = false;

        button.innerText =
            "Register";
    }

});

</script>

</body>
</html>
