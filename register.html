<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create an Account</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .custom-input {
            background-color: #131b2e;
            border: 1px solid #1e293b;
            transition: all .2s ease;
        }

        .custom-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59,130,246,.08);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-slide-in {
            animation: slideIn 0.25s ease-in-out forwards;
        }

        .toast-slide-out {
            animation: slideOut 0.25s ease-in-out forwards;
        }

        .refer-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .refer-status.real {
            color: #34d399;
        }

        .refer-status.fake {
            color: #fb7185;
        }

        .refer-status.checking {
            color: #94a3b8;
        }

        .logo-glow {
            box-shadow:
                0 0 20px rgba(59,130,246,.25),
                0 0 50px rgba(59,130,246,.08);
        }

        .register-card {
            box-shadow:
                0 25px 60px rgba(0,0,0,.45),
                0 0 35px rgba(59,130,246,.04);
        }

        .submit-loading {
            pointer-events: none;
            opacity: .75;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen py-10 px-4 relative overflow-x-hidden">

<!-- =========================================================
     TOAST
========================================================= -->

<div id="toastContainer"
     class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none">
</div>


<!-- =========================================================
     REGISTER CARD
========================================================= -->

<div class="w-full max-w-md bg-[#0f172a] p-8 rounded-3xl
            border border-[#1e293b] register-card">

    <!-- LOGO -->

    <div class="flex flex-col items-center mb-6">

        <div class="w-20 h-20 rounded-full flex items-center justify-center p-1
                    logo-glow mb-3">

            <img
                src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
                alt="AURA ARMAN TOUR Logo"
                class="w-full h-full object-cover rounded-full">

        </div>

        <h2 class="text-2xl font-bold text-white tracking-wide">
            Create an account
        </h2>

        <p class="text-slate-400 text-sm mt-1">
            Start your journey with us
        </p>

    </div>


    <!-- =====================================================
         FORM
    ====================================================== -->

    <form id="registerForm" class="space-y-4" novalidate>


        <!-- FULL NAME -->

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Full Name
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-regular fa-user"></i>
                </span>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    maxlength="60"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">

            </div>

        </div>


        <!-- USERNAME -->

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Username (Unique)
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-at"></i>
                </span>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a unique username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    maxlength="30"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">

            </div>

            <div id="usernameStatus"
                 class="text-xs mt-1.5 hidden">
            </div>

        </div>


        <!-- EMAIL -->

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Email Address
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-regular fa-envelope"></i>
                </span>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    autocapitalize="none"
                    spellcheck="false"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">

            </div>

        </div>


        <!-- WHATSAPP -->

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                WhatsApp Number (For Admin Contact)
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400 text-xs font-bold
                             bg-[#1e293b] px-2 py-1 rounded">
                    +88
                </span>

                <input
                    type="tel"
                    id="whatsapp"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="Enter WhatsApp number"
                    autocomplete="tel"
                    class="w-full pl-16 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">

            </div>

        </div>


        <!-- PASSWORD -->

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Password
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    minlength="6"
                    class="w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">

                <button
                    type="button"
                    onclick="togglePassword('password','eye1')"
                    aria-label="Show password"
                    class="absolute right-4 text-slate-400">

                    <i id="eye1"
                       class="fa-regular fa-eye-slash">
                    </i>

                </button>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Confirm Password
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    class="w-full pl-11 pr-12 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">

                <button
                    type="button"
                    onclick="togglePassword('confirmPassword','eye2')"
                    aria-label="Show confirm password"
                    class="absolute right-4 text-slate-400">

                    <i id="eye2"
                       class="fa-regular fa-eye-slash">
                    </i>

                </button>

            </div>

            <div id="passwordStatus"
                 class="text-xs mt-1.5 hidden">
            </div>

        </div>


        <!-- REFER CODE -->

        <div>

            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">
                Refer Code (Optional)
            </label>

            <div class="relative flex items-center">

                <span class="absolute left-4 text-slate-400">
                    <i class="fa-solid fa-gift"></i>
                </span>

                <input
                    type="text"
                    id="referCode"
                    placeholder="Enter refer code if any"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="30"
                    class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-white
                           placeholder-slate-500 custom-input">

            </div>

            <div id="referCodeStatus"
                 class="refer-status hidden">
            </div>

        </div>


        <!-- TERMS -->

        <div class="flex items-center space-x-2 pt-1">

            <input
                type="checkbox"
                id="terms"
                class="w-4 h-4 rounded bg-[#131b2e] border-slate-700
                       text-blue-600 focus:ring-0 cursor-pointer">

            <label
                for="terms"
                class="text-xs text-slate-400 cursor-pointer">

                I agree to all Rules, Regulations and Policy

            </label>

        </div>


        <!-- REGISTER BUTTON -->

        <button
            type="submit"
            id="submitBtn"
            class="w-full py-3.5 mt-2 bg-blue-600 hover:bg-blue-700
                   text-white font-semibold rounded-xl transition
                   shadow-lg shadow-blue-600/30">

            <i class="fa-solid fa-user-plus mr-2"></i>
            Register

        </button>

    </form>


    <!-- LOGIN -->

    <p class="text-center text-xs text-slate-400 mt-6">

        Already have an account?

        <a
            href="login.html"
            class="text-blue-400 font-semibold hover:underline">

            Sign In

        </a>

    </p>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script type="module">

import {
    auth,
    db,
    DEFAULT_PROFILE_PHOTO
} from "./firebase.js";


import {
    createUserWithEmailAndPassword,
    deleteUser
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    doc,
    writeBatch,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   GLOBAL STATE
========================================================= */

let usernameAvailable = false;
let usernameTimer = null;

let referCodeTimer = null;
let referCodeValid = true;


/* =========================================================
   TOAST
========================================================= */

window.showToast = function(message, type = "success") {

    const container =
        document.getElementById("toastContainer");

    const toast =
        document.createElement("div");


    let bg = "bg-emerald-600";
    let icon = "fa-circle-check";


    if (type === "error") {

        bg = "bg-rose-600";
        icon = "fa-circle-exclamation";

    }


    if (type === "warning") {

        bg = "bg-amber-600";
        icon = "fa-triangle-exclamation";

    }


    toast.className =
        `pointer-events-auto flex items-center space-x-3
         ${bg} text-white px-5 py-3 rounded-2xl shadow-xl
         text-sm font-medium toast-slide-in min-w-[260px]
         max-w-[calc(100vw-40px)]`;


    toast.innerHTML = `
        <i class="fa-solid ${icon}"></i>
        <span>${escapeHtml(message)}</span>
    `;


    container.appendChild(toast);


    setTimeout(() => {

        toast.classList.remove("toast-slide-in");
        toast.classList.add("toast-slide-out");


        setTimeout(() => {

            toast.remove();

        }, 250);

    }, 3000);

};


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

window.togglePassword = function(fieldId, iconId) {

    const field =
        document.getElementById(fieldId);

    const icon =
        document.getElementById(iconId);


    if (field.type === "password") {

        field.type = "text";

        icon.className =
            "fa-regular fa-eye";

    } else {

        field.type = "password";

        icon.className =
            "fa-regular fa-eye-slash";

    }

};


/* =========================================================
   USERNAME ELEMENTS
========================================================= */

const usernameInput =
    document.getElementById("username");

const usernameStatus =
    document.getElementById("usernameStatus");


/* =========================================================
   USERNAME LIVE CHECK
========================================================= */

usernameInput.addEventListener("input", () => {

    clearTimeout(usernameTimer);

    const username =
        usernameInput.value
            .trim()
            .toLowerCase();


    usernameAvailable = false;


    if (!username) {

        usernameStatus.classList.add("hidden");

        return;

    }


    if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) {

        usernameStatus.classList.remove("hidden");

        usernameStatus.className =
            "text-xs mt-1.5 text-rose-400";

        usernameStatus.innerHTML =
            `<i class="fa-solid fa-circle-exclamation mr-1"></i>
             Username 3-30 characters হতে হবে`;

        return;

    }


    usernameStatus.classList.remove("hidden");

    usernameStatus.className =
        "text-xs mt-1.5 text-slate-400";

    usernameStatus.innerHTML =
        `<i class="fa-solid fa-spinner fa-spin mr-1"></i>
         Checking...`;


    usernameTimer = setTimeout(async () => {

        try {

            const q =
                query(
                    collection(db, "users"),
                    where("usernameLower", "==", username)
                );


            const snap =
                await getDocs(q);


            if (!snap.empty) {

                usernameAvailable = false;

                usernameStatus.className =
                    "text-xs mt-1.5 text-rose-500 font-medium";

                usernameStatus.innerHTML =
                    `<i class="fa-solid fa-circle-xmark mr-1"></i>
                     Already taken!`;

            } else {

                usernameAvailable = true;

                usernameStatus.className =
                    "text-xs mt-1.5 text-emerald-400 font-medium";

                usernameStatus.innerHTML =
                    `<i class="fa-solid fa-circle-check mr-1"></i>
                     Available!`;

            }

        } catch (error) {

            console.error(
                "Username check error:",
                error
            );

            usernameAvailable = false;

            usernameStatus.className =
                "text-xs mt-1.5 text-amber-400";

            usernameStatus.innerHTML =
                `<i class="fa-solid fa-triangle-exclamation mr-1"></i>
                 Username check করা যায়নি।`;

        }

    }, 400);

});


/* =========================================================
   PASSWORD MATCH
========================================================= */

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const passwordStatus =
    document.getElementById("passwordStatus");


function checkPassword() {

    const password =
        passwordInput.value;

    const confirm =
        confirmPasswordInput.value;


    if (!confirm) {

        passwordStatus.classList.add("hidden");

        return;

    }


    passwordStatus.classList.remove("hidden");


    if (password === confirm) {

        passwordStatus.className =
            "text-xs mt-1.5 text-emerald-400 font-medium";

        passwordStatus.innerHTML =
            `<i class="fa-solid fa-circle-check mr-1"></i>
             Passwords match!`;

    } else {

        passwordStatus.className =
            "text-xs mt-1.5 text-rose-500 font-medium";

        passwordStatus.innerHTML =
            `<i class="fa-solid fa-circle-xmark mr-1"></i>
             Passwords do not match!`;

    }

}


passwordInput.addEventListener(
    "input",
    checkPassword
);

confirmPasswordInput.addEventListener(
    "input",
    checkPassword
);


/* =========================================================
   REFER CODE LIVE CHECK
========================================================= */

const referCodeInput =
    document.getElementById("referCode");

const referCodeStatus =
    document.getElementById("referCodeStatus");


referCodeInput.addEventListener("input", () => {

    clearTimeout(referCodeTimer);


    const code =
        referCodeInput.value
            .trim()
            .toUpperCase();


    referCodeValid =
        !code;


    if (!code) {

        referCodeStatus.classList.add("hidden");

        return;

    }


    referCodeStatus.classList.remove("hidden");

    referCodeStatus.className =
        "refer-status checking";

    referCodeStatus.innerHTML =
        `<i class="fa-solid fa-spinner fa-spin"></i>
         <span>Checking refer code...</span>`;


    referCodeTimer = setTimeout(async () => {

        try {

            const q =
                query(
                    collection(db, "users"),
                    where("referCode", "==", code)
                );


            const snap =
                await getDocs(q);


            if (snap.empty) {

                referCodeValid = false;

                referCodeStatus.className =
                    "refer-status fake";

                referCodeStatus.innerHTML =
                    `<i class="fa-solid fa-circle-xmark"></i>
                     <span>Fake / Invalid refer code</span>`;

            } else {

                referCodeValid = true;

                referCodeStatus.className =
                    "refer-status real";

                referCodeStatus.innerHTML =
                    `<i class="fa-solid fa-circle-check"></i>
                     <span>Real refer code</span>`;

            }

        } catch (error) {

            console.error(
                "Refer code check:",
                error
            );

            referCodeValid = false;

            referCodeStatus.className =
                "refer-status checking";

            referCodeStatus.innerHTML =
                `<i class="fa-solid fa-triangle-exclamation"></i>
                 <span>Refer code check করা যায়নি</span>`;

        }

    }, 350);

});


/* =========================================================
   GENERATE UNIQUE REFER CODE
========================================================= */

function generateReferCode(username) {

    const cleanUsername =
        username
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "")
            .slice(0, 8);


    const random =
        Math.random()
            .toString(36)
            .slice(2, 7)
            .toUpperCase();


    return `PT-${cleanUsername}-${random}`;

}


/* =========================================================
   DISABLE / ENABLE BUTTON
========================================================= */

function setButtonLoading(loading) {

    const button =
        document.getElementById("submitBtn");


    if (loading) {

        button.disabled = true;

        button.classList.add(
            "submit-loading"
        );

        button.innerHTML =
            `<i class="fa-solid fa-spinner fa-spin mr-2"></i>
             Creating account...`;

    } else {

        button.disabled = false;

        button.classList.remove(
            "submit-loading"
        );

        button.innerHTML =
            `<i class="fa-solid fa-user-plus mr-2"></i>
             Register`;

    }

}


/* =========================================================
   GET REFERRER
========================================================= */

async function getReferrer(code, currentUid) {

    if (!code) {

        return {
            uid: "",
            code: ""
        };

    }


    const q =
        query(
            collection(db, "users"),
            where("referCode", "==", code)
        );


    const snap =
        await getDocs(q);


    if (snap.empty) {

        throw new Error(
            "এই refer code পাওয়া যায়নি।"
        );

    }


    const refDoc =
        snap.docs[0];


    if (refDoc.id === currentUid) {

        throw new Error(
            "নিজের refer code ব্যবহার করা যাবে না।"
        );

    }


    const data =
        refDoc.data() || {};


    return {

        uid: refDoc.id,

        code: String(
            data.referCode || code
        ).toUpperCase()

    };

}


/* =========================================================
   REGISTER FORM
========================================================= */

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            if (
                document.getElementById(
                    "submitBtn"
                ).disabled
            ) {

                return;

            }


            /* ---------------------------------------------
               GET VALUES
            --------------------------------------------- */

            const fullName =
                document.getElementById(
                    "fullName"
                ).value.trim();


            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const usernameLower =
                username.toLowerCase();


            const email =
                document.getElementById(
                    "email"
                ).value.trim().toLowerCase();


            const whatsappInput =
                document.getElementById(
                    "whatsapp"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            const enteredReferCode =
                document.getElementById(
                    "referCode"
                ).value.trim().toUpperCase();


            const terms =
                document.getElementById(
                    "terms"
                ).checked;


            /* ---------------------------------------------
               VALIDATION
            --------------------------------------------- */

            if (!fullName) {

                showToast(
                    "Full Name দিন",
                    "warning"
                );

                document
                    .getElementById("fullName")
                    .focus();

                return;

            }


            if (
                !/^[a-zA-Z0-9._-]{3,30}$/
                    .test(username)
            ) {

                showToast(
                    "Valid username দিন",
                    "warning"
                );

                usernameInput.focus();

                return;

            }


            if (!email) {

                showToast(
                    "Email দিন",
                    "warning"
                );

                document
                    .getElementById("email")
                    .focus();

                return;

            }


            if (
                !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                    .test(email)
            ) {

                showToast(
                    "সঠিক Email address দিন",
                    "warning"
                );

                return;

            }


            if (!/^(01)[0-9]{9}$/.test(
                whatsappInput
            )) {

                showToast(
                    "সঠিক 11 digit WhatsApp number দিন",
                    "warning"
                );

                document
                    .getElementById("whatsapp")
                    .focus();

                return;

            }


            if (password.length < 6) {

                showToast(
                    "Password কমপক্ষে 6 characters হতে হবে",
                    "warning"
                );

                passwordInput.focus();

                return;

            }


            if (password !== confirmPassword) {

                showToast(
                    "Password match করছে না",
                    "error"
                );

                confirmPasswordInput.focus();

                return;

            }


            if (!terms) {

                showToast(
                    "Rules & Policy accept করুন",
                    "warning"
                );

                return;

            }


            if (
                enteredReferCode &&
                !referCodeValid
            ) {

                showToast(
                    "সঠিক Real refer code দিন",
                    "error"
                );

                referCodeInput.focus();

                return;

            }


            setButtonLoading(true);


            /* ---------------------------------------------
               VARIABLES FOR ROLLBACK
            --------------------------------------------- */

            let createdUser = null;

            let usernameReserved = false;


            try {

                /* =========================================
                   FINAL USERNAME CHECK
                ========================================= */

                const usernameQuery =
                    query(
                        collection(db, "users"),
                        where(
                            "usernameLower",
                            "==",
                            usernameLower
                        )
                    );


                const usernameSnap =
                    await getDocs(
                        usernameQuery
                    );


                if (!usernameSnap.empty) {

                    throw new Error(
                        "এই username ইতিমধ্যে ব্যবহার করা হয়েছে।"
                    );

                }


                /* =========================================
                   FIREBASE AUTH ACCOUNT
                ========================================= */

                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                createdUser =
                    credential.user;


                const uid =
                    createdUser.uid;


                /* =========================================
                   FINAL REFER CODE CHECK
                ========================================= */

                let referredByUid = "";
                let referredByCode = "";


                if (enteredReferCode) {

                    const referrer =
                        await getReferrer(
                            enteredReferCode,
                            uid
                        );


                    referredByUid =
                        referrer.uid;

                    referredByCode =
                        referrer.code;

                }


                /* =========================================
                   CREATE UNIQUE REFER CODE
                ========================================= */

                const ownReferCode =
                    generateReferCode(
                        username
                    );


                /* =========================================
                   RESERVE USERNAME
                   TRANSACTION PREVENTS RACE CONDITION
                ========================================= */

                const usernameRef =
                    doc(
                        db,
                        "usernames",
                        usernameLower
                    );


                await runTransaction(
                    db,
                    async (transaction) => {

                        const usernameDoc =
                            await transaction.get(
                                usernameRef
                            );


                        if (usernameDoc.exists()) {

                            throw new Error(
                                "এই username ইতিমধ্যে ব্যবহার করা হয়েছে।"
                            );

                        }


                        transaction.set(
                            usernameRef,
                            {
                                uid: uid,
                                username: username,
                                email: email,
                                createdAt:
                                    serverTimestamp()
                            }
                        );

                    }
                );


                usernameReserved = true;


                /* =========================================
                   USER DATA
                ========================================= */

                const userData = {

                    uid: uid,

                    name: fullName,
                    fullName: fullName,

                    username: username,
                    usernameLower: usernameLower,

                    email: email,
                    emailLower: email,

                    whatsapp:
                        "+88" + whatsappInput,

                    whatsappNumber:
                        "+88" + whatsappInput,

                    phone:
                        "+88" + whatsappInput,

                    referCode:
                        ownReferCode,

                    referredByUid:
                        referredByUid,

                    referredByCode:
                        referredByCode,

                    referralCount: 0,
                    successfulReferrals: 0,

                    referralBonusTotal: 0,

                    referralRewardPaid: false,

                    referralRewardAmount: 0,

                    photoURL:
                        DEFAULT_PROFILE_PHOTO,

                    balance: 0,
                    winnings: 0,

                    matchesPlayed: 0,
                    matchesWon: 0,
                    matchesLost: 0,

                    totalEarnings: 0,

                    status: "active",

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                };


                /* =========================================
                   SAVE USER PROFILE
                   ========================================= */

                const userRef =
                    doc(
                        db,
                        "users",
                        uid
                    );


                const profileBatch =
                    writeBatch(db);


                profileBatch.set(
                    userRef,
                    userData
                );


                await profileBatch.commit();


                /* =========================================
                   OPTIONAL REFERRER UPDATE
                ========================================= */

                if (referredByUid) {

                    try {

                        const referrerRef =
                            doc(
                                db,
                                "users",
                                referredByUid
                            );


                        await runTransaction(
                            db,
                            async (
                                transaction
                            ) => {

                                const refSnap =
                                    await transaction.get(
                                        referrerRef
                                    );


                                if (!refSnap.exists()) {
                                    return;
                                }


                                const refData =
                                    refSnap.data() || {};


                                const currentCount =
                                    Number(
                                        refData.referralCount || 0
                                    );


                                transaction.update(
                                    referrerRef,
                                    {
                                        referralCount:
                                            currentCount + 1,

                                        updatedAt:
                                            serverTimestamp()
                                    }
                                );

                            }
                        );

                    } catch (
                        referralUpdateError
                    ) {

                        /*
                         * Referral count update failure
                         * should NOT cancel registration.
                         */

                        console.warn(
                            "Referral count update failed:",
                            referralUpdateError
                        );

                    }

                }


                /* =========================================
                   SUCCESS
                ========================================= */

                showToast(
                    "রেজিস্ট্রেশন সফল হয়েছে! 🎉",
                    "success"
                );


                setTimeout(() => {

                    window.location.replace(
                        "index.html"
                    );

                }, 1000);


            } catch (error) {

                console.error(
                    "Registration Error:",
                    error
                );


                /* =========================================
                   ROLLBACK USERNAME
                ========================================= */

                if (
                    usernameReserved &&
                    createdUser
                ) {

                    try {

                        const usernameRef =
                            doc(
                                db,
                                "usernames",
                                usernameLower
                            );


                        await runTransaction(
                            db,
                            async (
                                transaction
                            ) => {

                                const snap =
                                    await transaction.get(
                                        usernameRef
                                    );


                                if (
                                    snap.exists() &&
                                    snap.data().uid ===
                                    createdUser.uid
                                ) {

                                    transaction.delete(
                                        usernameRef
                                    );

                                }

                            }
                        );

                    } catch (
                        rollbackError
                    ) {

                        console.warn(
                            "Username rollback failed:",
                            rollbackError
                        );

                    }

                }


                /* =========================================
                   DELETE AUTH ACCOUNT IF POSSIBLE
                ========================================= */

                if (createdUser) {

                    try {

                        await deleteUser(
                            createdUser
                        );

                    } catch (
                        deleteError
                    ) {

                        console.warn(
                            "Auth rollback failed:",
                            deleteError
                        );

                    }

                }


                /* =========================================
                   FRIENDLY ERROR MESSAGE
                ========================================= */

                let message =
                    "Registration করতে সমস্যা হয়েছে।";


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    message =
                        "এই Email দিয়ে account already আছে!";

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    message =
                        "সঠিক Email address দিন!";

                }

                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    message =
                        "Password আরও শক্ত করুন!";

                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    message =
                        "Internet connection check করুন এবং আবার চেষ্টা করুন।";

                }

                else if (
                    error.code ===
                    "permission-denied" ||
                    error.code ===
                    "PERMISSION_DENIED"
                ) {

                    message =
                        "Firebase permission সমস্যা। Firestore Rules check করুন।";

                }

                else if (error.message) {

                    message =
                        error.message;

                }


                showToast(
                    message,
                    "error"
                );


                setButtonLoading(false);

            }

        }
    );


/* =========================================================
   WHATSAPP ONLY NUMBER
========================================================= */

document
    .getElementById("whatsapp")
    .addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 11);

        }
    );


/* =========================================================
   USERNAME NORMALIZE
========================================================= */

usernameInput.addEventListener(
    "blur",
    function () {

        this.value =
            this.value
                .trim()
                .toLowerCase();

    }
);


/* =========================================================
   REFER CODE NORMALIZE
========================================================= */

referCodeInput.addEventListener(
    "blur",
    function () {

        this.value =
            this.value
                .trim()
                .toUpperCase();

    }
);


/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById("registerForm")
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                event.target.tagName !== "TEXTAREA"
            ) {

                /*
                 * Normal browser form submit handles this.
                 * This listener intentionally does not
                 * prevent default.
                 */

            }

        }
    );


/* =========================================================
   PAGE READY
========================================================= */

console.log(
    "AURA ARMAN TOUR registration system ready."
);

</script>
