<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Skill - Withdraw</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #050811; color: #f8fafc; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.9); }
        
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-left: 4px solid #3b82f6;
            color: #fff; padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }
        .toast.warning { border-left-color: #f59e0b; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-10">

    <div id="toast-container"></div>

    <!-- Header -->
    <header class="px-4 py-4 flex items-center justify-between border-b border-slate-900 bg-[#0b0f1a]/80 backdrop-blur-md sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <button onclick="history.back()" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white transition">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="text-base font-bold text-white tracking-wide">Withdraw</h1>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto px-4 py-6 space-y-5">
        
        <!-- Choose Channel Label -->
        <div class="text-center">
            <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Choose your payment channel</span>
        </div>

        <!-- Channel Selection Grid -->
        <div class="grid grid-cols-2 gap-3">
            <!-- bKash -->
            <div id="channel-bkash" onclick="selectChannel('bkash')" class="glass-card p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer border-2 border-emerald-500 transition shadow-lg relative">
                <div class="absolute top-2.5 right-2.5 w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center text-white text-[10px] shadow" id="check-bkash">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div class="w-12 h-12 bg-pink-600/10 rounded-xl flex items-center justify-center mb-2">
                    <span class="text-pink-500 font-black text-lg tracking-tighter">bKash</span>
                </div>
                <span class="text-xs font-bold text-slate-200">bKash</span>
            </div>

            <!-- Nagad -->
            <div id="channel-nagad" onclick="selectChannel('nagad')" class="glass-card p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer border-2 border-slate-800 transition shadow-lg relative opacity-70 hover:opacity-100">
                <div class="absolute top-2.5 right-2.5 w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center text-white text-[10px] shadow" id="check-nagad" style="display: none;">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div class="w-12 h-12 bg-orange-600/10 rounded-xl flex items-center justify-center mb-2">
                    <span class="text-orange-500 font-black text-lg">নগদ</span>
                </div>
                <span class="text-xs font-bold text-slate-200">Nagad</span>
            </div>
        </div>

        <!-- Form Fields -->
        <div class="space-y-4 pt-1">
            <!-- Wallet Number -->
            <div>
                <input type="text" id="wallet-number" placeholder="Enter your Wallet Number" class="w-full bg-[#0d1322] border border-slate-800 rounded-2xl px-4 py-3.5 text-white text-xs focus:outline-none focus:border-emerald-500 transition shadow-inner">
            </div>

            <!-- Amount -->
            <div>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-400 font-bold text-sm">৳</span>
                    <input type="number" id="withdraw-amount" placeholder="Amount" class="w-full bg-[#0d1322] border border-slate-800 rounded-2xl pl-9 pr-4 py-3.5 text-white text-xs focus:outline-none focus:border-emerald-500 transition shadow-inner">
                </div>
                <div class="flex justify-between items-center text-[11px] text-slate-500 px-2 mt-1.5">
                    <span>Min: ৳50</span>
                    <span>Max: ৳100000</span>
                </div>
            </div>

            <!-- Withdraw Button -->
            <button onclick="submitWithdraw()" id="withdraw-btn" class="w-full bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-500 hover:to-rose-600 text-white font-bold py-3.5 rounded-2xl transition shadow-lg text-xs uppercase tracking-wider">
                Withdraw
            </button>
        </div>

        <!-- Balance Info Card -->
        <div class="glass-card rounded-2xl p-4 flex justify-between items-center border border-slate-800 shadow">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-chart-line text-xs"></i>
                </div>
                <span class="text-xs font-semibold text-slate-300">Your Withdrawal Balance is:</span>
            </div>
            <span id="user-balance-display" class="text-sm font-black text-emerald-400">৳0</span>
        </div>

        <!-- Notice Box -->
        <div class="bg-[#0f1d17] border border-emerald-500/20 rounded-2xl p-4 space-y-1.5 shadow-md">
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[11px] font-bold text-emerald-400 tracking-wide">morning to night, no tention</span>
            </div>
            <p class="text-[11px] text-slate-300 leading-relaxed">
                সর্বনিম্ন উত্তোলন পরিমাণ টাকা ৫০ এবং সর্বোচ্চ উত্তোলন পরিমাণ টাকা ১,০০,০০০।
            </p>
        </div>

    </main>

    <!-- Firebase Logic -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let selectedChannelName = 'bkash';
        let currentUser = null;
        let userCurrentBalance = 0;

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let iconClass = "fa-solid fa-circle-check text-emerald-400";
            if (type === 'error') iconClass = "fa-solid fa-circle-xmark text-red-400";
            if (type === 'warning') iconClass = "fa-solid fa-triangle-exclamation text-amber-400";

            toast.innerHTML = `<i class="${iconClass}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.selectChannel = function(channel) {
            selectedChannelName = channel;
            const bkashCard = document.getElementById('channel-bkash');
            const nagadCard = document.getElementById('channel-nagad');
            const bkashCheck = document.getElementById('check-bkash');
            const nagadCheck = document.getElementById('check-nagad');

            if(channel === 'bkash') {
                bkashCard.className = "glass-card p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer border-2 border-emerald-500 transition shadow-lg relative";
                bkashCard.style.opacity = "1";
                bkashCheck.style.display = "flex";

                nagadCard.className = "glass-card p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer border-2 border-slate-800 transition shadow-lg relative opacity-70 hover:opacity-100";
                nagadCheck.style.display = "none";
            } else {
                nagadCard.className = "glass-card p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer border-2 border-emerald-500 transition shadow-lg relative";
                nagadCard.style.opacity = "1";
                nagadCheck.style.display = "flex";

                bkashCard.className = "glass-card p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer border-2 border-slate-800 transition shadow-lg relative opacity-70 hover:opacity-100";
                bkashCheck.style.display = "none";
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);
                    if(userSnap.exists()) {
                        userCurrentBalance = Number(userSnap.data().balance || 0);
                        document.getElementById('user-balance-display').innerText = `৳${userCurrentBalance}`;
                    } else {
                        document.getElementById('user-balance-display').innerText = `৳0`;
                    }
                } catch(e) {
                    console.error("Error fetching user balance:", e);
                }
            } else {
                showToast("দয়া করে প্রথমে লগইন করুন!", "warning");
            }
        });

        window.submitWithdraw = async function() {
            if(!currentUser) {
                showToast("লগইন করা নেই!", "error");
                return;
            }

            const number = document.getElementById('wallet-number').value.trim();
            const amount = Number(document.getElementById('withdraw-amount').value);

            if(!number) {
                showToast("দয়া করে আপনার ওয়ালেট নম্বর দিন!", "warning");
                return;
            }

            if(!amount || isNaN(amount)) {
                showToast("সঠিক অ্যামাউন্ট লিখুন!", "warning");
                return;
            }

            if(amount < 50) {
                showToast("সর্বনিম্ন উত্তোলন পরিমাণ ৫০ টাকা।", "warning");
                return;
            }

            if(amount > 100000) {
                showToast("সর্বোচ্চ উত্তোলন পরিমাণ ১,০০,০০০ টাকা।", "warning");
                return;
            }

            if(amount > userCurrentBalance) {
                showToast("আপনার পর্যাপ্ত ব্যালেন্স নেই!", "error");
                return;
            }

            const btn = document.getElementById('withdraw-btn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const timestamp = Date.now();
                
                const userRef = doc(db, "users", currentUser.uid);
                const newBalance = userCurrentBalance - amount;
                await updateDoc(userRef, { balance: newBalance });

                await addDoc(collection(db, "withdraws"), {
                    uid: currentUser.uid,
                    userId: currentUser.uid,
                    userEmail: currentUser.email || "",
                    username: currentUser.displayName || currentUser.email || "User",
                    method: selectedChannelName.toUpperCase(),
                    number: number,
                    accountNumber: number,
                    amount: amount,
                    status: "pending",
                    timestamp: timestamp,
                    createdAt: timestamp
                });

                showToast("উত্তোলন অনুরোধ সফলভাবে জমা হয়েছে!", "success");
                setTimeout(() => {
                    location.reload();
                }, 1500);

            } catch(e) {
                console.error(e);
                showToast("সমস্যা হয়েছে: " + e.message, "error");
                btn.disabled = false;
                btn.innerText = "Withdraw";
            }
        }
    </script>
</body>
</html>
