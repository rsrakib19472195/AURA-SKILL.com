<script type="module">

import {
    auth,
    db,
    DEFAULT_PROFILE_PHOTO
} from "./firebase.js";


import {
    onAuthStateChanged,
    EmailAuthProvider,
    reauthenticateWithCredential,
    updatePassword
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================
   IMGBB API
========================================= */

const IMGBB_API_KEY =
    "8edd89599e2ee6c32e119c6f147ba6f4";


const IMGBB_UPLOAD_URL =
    "https://api.imgbb.com/1/upload";


const FALLBACK_PROFILE_PHOTO =
    "https://videotourl.com/images/1789800604014-b96e1edf-d789-4513-8557-9fb63a327a13.jpg";


const PROFILE_PHOTO =
    DEFAULT_PROFILE_PHOTO ||
    FALLBACK_PROFILE_PHOTO;


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;

let selectedProfileFile = null;

let activeUpload = false;


/* =========================================
   TOAST
========================================= */

window.showToast = function(
    message,
    type = "success"
){

    const container =
        document.getElementById(
            "toast-container"
        );


    if(!container) return;


    const toast =
        document.createElement("div");


    toast.className =
        `toast ${type}`;


    let icon =
        "fa-solid fa-circle-check text-emerald-400";


    if(type === "error"){

        icon =
            "fa-solid fa-circle-xmark text-red-400";

    }


    if(type === "warning"){

        icon =
            "fa-solid fa-triangle-exclamation text-amber-400";

    }


    toast.innerHTML = `
        <i class="${icon}"></i>
        <span>${message}</span>
    `;


    container.appendChild(toast);


    setTimeout(
        ()=>{
            toast.remove();
        },
        3000
    );

};


/* =========================================
   ELEMENTS
========================================= */

const profilePhotoInput =
    document.getElementById(
        "profile-photo-input"
    );


const editPhotoButton =
    document.getElementById(
        "edit-photo-button"
    );


const profilePhoto =
    document.getElementById(
        "profile-photo"
    );


const uploadProgressWrapper =
    document.getElementById(
        "upload-progress-wrapper"
    );


const uploadProgressBar =
    document.getElementById(
        "upload-progress-bar"
    );


const uploadProgressText =
    document.getElementById(
        "upload-progress-text"
    );


/* =========================================
   PHOTO BUTTON
========================================= */

editPhotoButton.addEventListener(
    "click",
    function(){

        if(activeUpload){

            showToast(
                "আগের photo upload হচ্ছে, একটু অপেক্ষা করুন!",
                "warning"
            );

            return;
        }


        profilePhotoInput.click();

    }
);


/* =========================================
   IMAGE COMPRESSION
========================================= */

function compressImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const image =
                        new Image();


                    image.onload =
                        function(){

                            const MAX_SIZE = 1200;

                            let width =
                                image.width;

                            let height =
                                image.height;


                            if(
                                width > MAX_SIZE ||
                                height > MAX_SIZE
                            ){

                                if(width > height){

                                    height =
                                        Math.round(
                                            height *
                                            MAX_SIZE /
                                            width
                                        );

                                    width =
                                        MAX_SIZE;

                                }else{

                                    width =
                                        Math.round(
                                            width *
                                            MAX_SIZE /
                                            height
                                        );

                                    height =
                                        MAX_SIZE;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                function(blob){

                                    if(!blob){

                                        reject(
                                            new Error(
                                                "Image compression failed"
                                            )
                                        );

                                        return;

                                    }


                                    resolve(blob);

                                },
                                "image/jpeg",
                                0.82
                            );

                        };


                    image.onerror =
                        function(){

                            reject(
                                new Error(
                                    "Image load failed"
                                )
                            );

                        };


                    image.src =
                        event.target.result;

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "File read failed"
                        )
                    );

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =========================================
   PHOTO SELECT
========================================= */

profilePhotoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];


        if(!file){
            return;
        }


        if(!file.type.startsWith("image/")){

            showToast(
                "শুধু image file নির্বাচন করুন!",
                "warning"
            );

            this.value = "";

            return;
        }


        if(file.size > 10 * 1024 * 1024){

            showToast(
                "ছবির size সর্বোচ্চ 10MB হতে পারবে!",
                "warning"
            );

            this.value = "";

            return;
        }


        selectedProfileFile =
            file;


        try{

            const previewURL =
                URL.createObjectURL(file);


            profilePhoto.src =
                previewURL;


            profilePhoto.onload =
                function(){

                    URL.revokeObjectURL(
                        previewURL
                    );

                };


            showToast(
                "ছবি নির্বাচন করা হয়েছে। Update Profile চাপুন।",
                "success"
            );

        }catch(error){

            console.error(error);

            showToast(
                "ছবির preview দেখানো যায়নি!",
                "error"
            );

        }

    }
);


/* =========================================
   LOAD PROFILE
========================================= */

async function loadUserProfile(user){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    const snapshot =
        await getDoc(userRef);


    if(!snapshot.exists()){

        const defaultName =
            user.displayName ||
            user.email?.split("@")[0] ||
            "User";


        const defaultData = {

            uid:
                user.uid,

            email:
                user.email || "",

            name:
                defaultName,

            fullName:
                defaultName,

            displayName:
                defaultName,

            showName:
                defaultName,

            username:
                "",

            whatsapp:
                "",

            whatsappNumber:
                "",

            phone:
                "",

            photoURL:
                PROFILE_PHOTO,

            balance:
                0,

            winnings:
                0,

            matchesPlayed:
                0,

            matchesWon:
                0,

            matchesLost:
                0,

            totalEarnings:
                0,

            createdAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp()

        };


        await setDoc(
            userRef,
            defaultData,
            {
                merge:true
            }
        );


        fillProfileForm(
            defaultData,
            user
        );


        return;

    }


    fillProfileForm(
        snapshot.data(),
        user
    );

}


/* =========================================
   FILL PROFILE
========================================= */

function fillProfileForm(
    data,
    user
){

    const name =
        data.showName ||
        data.name ||
        data.fullName ||
        data.displayName ||
        user.displayName ||
        (
            user.email
                ? user.email.split("@")[0]
                : "User"
        );


    const username =
        data.username ||
        "";


    const email =
        user.email ||
        data.email ||
        "";


    const phone =
        data.whatsapp ||
        data.whatsappNumber ||
        data.phone ||
        "";


    const photo =
        data.photoURL ||
        data.profilePhotoURL ||
        data.avatarURL ||
        PROFILE_PHOTO;


    document.getElementById(
        "full-name"
    ).value =
        name;


    document.getElementById(
        "username"
    ).value =
        username
            ? "@" + username
            : "";


    document.getElementById(
        "email-address"
    ).value =
        email;


    document.getElementById(
        "phone-number"
    ).value =
        phone;


    profilePhoto.src =
        photo;


    document.getElementById(
        "profile-display-name"
    ).textContent =
        name;


    document.getElementById(
        "profile-display-username"
    ).textContent =
        username
            ? "@" + username
            : "Username not set";


    profilePhoto.onerror =
        function(){

            this.onerror = null;

            this.src =
                PROFILE_PHOTO;

        };

}


/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
    auth,
    async(user)=>{

        if(!user){

            showToast(
                "দয়া করে login করুন!",
                "warning"
            );


            setTimeout(
                ()=>{
                    window.location.replace(
                        "login.html"
                    );
                },
                700
            );


            return;

        }


        currentUser =
            user;


        try{

            await loadUserProfile(
                user
            );

        }catch(error){

            console.error(
                "PROFILE LOAD ERROR:",
                error
            );


            showToast(
                "Profile data load করতে সমস্যা হয়েছে!",
                "error"
            );

        }

    }
);


/* =========================================
   UPLOAD TO IMGBB
========================================= */

async function uploadProfilePhoto(file){

    if(!file){

        throw new Error(
            "No image selected"
        );

    }


    activeUpload =
        true;


    uploadProgressWrapper.style.display =
        "block";


    uploadProgressBar.style.width =
        "10%";


    uploadProgressText.textContent =
        "Preparing photo...";


    try{

        /*
         * Compress image before upload
         */

        const compressedBlob =
            await compressImage(file);


        uploadProgressBar.style.width =
            "30%";


        uploadProgressText.textContent =
            "Uploading 30%";


        /*
         * ImgBB accepts the image as
         * multipart/form-data.
         */

        const formData =
            new FormData();


        formData.append(
            "key",
            IMGBB_API_KEY
        );


        formData.append(
            "image",
            compressedBlob,
            "profile.jpg"
        );


        /*
         * Upload to ImgBB
         */

        const response =
            await fetch(
                IMGBB_UPLOAD_URL,
                {
                    method: "POST",
                    body: formData
                }
            );


        uploadProgressBar.style.width =
            "80%";


        uploadProgressText.textContent =
            "Processing 80%";


        let result;


        try{

            result =
                await response.json();

        }catch(error){

            throw new Error(
                "ImgBB response পাওয়া যায়নি"
            );

        }


        console.log(
            "IMGBB RESPONSE:",
            result
        );


        if(
            !response.ok ||
            !result ||
            !result.success ||
            !result.data ||
            !result.data.url
        ){

            const errorMessage =
                result?.error?.message ||
                "ImgBB upload failed";

            throw new Error(
                errorMessage
            );

        }


        uploadProgressBar.style.width =
            "100%";


        uploadProgressText.textContent =
            "Upload complete";


        /*
         * Direct ImgBB image URL
         */

        return result.data.url;


    }finally{

        activeUpload =
            false;

    }

}


/* =========================================
   UPDATE PROFILE
========================================= */

window.updateProfileInfo =
async function(){

    if(!currentUser){

        showToast(
            "User পাওয়া যায়নি!",
            "error"
        );

        return;

    }


    if(activeUpload){

        showToast(
            "Photo upload হচ্ছে। একটু অপেক্ষা করুন!",
            "warning"
        );

        return;

    }


    const name =
        document.getElementById(
            "full-name"
        ).value.trim();


    if(!name){

        showToast(
            "Full name খালি রাখা যাবে না!",
            "warning"
        );

        return;

    }


    const button =
        document.getElementById(
            "update-profile-btn"
        );


    button.disabled =
        true;


    button.innerText =
        selectedProfileFile
            ? "Uploading..."
            : "Updating...";


    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        let finalPhotoURL =
            profilePhoto.src;


        /*
         * Only upload when a new photo
         * has actually been selected.
         */

        if(selectedProfileFile){

            finalPhotoURL =
                await uploadProfilePhoto(
                    selectedProfileFile
                );

        }


        button.innerText =
            "Saving...";


        /*
         * Save ImgBB URL to Firestore
         */

        await setDoc(
            userRef,
            {

                uid:
                    currentUser.uid,

                name:
                    name,

                fullName:
                    name,

                showName:
                    name,

                photoURL:
                    finalPhotoURL,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        /*
         * Update current UI
         */

        profilePhoto.src =
            finalPhotoURL;


        document.getElementById(
            "profile-display-name"
        ).textContent =
            name;


        selectedProfileFile =
            null;


        profilePhotoInput.value =
            "";


        setTimeout(
            ()=>{
                uploadProgressWrapper.style.display =
                    "none";
            },
            1000
        );


        showToast(
            "Profile successfully updated!",
            "success"
        );


    }catch(error){

        console.error(
            "PROFILE UPDATE ERROR:",
            error
        );


        showToast(
            error?.message
                ? "Photo/Profile update failed: " +
                  error.message
                : "Profile update করা যায়নি!",
            "error"
        );


    }finally{

        button.disabled =
            false;


        button.innerText =
            "Update Profile";

    }

};


/* =========================================
   PASSWORD MATCH
========================================= */

const newPasswordInput =
    document.getElementById(
        "new-password"
    );


const confirmPasswordInput =
    document.getElementById(
        "confirm-password"
    );


const passwordStatus =
    document.getElementById(
        "password-status"
    );


function checkPasswordMatch(){

    const newPass =
        newPasswordInput.value;


    const confirmPass =
        confirmPasswordInput.value;


    if(!confirmPass){

        passwordStatus.classList.add(
            "hidden"
        );

        return;

    }


    passwordStatus.classList.remove(
        "hidden"
    );


    if(newPass === confirmPass){

        passwordStatus.className =
            "text-[11px] text-emerald-400";


        passwordStatus.innerHTML =
            '<i class="fa-solid fa-circle-check mr-1"></i>Password match করছে';

    }else{

        passwordStatus.className =
            "text-[11px] text-rose-400";


        passwordStatus.innerHTML =
            '<i class="fa-solid fa-circle-xmark mr-1"></i>Password match করছে না';

    }

}


newPasswordInput.addEventListener(
    "input",
    checkPasswordMatch
);


confirmPasswordInput.addEventListener(
    "input",
    checkPasswordMatch
);


/* =========================================
   CHANGE PASSWORD
========================================= */

window.changeUserPassword =
async function(){

    if(!currentUser){

        showToast(
            "User পাওয়া যায়নি!",
            "error"
        );

        return;

    }


    const currentPass =
        document.getElementById(
            "current-password"
        ).value;


    const newPass =
        document.getElementById(
            "new-password"
        ).value;


    const confirmPass =
        document.getElementById(
            "confirm-password"
        ).value;


    if(
        !currentPass ||
        !newPass ||
        !confirmPass
    ){

        showToast(
            "সব password field পূরণ করুন!",
            "warning"
        );

        return;

    }


    if(newPass.length < 6){

        showToast(
            "Password কমপক্ষে 6 characters হতে হবে!",
            "warning"
        );

        return;

    }


    if(newPass !== confirmPass){

        showToast(
            "New password match করছে না!",
            "error"
        );

        return;

    }


    if(currentPass === newPass){

        showToast(
            "নতুন password আগের password-এর মতো হতে পারবে না!",
            "warning"
        );

        return;

    }


    const button =
        document.getElementById(
            "change-password-btn"
        );


    button.disabled =
        true;


    button.innerText =
        "Changing...";


    try{

        if(!currentUser.email){

            throw new Error(
                "No email associated with account."
            );

        }


        const credential =
            EmailAuthProvider.credential(
                currentUser.email,
                currentPass
            );


        await reauthenticateWithCredential(
            currentUser,
            credential
        );


        await updatePassword(
            currentUser,
            newPass
        );


        showToast(
            "Password successfully changed!",
            "success"
        );


        document.getElementById(
            "current-password"
        ).value = "";


        document.getElementById(
            "new-password"
        ).value = "";


        document.getElementById(
            "confirm-password"
        ).value = "";


        passwordStatus.classList.add(
            "hidden"
        );


    }catch(error){

        console.error(
            "PASSWORD CHANGE ERROR:",
            error
        );


        if(
            error.code ===
            "auth/wrong-password"
            ||
            error.code ===
            "auth/invalid-credential"
        ){

            showToast(
                "Current password ভুল!",
                "error"
            );

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            showToast(
                "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন!",
                "warning"
            );

        }

        else if(
            error.code ===
            "auth/requires-recent-login"
        ){

            showToast(
                "Security-এর জন্য আবার login করে চেষ্টা করুন!",
                "warning"
            );

        }

        else{

            showToast(
                "Password change করা যায়নি!",
                "error"
            );

        }

    }finally{

        button.disabled =
            false;

        button.innerText =
            "Change Password";

    }

};
