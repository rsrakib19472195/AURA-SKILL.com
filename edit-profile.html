<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #050811;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 41, 59, 0.8);
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            border-left: 4px solid #3b82f6;
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
            max-width: 360px;
        }

        .toast.success {
            border-left-color: #10b981;
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        .toast.warning {
            border-left-color: #f59e0b;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        .locked-field {
            opacity: 0.75;
            cursor: not-allowed !important;
        }

        .profile-photo {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 9999px;
            border: 3px solid rgba(59,130,246,0.35);
            box-shadow: 0 0 25px rgba(59,130,246,0.15);
            background: #0f172a;
        }

        .photo-edit-wrapper {
            position: relative;
            width: 82px;
            height: 82px;
            margin: 0 auto 12px;
        }

        .photo-edit-button {
            position: absolute;
            right: -3px;
            bottom: -3px;
            width: 30px;
            height: 30px;
            border-radius: 9999px;
            background: #2563eb;
            color: white;
            border: 3px solid #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(37,99,235,.35);
            transition: .2s ease;
        }

        .photo-edit-button:hover {
            background: #3b82f6;
            transform: scale(1.06);
        }

        .photo-edit-button:active {
            transform: scale(.96);
        }

        .photo-edit-button:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        #profile-photo-input {
            display: none;
        }

        .photo-hint {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
        }

        #upload-progress-wrapper {
            display: none;
            width: 100%;
            margin-top: 10px;
        }

        #upload-progress-bar {
            width: 0%;
            height: 5px;
            border-radius: 999px;
            background: #3b82f6;
            transition: width .15s ease;
        }

        #upload-progress-track {
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: #1e293b;
            overflow: hidden;
        }

        #upload-progress-text {
            display: block;
            margin-top: 5px;
            font-size: 10px;
            color: #64748b;
        }

        .input-dark {
            background: rgba(2, 6, 23, .7);
            border: 1px solid #1e293b;
        }

        .input-dark:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 2px rgba(59,130,246,.08);
        }

        button:disabled {
            cursor: not-allowed;
        }
    </style>
</head>

    <script type="module">

        /* =========================================================

        ========================================================= */

        import {
            auth,
            db,

        } from "./firebase.js";

        import {
            onAuthStateChanged,
            EmailAuthProvider,
            reauthenticateWithCredential,
            updatePassword
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        import {
            doc,
            getDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        /* =========================================================
           IMGBB
        ========================================================= */

        const IMGBB_API_KEY =
            "8edd89599e2ee6c32e119c6f147ba6f4";

        const IMGBB_UPLOAD_URL =
            "https://api.imgbb.com/1/upload";


        /* =========================================================
           FALLBACK
        ========================================================= */

        const FALLBACK_PROFILE_PHOTO =
            "https://videotourl.com/images/1789800604014-b96e1edf-d789-4513-8557-9fb63a327a13.jpg";

        const PROFILE_PHOTO =
            DEFAULT_PROFILE_PHOTO || FALLBACK_PROFILE_PHOTO;


        /* =========================================================
           STATE
        ========================================================= */

        let currentUser = null;

        let selectedProfileFile = null;

        let activeUpload = false;

        let previewObjectURL = null;


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const profilePhotoInput =
            document.getElementById("profile-photo-input");

        const editPhotoButton =
            document.getElementById("edit-photo-button");

        const profilePhoto =
            document.getElementById("profile-photo");

        const displayName =
            document.getElementById("display-name");

        const displayUsername =
            document.getElementById("display-username");

        const fullNameInput =

        const usernameInput =
            document.getElementById("username");

        const emailInput =
            document.getElementById("email");

        const whatsappInput =
            document.getElementById("whatsapp");

        const updateProfileButton =
            document.getElementById("update-profile-button");

        const currentPasswordInput =
            document.getElementById("current-password");

        const newPasswordInput =
            document.getElementById("new-password");

        const confirmPasswordInput =
            document.getElementById("confirm-password");

        const passwordStatus =
            document.getElementById("password-status");

        const changePasswordButton =
            document.getElementById("change-password-button");

        const uploadProgressWrapper =

        const uploadProgressBar =

        const uploadProgressText =
            document.getElementById("upload-progress-text");

        const backButton =
            document.getElementById("back-button");


        /* =========================================================
           TOAST
        ========================================================= */

        function showToast(message, type = "success") {

            const toast =
                document.createElement("div");

            toast.className =
                `toast ${type}`;

            let icon =
                "fa-circle-check";

            if (type === "error") {
                icon = "fa-circle-xmark";
            }

            if (type === "warning") {
                icon = "fa-triangle-exclamation";
            }

            toast.innerHTML = `
                <i class="fa-solid ${icon}"></i>
                <span>${escapeHtml(message)}</span>
            `;

            document
                .getElementById("toast-container")
                .appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }


        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =========================================================
           BACK
        ========================================================= */

        backButton.addEventListener("click", () => {

            window.location.href = "profile.html";

        });


        /* =========================================================
           PHOTO SELECT
        ========================================================= */

        editPhotoButton.addEventListener("click", () => {

            if (activeUpload) return;

            profilePhotoInput.click();

        });


        profilePhotoInput.addEventListener("change", event => {

            const file =
                event.target.files?.[0];

            if (!file) return;


            if (!file.type.startsWith("image/")) {

                showToast(
                    "শুধু image file নির্বাচন করুন।",
                    "error"
                );

                profilePhotoInput.value = "";

                return;
            }


            if (file.size > 10 * 1024 * 1024) {

                showToast(
                    "ছবির size সর্বোচ্চ 10MB হতে হবে।",
                    "error"
                );

                profilePhotoInput.value = "";

                return;
            }


            selectedProfileFile = file;


            /* Instant preview */

            if (previewObjectURL) {

                URL.revokeObjectURL(previewObjectURL);

            }

            previewObjectURL =
                URL.createObjectURL(file);

            profilePhoto.src =
                previewObjectURL;


            showToast(
                "ছবি নির্বাচন করা হয়েছে। Update Profile চাপুন।",
                "success"
            );

        });


        /* =========================================================
           FAST IMAGE COMPRESS
        ========================================================= */

        async function compressImage(file) {

            /*
             * ছোট image হলে unnecessary processing না করে
             * সরাসরি upload করা হবে।
             */

            if (
                file.size <= 700 * 1024 &&
                (
                    file.type === "image/jpeg" ||
                    file.type === "image/webp"
                )
            ) {

                return file;

            }


            const bitmap =
                await createImageBitmap(file);


            const MAX_SIZE = 1000;


            let width =
                bitmap.width;

            let height =
                bitmap.height;


            if (width > MAX_SIZE || height > MAX_SIZE) {

                const ratio =
                    Math.min(
                        MAX_SIZE / width,
                        MAX_SIZE / height
                    );

                width =
                    Math.round(width * ratio);

                height =
                    Math.round(height * ratio);

            }


            const canvas =
                document.createElement("canvas");

            canvas.width =
                width;

            canvas.height =
                height;


            const ctx =
                canvas.getContext("2d", {
                    alpha: false
                });


            ctx.drawImage(
                bitmap,
                0,
                0,
                width,
                height
            );


            bitmap.close();


            const blob =
                await new Promise(resolve => {

                    canvas.toBlob(
                        resolve,
                        "image/jpeg",
                        0.78
                    );

                });


            if (!blob) {

                throw new Error(
                    "Image processing failed"
                );

            }


            return blob;

        }


        /* =========================================================
           PROGRESS
        ========================================================= */

        function setUploadProgress(
            percent,
            text
        ) {

            uploadProgressWrapper.style.display =
                "block";

            uploadProgressBar.style.width =
                `${percent}%`;

            uploadProgressText.textContent =
                text;
        }


        function hideUploadProgress() {

            setTimeout(() => {

                if (!activeUpload) {

                    uploadProgressWrapper.style.display =
                        "none";

                }

            }, 700);

        }


        /* =========================================================
           IMGBB UPLOAD
        ========================================================= */

        async function uploadProfilePhoto(file) {

            if (!file) {

                throw new Error(
                    "No image selected"
                );

            }


            activeUpload = true;

            editPhotoButton.disabled = true;

            updateProfileButton.disabled = true;


            try {

                setUploadProgress(
                    15,
                    "ছবি প্রস্তুত হচ্ছে..."
                );


                const imageBlob =
                    await compressImage(file);


                setUploadProgress(
                    35,
                    "ImgBB-তে upload হচ্ছে..."
                );


                const formData =
                    new FormData();


                formData.append(
                    "key",
                    IMGBB_API_KEY
                );


                formData.append(
                    "image",
                    imageBlob,
                    "profile.jpg"
                );


                /*
                 * Timeout রাখছি যাতে forever loading না হয়।
                 */

                const controller =
                    new AbortController();

                const timeout =
                    setTimeout(() => {

                        controller.abort();

                    }, 30000);


                let response;

                try {

                    response =
                        await fetch(
                            IMGBB_UPLOAD_URL,
                            {
                                method: "POST",
                                body: formData,
                                signal: controller.signal
                            }
                        );

                } finally {

                    clearTimeout(timeout);

                }


                setUploadProgress(
                    80,
                    "ছবি process হচ্ছে..."
                );


                let result;


                try {

                    result =
                        await response.json();

                } catch {

                    throw new Error(
                        "ImgBB response পাওয়া যায়নি।"
                    );

                }


                console.log(
                    "ImgBB:",
                    result
                );


                if (
                    !response.ok ||
                    !result ||
                    !result.success ||
                    !result.data ||
                    !result.data.url
                ) {

                    throw new Error(
                        result?.error?.message ||
                        "ImgBB upload failed"
                    );

                }


                const imageURL =
                    result.data.url;


                setUploadProgress(
                    100,
                    "Upload complete"
                );


                return imageURL;

            } catch (error) {

                if (
                    error?.name ===
                    "AbortError"
                ) {

                    throw new Error(
                        "Upload করতে বেশি সময় লাগছে। আবার চেষ্টা করুন।"
                    );

                }

                throw error;

            } finally {

                activeUpload = false;

                editPhotoButton.disabled =
                    false;

                updateProfileButton.disabled =
                    false;

                hideUploadProgress();

            }

        }


        /* =========================================================
           LOAD USER PROFILE
        ========================================================= */

        async function loadUserProfile(user) {

            try {

                /*
                 * Firebase Auth data first.
                 * এতে UI দ্রুত render হবে।
                 */

                const authName =
                    user.displayName ||
                    (
                        user.email
                            ? user.email.split("@")[0]
                            : "User"
                    );


                displayName.textContent =
                    authName;

                displayUsername.textContent =
                    user.email || "";


                /*
                 * Firestore data
                 */

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const snap =
                    await getDoc(userRef);


                if (!snap.exists()) {

                    const defaultData = {

                        uid: user.uid,

                        email:
                            user.email || "",

                        name:
                            authName,

                        fullName:
                            authName,

                        displayName:
                            authName,

                        showName:
                            authName,

                        username:
                            "",

                        whatsapp:
                            "",

                        whatsappNumber:
                            "",

                        phone:
                            "",

                        photoURL:
                            user.photoURL ||
                            PROFILE_PHOTO,

                        balance: 0,

                        winnings: 0,

                        totalMatches: 0,

                        totalWins: 0,

                        createdAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    };


                    await setDoc(
                        userRef,
                        defaultData,
                        { merge: true }
                    );


                    fillProfileForm(
                        defaultData,
                        user
                    );


                    return;

                }


                const data =
                    snap.data() || {};


                fillProfileForm(
                    data,
                    user
                );

            } catch (error) {

                console.error(
                    "PROFILE LOAD ERROR:",
                    error
                );

                /*
                 * Auth data দিয়ে minimum UI usable রাখা।
                 */

                fullNameInput.value =
                    user.displayName ||
                    (
                        user.email
                            ? user.email.split("@")[0]
                            : ""
                    );

                usernameInput.value =
                    "";

                emailInput.value =
                    user.email || "";

                whatsappInput.value =
                    "";

                displayName.textContent =
                    user.displayName ||
                    (
                        user.email
                            ? user.email.split("@")[0]
                            : "User"
                    );

                displayUsername.textContent =
                    user.email || "";

            }

        }


        /* =========================================================
           FILL FORM
        ========================================================= */

        function fillProfileForm(
            data,
            user
        ) {

            const name =
                data.showName ||
                data.name ||
                data.fullName ||
                data.displayName ||
                user.displayName ||
                (
                    user.email
                        ? user.email.split("@")[0]
                        : "User"
                );


            const username =
                data.username || "";


            const email =
                user.email ||
                data.email ||
                "";


            const phone =
                data.whatsapp ||
                data.whatsappNumber ||
                data.phone ||
                "";


            const photo =
                data.photoURL ||
                data.profilePhotoURL ||
                data.avatarURL ||
                user.photoURL ||
                PROFILE_PHOTO;


            fullNameInput.value =
                name;


            usernameInput.value =
                username;


            emailInput.value =
                email;


            whatsappInput.value =
                phone;


            displayName.textContent =
                name;


            displayUsername.textContent =
                username
                    ? `@${username}`
                    : email;


            /*
             * ImgBB URL directly.
             */

            if (photo) {

                profilePhoto.src =
                    photo;

            }


            /*
             * If remote image fails,
             * fallback image দেখাবে।
             */

            profilePhoto.onerror = () => {

                if (
                    profilePhoto.src !==
                    PROFILE_PHOTO
                ) {

                    profilePhoto.src =
                        PROFILE_PHOTO;

                }

            };

        }


        /* =========================================================
           UPDATE PROFILE
        ========================================================= */

        async function updateProfileInfo() {

            if (!currentUser) {

                showToast(
                    "User পাওয়া যায়নি।",
                    "error"
                );

                return;

            }


            if (activeUpload) {

                showToast(
                    "ছবি upload হচ্ছে, একটু অপেক্ষা করুন।",
                    "warning"
                );

                return;

            }


            const name =
                fullNameInput.value.trim();


            if (!name) {

                showToast(
                    "Full Name লিখুন।",
                    "error"
                );

                fullNameInput.focus();

                return;

            }


            const originalButtonHTML =
                updateProfileButton.innerHTML;


            updateProfileButton.disabled =
                true;


            updateProfileButton.innerHTML = `
                <i class="fa-solid fa-spinner fa-spin"></i>
                <span>Updating...</span>
            `;


            try {

                /*
                 * Existing photo first.
                 */

                let finalPhotoURL =
                    profilePhoto.src ||
                    PROFILE_PHOTO;


                /*
                 * New photo থাকলে শুধু ImgBB-তে upload।
                 */

                if (selectedProfileFile) {

                    finalPhotoURL =
                        await uploadProfilePhoto(
                            selectedProfileFile
                        );

                }


                /*
                 * Firebase Storage কোথাও ব্যবহার হচ্ছে না।
                 * Firestore-এ শুধু URL রাখা হচ্ছে।
                 */

                await setDoc(

                    doc(
                        db,
                        "users",
                        currentUser.uid
                    ),

                    {

                        uid:
                            currentUser.uid,

                        name:
                            name,

                        fullName:
                            name,

                        showName:
                            name,

                        displayName:
                            name,

                        photoURL:
                            finalPhotoURL,

                        updatedAt:
                            serverTimestamp()

                    },

                    {
                        merge: true
                    }

                );


                /*
                 * Instant UI update
                 */

                displayName.textContent =
                    name;


                profilePhoto.src =
                    finalPhotoURL;


                selectedProfileFile =
                    null;


                profilePhotoInput.value =
                    "";


                if (previewObjectURL) {

                    URL.revokeObjectURL(
                        previewObjectURL
                    );

                    previewObjectURL =
                        null;

                }


                showToast(
                    "Profile successfully updated!",
                    "success"
                );


            } catch (error) {

                console.error(
                    "UPDATE PROFILE ERROR:",
                    error
                );


                showToast(
                    error?.message ||
                    "Profile update failed.",
                    "error"
                );

            } finally {

                updateProfileButton.disabled =
                    false;

                updateProfileButton.innerHTML =
                    originalButtonHTML;

            }

        }


        updateProfileButton.addEventListener(
            "click",
            updateProfileInfo
        );


        /* =========================================================
           PASSWORD VALIDATION
        ========================================================= */

        function checkPasswordMatch() {

            const current =
                currentPasswordInput.value;

            const newPass =
                newPasswordInput.value;

            const confirm =
                confirmPasswordInput.value;


            if (!newPass && !confirm) {

                passwordStatus.textContent =
                    "";

                return;

            }


            if (newPass.length > 0 && newPass.length < 6) {

                passwordStatus.textContent =
                    "Password কমপক্ষে 6 characters হতে হবে।";

                passwordStatus.className =
                    "text-xs min-h-[18px] mb-4 text-amber-400";

                return;

            }


            if (confirm && newPass !== confirm) {

                passwordStatus.textContent =
                    "New password এবং confirm password মিলছে না।";

                passwordStatus.className =
                    "text-xs min-h-[18px] mb-4 text-rose-400";

                return;

            }


            if (
                current &&
                newPass &&
                current === newPass
            ) {

                passwordStatus.textContent =
                    "নতুন password আগের password-এর মতো হতে পারবে না।";

                passwordStatus.className =
                    "text-xs min-h-[18px] mb-4 text-amber-400";

                return;

            }


            if (
                newPass &&
                confirm &&
                newPass === confirm
            ) {

                passwordStatus.textContent =
                    "Password ঠিক আছে।";

                passwordStatus.className =
                    "text-xs min-h-[18px] mb-4 text-emerald-400";

                return;

            }


            passwordStatus.textContent =
                "";

        }


        currentPasswordInput.addEventListener(
            "input",
            checkPasswordMatch
        );

        newPasswordInput.addEventListener(
            "input",
            checkPasswordMatch
        );

        confirmPasswordInput.addEventListener(
            "input",
            checkPasswordMatch
        );


        /* =========================================================
           CHANGE PASSWORD
        ========================================================= */

        async function changeUserPassword() {

            if (!currentUser) {

                showToast(
                    "User পাওয়া যায়নি।",
                    "error"
                );

                return;

            }


            const currentPassword =
                currentPasswordInput.value;

            const newPassword =
                newPasswordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            if (!currentPassword) {

                showToast(
                    "Current password দিন।",
                    "error"
                );

                currentPasswordInput.focus();

                return;

            }


            if (!newPassword) {

                showToast(
                    "New password দিন।",
                    "error"
                );

                newPasswordInput.focus();

                return;

            }


            if (newPassword.length < 6) {

                showToast(
                    "New password কমপক্ষে 6 characters হতে হবে।",
                    "error"
                );

                return;

            }


            if (newPassword !== confirmPassword) {

                showToast(
                    "Password মিলছে না।",
                    "error"
                );

                return;

            }


            if (currentPassword === newPassword) {

                showToast(
                    "নতুন password আলাদা হতে হবে।",
                    "error"
                );

                return;

            }


            const originalHTML =
                changePasswordButton.innerHTML;


            changePasswordButton.disabled =
                true;


            changePasswordButton.innerHTML = `
                <i class="fa-solid fa-spinner fa-spin"></i>
                <span>Changing...</span>
            `;


            try {

                if (!currentUser.email) {

                    throw new Error(
                        "এই account-এর email পাওয়া যায়নি।"
                    );

                }


                const credential =
                    EmailAuthProvider.credential(
                        currentUser.email,
                        currentPassword
                    );


                await reauthenticateWithCredential(
                    currentUser,
                    credential
                );


                await updatePassword(
                    currentUser,
                    newPassword
                );


                currentPasswordInput.value =
                    "";

                newPasswordInput.value =
                    "";

                confirmPasswordInput.value =
                    "";

                passwordStatus.textContent =
                    "";


                showToast(
                    "Password successfully changed!",
                    "success"
                );


            } catch (error) {

                console.error(
                    "PASSWORD ERROR:",
                    error
                );


                let message =
                    "Password change failed.";


                if (
                    error.code ===
                    "auth/wrong-password" ||
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    message =
                        "Current password ভুল।";

                } else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    message =
                        "অনেকবার চেষ্টা করা হয়েছে। পরে আবার চেষ্টা করুন।";

                } else if (
                    error.code ===
                    "auth/requires-recent-login"
                ) {

                    message =
                        "নিরাপত্তার জন্য আবার login করে চেষ্টা করুন।";

                } else if (error.message) {

                    message =
                        error.message;

                }


                showToast(
                    message,
                    "error"
                );

            } finally {

                changePasswordButton.disabled =
                    false;

                changePasswordButton.innerHTML =
                    originalHTML;

            }

        }


        changePasswordButton.addEventListener(
            "click",
            changeUserPassword
        );


        /* =========================================================
           LOCKED INPUTS
        ========================================================= */

        [
            usernameInput,
            emailInput,
            whatsappInput
        ].forEach(input => {

            input.addEventListener(
                "keydown",
                event => {

                    event.preventDefault();

                }
            );


            input.addEventListener(
                "paste",
                event => {

                    event.preventDefault();

                }
            );


            input.addEventListener(
                "cut",
                event => {

                    event.preventDefault();

                }
            );

        });


        /* =========================================================
           AUTH
        ========================================================= */

        onAuthStateChanged(
            auth,
            async user => {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                currentUser =
                    user;


                /*
                 * Auth information immediately visible.
                 */

                const quickName =
                    user.displayName ||
                    (
                        user.email
                            ? user.email.split("@")[0]
                            : "User"
                    );


                displayName.textContent =
                    quickName;


                displayUsername.textContent =
                    user.email || "";


                fullNameInput.value =
                    quickName;


                emailInput.value =
                    user.email || "";


                /*
                 * Then Firestore profile loads.
                 */

                loadUserProfile(user);

            }
        );


        /* =========================================================
           CLEANUP
        ========================================================= */

        window.addEventListener(
            "beforeunload",
            () => {

                if (previewObjectURL) {

                    URL.revokeObjectURL(
                        previewObjectURL
                    );

                }

            }
        );

    </script>

</body>
</html>
