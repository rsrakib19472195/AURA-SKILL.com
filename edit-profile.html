<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aura Skill - Edit Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(34,197,94,.10), transparent 30%),
                radial-gradient(circle at top right, rgba(250,204,21,.10), transparent 30%),
                #f8fafc;
        }

        .glass {
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,.8);
            box-shadow: 0 15px 45px rgba(15,23,42,.08);
        }

        .input-box {
            transition: .2s ease;
        }

        .input-box:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,.10);
        }

        .disabled-input {
            background: #f1f5f9 !important;
            color: #64748b !important;
            cursor: not-allowed;
        }

        .profile-photo-wrap {
            position: relative;
            width: 118px;
            height: 118px;
            margin: auto;
        }

        .profile-photo {
            width: 118px;
            height: 118px;
            object-fit: cover;
            border-radius: 9999px;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(15,23,42,.18);
            background: #e2e8f0;
        }

        .camera-btn {
            position: absolute;
            right: 0;
            bottom: 2px;
            width: 38px;
            height: 38px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: linear-gradient(135deg,#16a34a,#22c55e);
            border: 3px solid white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(22,163,74,.35);
            transition: .2s;
        }

        .camera-btn:hover {
            transform: scale(1.06);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%) translateY(100px);
            opacity: 0;
            z-index: 9999;
            min-width: 260px;
            max-width: calc(100% - 30px);
            padding: 13px 18px;
            border-radius: 15px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: .3s ease;
            box-shadow: 0 12px 30px rgba(0,0,0,.18);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: #16a34a;
        }

        .toast.error {
            background: #dc2626;
        }

        .toast.warning {
            background: #d97706;
        }

        .loader {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="min-h-screen text-slate-800">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-slate-200">
        <div class="max-w-2xl mx-auto px-4 py-4 flex items-center gap-3">

            <a href="profile.html"
               class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div>
                <h1 class="font-bold text-lg text-slate-900">
                    Edit Profile
                </h1>

                <p class="text-xs text-slate-500">
                    Update your profile information
                </p>
            </div>

        </div>
    </header>


    <main class="max-w-2xl mx-auto px-4 py-6 pb-12">

        <!-- Profile Photo -->
        <section class="glass rounded-3xl p-6 mb-5">

            <div class="profile-photo-wrap">

                <img
                    id="profile-photo"
                    class="profile-photo"
                    src=""
                    alt="Profile">

                <button
                    type="button"
                    id="camera-button"
                    class="camera-btn"
                    title="Change profile picture">

                    <i class="fa-solid fa-camera"></i>

                </button>

                <input
                    type="file"
                    id="profile-photo-input"
                    accept="image/*"
                    class="hidden">

            </div>

            <div class="text-center mt-4">

                <h2
                    id="profile-display-name"
                    class="text-lg font-bold text-slate-900">
                    Loading...
                </h2>

                <p
                    id="profile-display-username"
                    class="text-sm text-slate-500">
                    Loading...
                </p>

                <p class="text-xs text-slate-400 mt-2">
                    Tap the camera icon to change your profile picture
                </p>

            </div>

        </section>


        <!-- Personal Information -->
        <section class="glass rounded-3xl p-5 mb-5">

            <div class="flex items-center gap-3 mb-5">

                <div class="w-10 h-10 rounded-xl bg-green-100 text-green-600 flex items-center justify-center">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>
                    <h2 class="font-bold text-slate-900">
                        Personal Information
                    </h2>

                    <p class="text-xs text-slate-500">
                        Update your basic information
                    </p>
                </div>

            </div>


            <!-- Full Name -->
            <div class="mb-4">

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Full Name
                </label>

                <div class="relative">

                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                    <input
                        id="full-name"
                        type="text"
                        placeholder="Enter your full name"
                        class="input-box w-full rounded-xl border border-slate-200 bg-white px-11 py-3.5 outline-none text-sm">

                </div>

            </div>


            <!-- Username -->
            <div class="mb-4">

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Username
                </label>

                <div class="relative">

                    <i class="fa-solid fa-at absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                    <input
                        id="username"
                        type="text"
                        disabled
                        class="input-box disabled-input w-full rounded-xl border border-slate-200 px-11 py-3.5 outline-none text-sm">

                </div>

            </div>


            <!-- Email -->
            <div class="mb-4">

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Gmail
                </label>

                <div class="relative">

                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                    <input
                        id="email-address"
                        type="email"
                        disabled
                        class="input-box disabled-input w-full rounded-xl border border-slate-200 px-11 py-3.5 outline-none text-sm">

                </div>

            </div>


            <!-- Phone -->
            <div class="mb-5">

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Phone Number
                </label>

                <div class="relative">

                    <i class="fa-solid fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                    <input
                        id="phone-number"
                        type="text"
                        disabled
                        class="input-box disabled-input w-full rounded-xl border border-slate-200 px-11 py-3.5 outline-none text-sm">

                </div>

            </div>


            <!-- Update Button -->
            <button
                type="button"
                id="update-profile-btn"
                onclick="updateProfileInfo()"
                class="w-full rounded-xl bg-gradient-to-r from-green-600 to-green-500 text-white py-3.5 font-bold shadow-lg shadow-green-200 hover:shadow-green-300 transition flex items-center justify-center gap-2">

                <i class="fa-solid fa-check"></i>
                <span>Update Profile</span>

            </button>

        </section>


        <!-- Security -->
        <section class="glass rounded-3xl p-5">

            <div class="flex items-center gap-3 mb-5">

                <div class="w-10 h-10 rounded-xl bg-yellow-100 text-yellow-600 flex items-center justify-center">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>

                <div>
                    <h2 class="font-bold text-slate-900">
                        Security
                    </h2>

                    <p class="text-xs text-slate-500">
                        Change your account password
                    </p>
                </div>

            </div>


            <!-- Current Password -->
            <div class="mb-4">

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Current Password
                </label>

                <div class="relative">

                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                    <input
                        id="current-password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter current password"
                        class="input-box w-full rounded-xl border border-slate-200 bg-white px-11 py-3.5 outline-none text-sm">

                </div>

            </div>


            <!-- New Password -->
            <div class="mb-4">

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    New Password
                </label>

                <div class="relative">

                    <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                    <input
                        id="new-password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Enter new password"
                        class="input-box w-full rounded-xl border border-slate-200 bg-white px-11 py-3.5 outline-none text-sm">

                </div>

            </div>


            <!-- Confirm Password -->
            <div class="mb-3">

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Confirm New Password
                </label>

                <div class="relative">

                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                    <input
                        id="confirm-password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Confirm new password"
                        class="input-box w-full rounded-xl border border-slate-200 bg-white px-11 py-3.5 outline-none text-sm">

                </div>

            </div>


            <p
                id="password-match"
                class="text-xs mb-5 min-h-[18px]">
            </p>


            <!-- Change Password -->
            <button
                type="button"
                id="change-password-btn"
                onclick="changePassword()"
                class="w-full rounded-xl bg-slate-900 text-white py-3.5 font-bold hover:bg-slate-800 transition flex items-center justify-center gap-2">

                <i class="fa-solid fa-key"></i>
                <span>Change Password</span>

            </button>

        </section>

    </main>


    <!-- Toast -->
    <div id="toast" class="toast"></div>


<script type="module">

    /* =========================================
       FIREBASE
    ========================================= */

    import {
        auth,
        db,
        DEFAULT_PROFILE_PHOTO
    } from "./firebase.js";

    import {
        onAuthStateChanged,
        EmailAuthProvider,
        reauthenticateWithCredential,
        updatePassword
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        doc,
        getDoc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    /* =========================================
       IMGBB
    ========================================= */

    const IMGBB_API_KEY =
        "8edd89599e2ee6c32e119c6f147ba6f4";


    /* =========================================
       DEFAULT PHOTO
    ========================================= */

    const FALLBACK_PROFILE_PHOTO =
        "https://videotourl.com/images/1789800604014-b96e1edf-d789-4513-8557-9fb63a327a13.jpg";

    const PROFILE_PHOTO =
        DEFAULT_PROFILE_PHOTO ||
        FALLBACK_PROFILE_PHOTO;


    /* =========================================
       STATE
    ========================================= */

    let currentUser = null;
    let selectedProfileFile = null;


    /* =========================================
       ELEMENTS
    ========================================= */

    const profilePhoto =
        document.getElementById("profile-photo");

    const profilePhotoInput =
        document.getElementById("profile-photo-input");

    const cameraButton =
        document.getElementById("camera-button");

    const updateProfileBtn =
        document.getElementById("update-profile-btn");

    const changePasswordBtn =
        document.getElementById("change-password-btn");


    /* =========================================
       TOAST
    ========================================= */

    function showToast(message, type = "success") {

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.className =
            "toast " + type + " show";

        clearTimeout(window.__toastTimer);

        window.__toastTimer =
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
    }


    /* =========================================
       CAMERA BUTTON
    ========================================= */

    cameraButton.addEventListener("click", () => {
        profilePhotoInput.click();
    });


    /* =========================================
       IMAGE SELECT
    ========================================= */

    profilePhotoInput.addEventListener("change", (event) => {

        const file =
            event.target.files?.[0];

        if (!file) return;


        if (!file.type.startsWith("image/")) {

            showToast(
                "শুধু image file নির্বাচন করুন!",
                "warning"
            );

            profilePhotoInput.value = "";
            return;
        }


        /* 10 MB maximum original image */

        if (file.size > 10 * 1024 * 1024) {

            showToast(
                "ছবির size সর্বোচ্চ 10MB হতে পারবে!",
                "warning"
            );

            profilePhotoInput.value = "";
            return;
        }


        selectedProfileFile = file;


        /* Instant preview */

        const previewURL =
            URL.createObjectURL(file);

        profilePhoto.src = previewURL;

        profilePhoto.onload = () => {
            URL.revokeObjectURL(previewURL);
        };


        showToast(
            "ছবি নির্বাচন করা হয়েছে। Update Profile চাপুন।",
            "success"
        );

    });


    /* =========================================
       LOAD PROFILE
    ========================================= */

    async function loadUserProfile(user) {

        const userRef =
            doc(db, "users", user.uid);

        const snapshot =
            await getDoc(userRef);


        if (!snapshot.exists()) {

            const defaultName =
                user.displayName ||
                user.email?.split("@")[0] ||
                "User";


            const defaultData = {

                uid: user.uid,

                email:
                    user.email || "",

                name:
                    defaultName,

                fullName:
                    defaultName,

                displayName:
                    defaultName,

                showName:
                    defaultName,

                username:
                    "",

                whatsapp:
                    "",

                whatsappNumber:
                    "",

                phone:
                    "",

                photoURL:
                    PROFILE_PHOTO,

                balance:
                    0,

                winnings:
                    0,

                matchesPlayed:
                    0,

                matchesWon:
                    0,

                matchesLost:
                    0,

                totalEarnings:
                    0,

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()
            };


            await setDoc(
                userRef,
                defaultData,
                { merge: true }
            );


            fillProfileForm(
                defaultData,
                user
            );

            return;
        }


        fillProfileForm(
            snapshot.data(),
            user
        );
    }


    /* =========================================
       FILL PROFILE
    ========================================= */

    function fillProfileForm(data, user) {

        const name =
            data.showName ||
            data.name ||
            data.fullName ||
            data.displayName ||
            user.displayName ||
            (user.email
                ? user.email.split("@")[0]
                : "User");


        const username =
            data.username || "";


        const email =
            user.email ||
            data.email ||
            "";


        const phone =
            data.whatsapp ||
            data.whatsappNumber ||
            data.phone ||
            "";


        const photo =
            data.photoURL ||
            data.profilePhotoURL ||
            data.avatarURL ||
            PROFILE_PHOTO;


        document.getElementById(
            "full-name"
        ).value = name;


        document.getElementById(
            "username"
        ).value =
            username
                ? "@" + username
                : "";


        document.getElementById(
            "email-address"
        ).value = email;


        document.getElementById(
            "phone-number"
        ).value = phone;


        profilePhoto.src = photo;


        document.getElementById(
            "profile-display-name"
        ).textContent = name;


        document.getElementById(
            "profile-display-username"
        ).textContent =
            username
                ? "@" + username
                : "Username not set";


        profilePhoto.onerror = function () {

            this.onerror = null;

            this.src = PROFILE_PHOTO;
        };
    }


    /* =========================================
       AUTH STATE
    ========================================= */

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                showToast(
                    "দয়া করে login করুন!",
                    "warning"
                );

                setTimeout(() => {

                    window.location.replace(
                        "login.html"
                    );

                }, 700);

                return;
            }


            currentUser = user;


            try {

                await loadUserProfile(user);

            } catch (error) {

                console.error(
                    "PROFILE LOAD ERROR:",
                    error
                );

                showToast(
                    "Profile data load করতে সমস্যা হয়েছে!",
                    "error"
                );
            }

        }
    );


    /* =========================================
       UPLOAD IMAGE TO IMGBB
    ========================================= */

    async function uploadToImgBB(file) {

        if (!file) {
            throw new Error(
                "No image selected"
            );
        }


        const formData =
            new FormData();

        formData.append(
            "key",
            IMGBB_API_KEY
        );

        formData.append(
            "image",
            file
        );


        const response =
            await fetch(
                "https://api.imgbb.com/1/upload",
                {
                    method: "POST",
                    body: formData
                }
            );


        let result = null;

        try {

            result =
                await response.json();

        } catch {

            throw new Error(
                "ImgBB response পাওয়া যায়নি"
            );
        }


        if (
            !response.ok ||
            !result?.success ||
            !result?.data?.url
        ) {

            console.error(
                "ImgBB ERROR:",
                result
            );

            throw new Error(
                result?.error?.message ||
                "ImgBB image upload failed"
            );
        }


        return result.data.url;
    }


    /* =========================================
       UPDATE PROFILE
    ========================================= */

    window.updateProfileInfo =
        async function () {

            if (!currentUser) {

                showToast(
                    "User পাওয়া যাচ্ছে না!",
                    "error"
                );

                return;
            }


            const name =
                document.getElementById(
                    "full-name"
                ).value.trim();


            if (!name) {

                showToast(
                    "Full Name দিন!",
                    "warning"
                );

                return;
            }


            updateProfileBtn.disabled = true;

            updateProfileBtn.innerHTML = `
                <span class="loader"></span>
                <span>Updating...</span>
            `;


            try {

                let finalPhotoURL = null;


                /* =================================
                   UPLOAD SELECTED PHOTO TO IMGBB
                ================================= */

                if (selectedProfileFile) {

                    updateProfileBtn.innerHTML = `
                        <span class="loader"></span>
                        <span>Photo uploading...</span>
                    `;


                    finalPhotoURL =
                        await uploadToImgBB(
                            selectedProfileFile
                        );


                    if (!finalPhotoURL) {

                        throw new Error(
                            "Photo URL পাওয়া যায়নি"
                        );
                    }
                }


                /* =================================
                   FIRESTORE DATA
                ================================= */

                const userRef =
                    doc(
                        db,
                        "users",
                        currentUser.uid
                    );


                const updateData = {

                    uid:
                        currentUser.uid,

                    name:
                        name,

                    fullName:
                        name,

                    displayName:
                        name,

                    showName:
                        name,

                    updatedAt:
                        serverTimestamp()
                };


                /* Only update photo if new photo selected */

                if (finalPhotoURL) {

                    updateData.photoURL =
                        finalPhotoURL;

                    updateData.profilePhotoURL =
                        finalPhotoURL;

                    updateData.avatarURL =
                        finalPhotoURL;
                }


                updateProfileBtn.innerHTML = `
                    <span class="loader"></span>
                    <span>Saving...</span>
                `;


                await setDoc(
                    userRef,
                    updateData,
                    { merge: true }
                );


                /* =================================
                   UPDATE LOCAL UI
                ================================= */

                if (finalPhotoURL) {

                    profilePhoto.src =
                        finalPhotoURL;

                    selectedProfileFile =
                        null;

                    profilePhotoInput.value =
                        "";
                }


                document.getElementById(
                    "profile-display-name"
                ).textContent = name;


                showToast(
                    "Profile successfully updated!",
                    "success"
                );


            } catch (error) {

                console.error(
                    "PROFILE UPDATE ERROR:",
                    error
                );


                if (
                    error?.message?.toLowerCase()
                        .includes("upload")
                ) {

                    showToast(
                        "Photo upload করা যায়নি। আবার চেষ্টা করুন!",
                        "error"
                    );

                } else {

                    showToast(
                        "Profile update করা যায়নি!",
                        "error"
                    );
                }

            } finally {

                updateProfileBtn.disabled =
                    false;

                updateProfileBtn.innerHTML = `
                    <i class="fa-solid fa-check"></i>
                    <span>Update Profile</span>
                `;
            }
        };


    /* =========================================
       PASSWORD MATCH CHECK
    ========================================= */

    const newPassword =
        document.getElementById(
            "new-password"
        );

    const confirmPassword =
        document.getElementById(
            "confirm-password"
        );

    const passwordMatch =
        document.getElementById(
            "password-match"
        );


    function checkPasswordMatch() {

        const newPass =
            newPassword.value;

        const confirmPass =
            confirmPassword.value;


        if (!newPass && !confirmPass) {

            passwordMatch.textContent =
                "";

            return;
        }


        if (newPass === confirmPass) {

            passwordMatch.textContent =
                "✓ Password matched";

            passwordMatch.className =
                "text-xs mb-5 min-h-[18px] text-green-600 font-semibold";

        } else {

            passwordMatch.textContent =
                "✕ Password does not match";

            passwordMatch.className =
                "text-xs mb-5 min-h-[18px] text-red-600 font-semibold";
        }
    }


    newPassword.addEventListener(
        "input",
        checkPasswordMatch
    );

    confirmPassword.addEventListener(
        "input",
        checkPasswordMatch
    );


    /* =========================================
       CHANGE PASSWORD
    ========================================= */

    window.changePassword =
        async function () {

            if (!currentUser) {

                showToast(
                    "User পাওয়া যাচ্ছে না!",
                    "error"
                );

                return;
            }


            const currentPass =
                document.getElementById(
                    "current-password"
                ).value;


            const newPass =
                document.getElementById(
                    "new-password"
                ).value;


            const confirmPass =
                document.getElementById(
                    "confirm-password"
                ).value;


            if (!currentPass) {

                showToast(
                    "Current password দিন!",
                    "warning"
                );

                return;
            }


            if (!newPass) {

                showToast(
                    "New password দিন!",
                    "warning"
                );

                return;
            }


            if (newPass.length < 6) {

                showToast(
                    "Password কমপক্ষে 6 characters হতে হবে!",
                    "warning"
                );

                return;
            }


            if (newPass !== confirmPass) {

                showToast(
                    "New password এবং confirm password একই নয়!",
                    "warning"
                );

                return;
            }


            if (currentPass === newPass) {

                showToast(
                    "নতুন password আগের password-এর মতো হতে পারবে না!",
                    "warning"
                );

                return;
            }


            changePasswordBtn.disabled =
                true;


            changePasswordBtn.innerHTML = `
                <span class="loader"></span>
                <span>Changing...</span>
            `;


            try {

                const email =
                    currentUser.email;


                if (!email) {

                    throw new Error(
                        "Account email পাওয়া যায়নি"
                    );
                }


                const credential =
                    EmailAuthProvider.credential(
                        email,
                        currentPass
                    );


                await reauthenticateWithCredential(
                    currentUser,
                    credential
                );


                await updatePassword(
                    currentUser,
                    newPass
                );


                document.getElementById(
                    "current-password"
                ).value = "";


                newPassword.value = "";

                confirmPassword.value = "";

                passwordMatch.textContent = "";


                showToast(
                    "Password successfully changed!",
                    "success"
                );


            } catch (error) {

                console.error(
                    "PASSWORD ERROR:",
                    error
                );


                let message =
                    "Password change করা যায়নি!";


                if (
                    error.code ===
                    "auth/wrong-password" ||
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    message =
                        "Current password ভুল!";

                } else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    message =
                        "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন!";

                } else if (
                    error.code ===
                    "auth/requires-recent-login"
                ) {

                    message =
                        "Security-এর জন্য আবার login করুন।";
                }


                showToast(
                    message,
                    "error"
                );

            } finally {

                changePasswordBtn.disabled =
                    false;

                changePasswordBtn.innerHTML = `
                    <i class="fa-solid fa-key"></i>
                    <span>Change Password</span>
                `;
            }
        };


</script>

</body>
</html>
